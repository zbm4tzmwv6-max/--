*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}button,select,input{font:inherit}button{cursor:pointer}a{color:var(--cyan)}.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--dark);color:#e3f0f1;padding:30px 19px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 20px;border-bottom:1px solid #34505a}.mark{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--deep);font-size:16px;font-weight:900;display:grid;place-items:center;letter-spacing:-1px}.brand strong{display:block;letter-spacing:.03em;font-size:16px}.brand small{font-size:11px;color:#abc5ca}.nav{display:flex;flex-direction:column;gap:7px}.nav button{background:transparent;border:0;color:#bad0d4;text-align:left;border-radius:10px;padding:14px 15px;display:flex;gap:12px;align-items:center;font-weight:640}.nav button.active,.nav button:hover{background:#214551;color:white}.nav .dot{width:7px;height:7px;border:1.5px solid currentColor;border-radius:50%;flex:none}.nav button.active .dot{background:var(--lime);border-color:var(--lime)}.sidebarfoot{margin-top:auto;font-size:11px;line-height:1.75;color:#9eb8c0;padding:14px 10px;border-top:1px solid #34505a}.main{max-width:1210px;width:100%;margin:0 auto;padding:37px clamp(20px,4.4vw,60px) 60px}.toprow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.13em;font-weight:800;text-transform:uppercase}.topmeta{color:var(--sub);font-size:12px;white-space:nowrap}.main h1{font-size:clamp(27px,3vw,40px);line-height:1.2;letter-spacing:-.04em;margin:12px 0}.lead{color:var(--sub);line-height:1.7;margin:0}.intro{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(230px,.95fr);gap:18px}.int er{filter:brightness(.95)}.btn:disabled{cursor:not-allowed;opacity:.44}.btn.ghost{background:white;border:1px solid var(--stroke);color:var(--ink)}.btn.dark{background:var(--dark)}.btn.tiny{padding:7px 12px;min-height:34px;font-size:12px}.select{margin-top:13px;border:1px solid var(--stroke);background:white;width:100%;padding:10px;border-radius:9px;color:var(--ink);outline:none}.startrow{display:flex;gap:12px;justify-content:space-between;align-items:center;border:1px solid var(--stroke);background:#fff;border-radius:17px;margin-top:16px;padding:17px 22px}.startrow strong{font-size:14px}.startrow span{font-size:12px;color:var(--sub)}.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:20px}.note a{font-weight:700}.examtop{display:flex;justify-content:space-between;gap:20px;align-items:center}.examtop h2{margin:6px 0;font-size:23px}.examnums{font-size:13px;font-weight:800}.timer{background:#e8f0f3;border-radius:100px;padding:8px 14px;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px}.timer.warn{background:var(--redd);color:var(--red)}.progress{background:#e3e9ed;width:100%;height:6px;border-radius:10px;margin:18px 0 20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--cyan);transition:width .2s}.questioncard{background:#fff;border:1px solid var(--stroke);border-radius:18px;padding:clamp(22px,4vw,38px);box-shadow:var(--shadow)}.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{font-size:11px;font-weight:750;padding:6px 10px;background:#f1f5f7;border-radius:20px;color:#556a75}.chip.b{background:var(--light);color:#0a7078}.qstem{font-size:clamp(19px,2.15vw,25px);letter-spacing:-.025em;line-height:1.6;font-weight:760;margin:23px 0}.qhint{color:var(--sub);font-size:12px;margin:0 0 14px}.options{display:grid;gap:10px}.option{background:#fff;text-align:left;border:1.5px solid var(--stroke);border-radius:13px;padding:15px 16px;min-height:55px;color:var(--ink);display:flex;gap:13px;align-items:center;line-height:1.5;font-size:14px}.option span.k{width:25px;height:25px;border-radius:8px;border:1px solid #cbd7dc;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;background:#f7fafb}.option:hover:not(:disabled){border-color:#6cbcc3;background:#f5fbfc}.option.selected{border-color:var(--cyan);background:#edfafa}.option.selected span.k{background:var(--cyan);color:white;border-color:var(--cyan)}.option:disabled{cursor:default}.option.correct{background:#eaf8f1;border-color:#79be9e}.option.incorrect{background:#fff0ed;border-color:#e3a199}.answerbox{margin-top:20px;background:#f3f8fa;border:1px solid #d5e5e9;border-radius:12px;padding:20px;font-size:13px;line-height:1.8}.answerbox strong{display:block;font-size:15px}.answerbox p{margin:7px 0}.answerbox small{color:var(--sub)}.qactions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.buttonset{display:flex;gap:10px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric{background:white;border:1px solid var(--stroke);border-radius:14px;padding:19px 23px}.metric strong{font-size:28px;display:block;font-weight:820}.metric span{font-size:12px;color:var(--sub)}.reviewitem{border:1px solid var(--stroke);border-radius:14px;background:#fff;padding:19px 22px;margin-top:12px}.reviewitem .label{font-size:11px;color:var(--cyan);font-weight:770}.reviewitem h3{font-size:15px;margin:10px 0}.reviewitem p{color:var(--sub);line-height:1.7;font-size:12px}.reviewitem .meta{font-size:12px;color:var(--ink);font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.empty{border:1px dashed #bbccd3;text-align:center;padding:62px 24px;border-radius:17px;background:#fff;color:var(--sub)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:8px}.resultBanner{background:var(--dark);padding:28px;border-radius:17px;color:white;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:25px 0}.resultBanner h2{font-size:26px;margin:4px 0}.resultBanner p{font-size:12px;line-height:1.7;color:#c1d4d9;margin:0}.resultBanner .score{font-size:45px;font-weight:850;white-space:nowrap}.checknote{font-size:11px;color:var(--sub);margin-top:7px}.footer{border-top:1px solid var(--stroke);margin-top:42px;padding-top:20px;font-size:11px;color:var(--sub);line-height:1.8}.indexgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.indexgrid .panel{min-height:150px}.sourceA{font-size:12px}.kbd{background:#eef4f6;border:1px solid var(--stroke);padding:2px 6px;border-radius:4px;font-size:11px}button:focus-visible,a:focus-visible{outline:3px solid #86c3bf;outline-offset:2px}

<script>
const QUESTIONS=[{"id":"BJ001","cat":"BJCP规则","type":"tf","stem":"通过 BJCP 啤酒网考后，就已经取得 BJCP 认证评审身份。","options":["正确","错误"],"answer":[1],"explain":"网考是参加后续品鉴评审考试的入场资格；还需通过品鉴评审考试才可获得认证身份。","tag":"认证流程","source":"https://www.bjcp.org/exam-certification/exam-program-overview/online-exam/"},{"id":"BJ002","cat":"BJCP规则","type":"tf","stem":"BJCP 啤酒网考允许考生查阅风格指南等资料。","options":["正确","错误"],"answer":[0],"explain":"网考采用开卷形式，但180题仅有60分钟，考前熟悉资料位置非常重要。","tag":"考试规则","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ003","cat":"BJCP规则","type":"single","stem":"参加 BJCP 啤酒网考时，时间与题量的正确组合是？","options":["90题／30分钟","180题／60分钟","100题／90分钟","180题／120分钟"],"answer":[1],"explain":"官方规定啤酒网考180题，限时60分钟。","tag":"考试规则","source":"https://www.bjcp.org/exam-certification/exam-program-overview/online-exam/"},{"id":"BJ004","cat":"BJCP规则","type":"tf","stem":"BJCP评审给出反馈时，应尽量描述可感知的特征，并提出建设性建议，而非仅表达个人喜恶。","options":["正确","错误"],"answer":[0],"explain":"评审需要感官描述、准确度和建设性的改进反馈；仅表达“我不喜欢”，不构成充分的评审依据。","tag":"评审方法","source":"https://www.bjcp.org/education-training/exam-preparation/beer-part-1-bjcp-process-guidelines/"},{"id":"BJ005","cat":"BJCP规则","type":"tf","stem":"2021 版 BJCP《啤酒风格指南》（Beer Style Guidelines） 仍是啤酒网考采用的现行风格标准。","options":["正确","错误"],"answer":[0],"explain":"BJCP官方说明2021版为当前啤酒风格指南，适用于网考、品鉴考试与笔试。","tag":"参考标准","source":"https://www.bjcp.org/bjcp-style-guidelines/"},{"id":"BJ006","cat":"啤酒风格","type":"tf","stem":"21A 美式 IPA（American IPA） 应以酒花为主导，发酵特征通常较干净，收口偏干。","options":["正确","错误"],"answer":[0],"explain":"21A强调突出的酒花香气与苦度、干净的发酵表现、较干的收口。","tag":"21A 美式IPA","source":"https://www.bjcp.org/style/2021/21/21A/"},{"id":"BJ007","cat":"啤酒风格","type":"single","stem":"一杯啤酒有明显香蕉酯香、丁香酚香、高碳酸感和柔软麦香，最接近以下哪类？","options":["10A 德式小麦啤酒（Weissbier）","1D 美式小麦啤酒（American Wheat Beer）","3B 捷克优质浅色拉格（Czech Premium Pale Lager）","21A 美式 IPA（American IPA）"],"answer":[0],"explain":"10A德式小麦的标志性发酵轮廓是香蕉酯香和丁香酚香。","tag":"10A 德式小麦","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ008","cat":"啤酒风格","type":"tf","stem":"1D 美式小麦啤酒（American Wheat Beer） 的典型特征包括显著丁香酚香与香蕉酯香。","options":["正确","错误"],"answer":[1],"explain":"美式小麦通常使用较干净的发酵表现；明显香蕉和丁香特征不符合1D。","tag":"1D 美式小麦","source":"https://www.bjcp.org/style/2021/1/1D/"},{"id":"BJ009","cat":"啤酒风格","type":"tf","stem":"3B 捷克优质浅色拉格（Czech Premium Pale Lager） 在低水平时允许出现双乙酰（Diacetyl），但浓重黄油味仍然是缺陷。","options":["正确","错误"],"answer":[0],"explain":"3B允许轻微至中低水平双乙酰，这并不意味着强烈黄油味符合风格。","tag":"3B 捷克优质浅色拉格","source":"https://www.bjcp.org/style/2021/3/3B/"},{"id":"BJ010","cat":"啤酒风格","type":"single","stem":"下列哪种风格通常比德国皮尔森（德式皮尔森（German Pils））更偏向柔和麦芽表现、苦度较克制？","options":["慕尼黑淡色拉格（Munich Helles）","美式 IPA（American IPA）","双倍 IPA（Double IPA）","柏林小麦酸啤（Berliner Weisse）"],"answer":[0],"explain":"慕尼黑淡色拉格（4A）倾向细腻、麦芽主导且苦度较低；德式皮尔森（German Pils）更突出清脆苦度。","tag":"4A 慕尼黑淡色拉格","source":"https://www.bjcp.org/style/2021/4/4A/"},{"id":"BJ011","cat":"啤酒风格","type":"tf","stem":"与3B 捷克优质浅色拉格（Czech Premium Pale Lager）相比，3A 捷克浅色拉格（Czech Pale Lager） 通常酒精度更低、酒体更轻。","options":["正确","错误"],"answer":[0],"explain":"3A保留捷克浅色拉格特点，但强度较低、酒体较轻。","tag":"3A与3B对比","source":"https://www.bjcp.org/style/2021/3/3A/"},{"id":"BJ012","cat":"啤酒风格","type":"single","stem":"以下哪类通常是 21A 美式 IPA（American IPA） 的更高酒精度、更强酒花表现版本？","options":["22A 双倍 IPA（Double IPA）","11A 普通英式苦啤（Ordinary Bitter）","4A 慕尼黑淡色拉格（Munich Helles）","10A 德式小麦啤酒（Weissbier）"],"answer":[0],"explain":"22A 双倍 IPA（Double IPA）比美式 IPA（American IPA）更强、更浓郁且酒花表达更高。","tag":"22A 双倍IPA","source":"https://www.bjcp.org/style/2021/22/22A/"},{"id":"BJ013","cat":"啤酒风格","type":"tf","stem":"18B 美式淡色艾尔（American Pale Ale） 通常比21A 美式 IPA（American IPA）更低酒精度，酒花强度也较温和。","options":["正确","错误"],"answer":[0],"explain":"18B总体强度和酒花苦度通常低于21A，具体风味仍有重叠。","tag":"18B与21A对比","source":"https://www.bjcp.org/style/2021/18/18B/"},{"id":"BJ014","cat":"啤酒风格","type":"tf","stem":"21B 黑 IPA（Black IPA） 应具有突出的焦糊味、浓烈黑麦芽烘烤味，盖过酒花香气。","options":["正确","错误"],"answer":[1],"explain":"黑IPA应保留IPA平衡；深色麦芽仅作辅助，不应出现强烈焦糊或明显主导的烘烤味。","tag":"21B 黑IPA","source":"https://www.bjcp.org/style/2021/21/"},{"id":"BJ015","cat":"啤酒风格","type":"single","stem":"25C 比利时金色烈性艾尔（Belgian Golden Strong Ale） 的典型组合是？","options":["浅色、高发酵度、偏干、高碳酸","深黑色、厚重焦糊、低碳酸","低酒精、强乳酸味、无酒花","浓烈木桶香、高残糖、低碳酸"],"answer":[0],"explain":"比利时金色烈性艾尔浅色、高发酵度、高碳酸、较轻酒体与干爽收口。","tag":"25C 比利时金色烈性","source":"https://www.bjcp.org/style/2021/25/25C/"},{"id":"BJ016","cat":"啤酒风格","type":"tf","stem":"10B 深色德式小麦啤酒（Dunkles Weissbier） 可同时具有德式小麦酵母的香蕉／丁香发酵特征和更明显的深色麦芽风味。","options":["正确","错误"],"answer":[0],"explain":"10B保留小麦酵母特征，并有更深色、更丰富的麦芽风味。","tag":"10B 深色德式小麦","source":"https://www.bjcp.org/style/2021/10/10B/"},{"id":"BJ017","cat":"啤酒风格","type":"single","stem":"哪类啤酒主要以清洁乳酸酸度、较低酒精度、很高的碳酸感为识别要点？","options":["23A 柏林小麦酸啤（Berliner Weisse）","9A 双博克（Doppelbock）","15C 爱尔兰加强世涛（Irish Extra Stout）","21A 美式 IPA（American IPA）"],"answer":[0],"explain":"23A柏林小麦酸啤强调乳酸酸度、较轻酒体、低酒精和高碳酸。","tag":"23A 柏林小麦酸","source":"https://www.bjcp.org/style/2021/23/23A/"},{"id":"BJ018","cat":"啤酒风格","type":"tf","stem":"25B 赛松（Saison） 的典型收口通常偏干，且可出现果香、辛香酵母特征。","options":["正确","错误"],"answer":[0],"explain":"赛松通常高度发酵、较高碳酸、干爽，果香与辛香来自酵母和酒花的组合。","tag":"25B 赛松","source":"https://www.bjcp.org/style/2021/25/25B/"},{"id":"BJ019","cat":"啤酒风格","type":"tf","stem":"4A 慕尼黑淡色拉格（Munich Helles） 的典型平衡应当比5D 德式皮尔森（German Pils）更加突出尖锐苦度。","options":["正确","错误"],"answer":[1],"explain":"慕尼黑淡色拉格（Helles）注重柔和麦芽和克制苦度；德式皮尔森（German Pils）苦度与收口通常更突出。","tag":"浅色拉格比较","source":"https://www.bjcp.org/style/2021/4/4A/"},{"id":"BJ020","cat":"啤酒风格","type":"single","stem":"与美式小麦啤酒（American Wheat）相比，10A 德式小麦啤酒（Weissbier）最具辨识度的区别通常是？","options":["明显的香蕉酯香与丁香酚香","一定使用烟熏麦芽","必须具有乳酸酸度","必须使用美式酒花干投"],"answer":[0],"explain":"德式小麦的酵母特征更鲜明，美式小麦强调干净发酵。","tag":"小麦风格对比","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ021","cat":"啤酒风格","type":"tf","stem":"11A 普通英式苦啤（Ordinary Bitter） 通常属于相对低酒精度的英式苦啤，适合体现麦芽、酒花与酵母的平衡。","options":["正确","错误"],"answer":[0],"explain":"普通英式苦啤（Ordinary Bitter）是日常饮用的低度英式苦啤，麦芽与苦度、酯香应均衡。","tag":"11A 英式苦啤","source":"https://www.bjcp.org/style/2021/11/11A/"},{"id":"BJ022","cat":"啤酒风格","type":"single","stem":"下列哪种风格以较强麦芽轮廓为主，常见面包皮／深色麦芽的美拉德风味，苦度通常不占主导？","options":["9A 双博克（Doppelbock）","21A 美式 IPA（American IPA）","23A 柏林小麦酸啤（Berliner Weisse）","1D 美式小麦啤酒（American Wheat）"],"answer":[0],"explain":"双博克（Doppelbock）属于强烈、富麦芽风味的德式博克家族酒款。","tag":"9A 双博克","source":"https://www.bjcp.org/style/2021/9/9A/"},{"id":"BJ023","cat":"啤酒风格","type":"tf","stem":"16A 甜世涛（Sweet Stout） 可因乳糖等不可发酵糖而产生明显甜度与较饱满的口感。","options":["正确","错误"],"answer":[0],"explain":"甜世涛（甜世涛（Sweet Stout））通常比干世涛更甜、更丰满，乳糖是常见做法。","tag":"16A 甜世涛","source":"https://www.bjcp.org/style/2021/16/16A/"},{"id":"BJ024","cat":"啤酒风格","type":"multi","stem":"关于21A 美式 IPA（American IPA），选择所有正确表述。","options":["酒花香气可以是柑橘、松脂、热带水果等","通常要求强烈烤焦味压倒酒花","整体平衡通常偏向酒花","可接受明显粗糙、灼烧般的收敛感"],"answer":[0,2],"explain":"21A鼓励多样酒花表达，但要求苦味有支撑且避免明显粗糙感；重度焦糊不是典型特点。","tag":"21A 美式IPA","source":"https://www.bjcp.org/style/2021/21/21A/"},{"id":"BJ025","cat":"啤酒风格","type":"multi","stem":"比较德式小麦（10A）和美式小麦（1D），哪些陈述正确？","options":["10A常有香蕉酯香","1D应具有典型丁香酚香","1D通常较干净、突出谷物小麦风味","10A通常具有较高碳酸感"],"answer":[0,2,3],"explain":"10A酵母风味较突出；1D酵母轮廓较干净。二者都可能有不错的碳酸感。","tag":"小麦风格对比","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ026","cat":"啤酒风格","type":"multi","stem":"下列哪些描述符合3B 捷克优质浅色拉格（Czech Premium Pale Lager）的典型表现？","options":["面包感较丰富的麦芽","辛香、草本或花香酒花","圆润但不粗糙的苦度","浓烈醋酸感是典型风味"],"answer":[0,1,2],"explain":"3B有较丰富的麦芽与欧洲型酒花平衡，通常不应有明显醋酸。","tag":"3B 捷克优质浅色拉格","source":"https://www.bjcp.org/style/2021/3/3B/"},{"id":"BJ027","cat":"啤酒风格","type":"multi","stem":"关于25B 赛松（Saison），选择所有正确表述。","options":["通常收口很干","可具有辛香或果香发酵特征","通常碳酸感较高","典型要求厚重、黏腻、极甜的收口"],"answer":[0,1,2],"explain":"高度发酵、干爽与较高碳酸是赛松的重要特征；厚重甜腻不合适。","tag":"25B 赛松","source":"https://www.bjcp.org/style/2021/25/25B/"},{"id":"BJ028","cat":"啤酒风格","type":"multi","stem":"哪些表述更符合德国皮尔森与慕尼黑淡色拉格的风格对比？","options":["德式皮尔森（German Pils）往往呈现更鲜明的苦度","慕尼黑淡色拉格（Munich Helles）通常更强调细致麦芽","两者都必须有明显香蕉酯香","两者均属浅色拉格"],"answer":[0,1,3],"explain":"德式皮尔森（German Pils）更清脆偏苦；慕尼黑淡色拉格（Helles）更柔和平衡且偏麦芽；都不是德式小麦。","tag":"浅色拉格比较","source":"https://www.bjcp.org/style/2021/5/5D/"},{"id":"BJ029","cat":"啤酒风格","type":"multi","stem":"关于22A 双倍 IPA（Double IPA），哪些描述通常正确？","options":["强度通常高于21A 美式 IPA（American IPA）","强调酒花表现与较干的收口","典型风格应表现强烈溶剂味","属于高酒精度的IPA相关风格"],"answer":[0,1,3],"explain":"双倍 IPA（Double IPA）保持酒花主导与可饮用性，酒精可感但刺激性溶剂味不应成为优点。","tag":"22A 双倍IPA","source":"https://www.bjcp.org/style/2021/22/22A/"},{"id":"BJ030","cat":"感官与异味","type":"single","stem":"某杯啤酒有类似奶油爆米花的味道，应首先怀疑什么化合物？","options":["双乙酰 Diacetyl","乙醛 Acetaldehyde","二甲基硫 DMS","异戊酸 Isovaleric acid"],"answer":[0],"explain":"双乙酰典型呈黄油、奶油糖或黄油爆米花风味；是否为缺陷取决于风格与强度。","tag":"双乙酰","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ031","cat":"感官与异味","type":"single","stem":"闻到显著的水煮玉米／罐头玉米气味，最应考虑？","options":["DMS（二甲基硫）","异戊酸","单宁","氧化纸板味"],"answer":[0],"explain":"DMS常描述为熟玉米味，高水平可能与煮沸、冷却等工艺有关。","tag":"DMS","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ032","cat":"感官与异味","type":"single","stem":"明显的生青苹果、青叶气味最常关联哪项？","options":["乙醛 Acetaldehyde","乳酸 Lactic acid","双乙酰 Diacetyl","乙酸乙酯 Ethyl acetate"],"answer":[0],"explain":"乙醛典型呈生青苹果或青草等气味，可见于未充分成熟的啤酒。","tag":"乙醛","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ033","cat":"感官与异味","type":"single","stem":"一款原本酒花新鲜的啤酒出现纸板、陈旧纸张气息，最应考虑？","options":["氧化 Oxidation","乳酸发酵","正常丁香酚香","正常DMS"],"answer":[0],"explain":"纸板／陈旧纸味常与氧化有关，尤其须控制发酵后的氧接触。","tag":"氧化","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ034","cat":"感官与异味","type":"tf","stem":"收敛感（Astringency）与苦度（Bitterness）是完全相同的感官概念。","options":["正确","错误"],"answer":[1],"explain":"收敛感常是口腔干涩、粗糙、收缩感；苦度则是味觉强度，两者可同时出现但并不等同。","tag":"收敛感","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ035","cat":"感官与异味","type":"tf","stem":"丁香、胡椒一类的辛香有时与啤酒中的酚类（Phenols）相关。","options":["正确","错误"],"answer":[0],"explain":"酚类可以表现为丁香、胡椒等辛香，也可能造成烟熏／药味等不同感官印象。","tag":"酚类","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ036","cat":"感官与异味","type":"tf","stem":"酯类（Esters）可以带来梨、香蕉、苹果等水果气息，且在部分啤酒风格中属于期望特征。","options":["正确","错误"],"answer":[0],"explain":"酯类是发酵过程中形成的芳香物质，是否适合取决于对应风格。","tag":"酯类","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ037","cat":"感官与异味","type":"multi","stem":"哪些属于啤酒常见的缺陷或感官描述与对应关系？","options":["双乙酰—黄油／奶油糖","DMS—熟玉米","乙醛—青苹果","氧化—更强烈的新鲜酒花香"],"answer":[0,1,2],"explain":"三种关联均是BJCP常见缺陷线索；氧化一般使新鲜酒花表现下降，可能带来纸板或陈旧感。","tag":"异味辨识","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ038","cat":"感官与异味","type":"multi","stem":"对于明显收敛、涩口的啤酒，哪些操作可能是合理的排查方向？","options":["检查洗糟水pH是否过高","评估是否过度洗糟","检查是否有过量提取的谷壳单宁","认定一定是因为酒花品种不够昂贵"],"answer":[0,1,2],"explain":"洗糟条件、谷壳单宁等均可导致收敛；不存在由酒花价格直接决定的规律。","tag":"收敛感","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ039","cat":"酿造与原料","type":"tf","stem":"在其他条件相近时，提高糖化温度往往会降低麦汁可发酵性，使成酒更丰满。","options":["正确","错误"],"answer":[0],"explain":"较高糖化温度倾向产生更多不易被酵母发酵的糊精，通常会提高终点密度和酒体。","tag":"糖化温度","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ040","cat":"酿造与原料","type":"tf","stem":"冷端干投酒花主要用于增加酒花香气，但并不保证所有情况下苦度都完全不变。","options":["正确","错误"],"answer":[0],"explain":"干投首要作用是提高香气与风味，但酒花多酚、氧化葎草酮（humulinones）等因素也可能影响感知苦度。","tag":"干投酒花","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ041","cat":"酿造与原料","type":"single","stem":"若希望降低传统拉格中剩余的双乙酰，哪项做法通常更有针对性？","options":["在主发酵尾期安排适当升温的双乙酰休止","发酵结束后立即彻底滤除酵母","向酒中加入更多晶体麦芽","延长酒花煮沸到几天"],"answer":[0],"explain":"双乙酰休止让健康酵母有机会进一步还原双乙酰。","tag":"双乙酰休止","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ042","cat":"酿造与原料","type":"tf","stem":"用来抑制水中微生物的氯或氯胺，如果处理不当，可能在啤酒中形成不良酚味。","options":["正确","错误"],"answer":[0],"explain":"氯和氯胺可能导致氯酚相关药味等缺陷，酿造水处理很重要。","tag":"水处理","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ043","cat":"酿造与原料","type":"single","stem":"啤酒发酵后包装过程，应优先避免什么操作来降低氧化风险？","options":["剧烈泼溅、混入空气","使用CO₂置换容器中的空气","检查罐／瓶密封","低温储存"],"answer":[0],"explain":"发酵后氧接触可促进氧化，尤其损害酒花导向型啤酒的鲜度。","tag":"冷端控氧","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ044","cat":"酿造与原料","type":"tf","stem":"煮沸麦汁并及时冷却通常有助于降低DMS残留风险。","options":["正确","错误"],"answer":[0],"explain":"DMS具有挥发性，充分开放煮沸以及及时冷却有利于减少其积累。","tag":"DMS控制","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ045","cat":"酿造与原料","type":"multi","stem":"哪些措施通常有助于改善啤酒氧化控制？","options":["灌装时尽量减少空气混入","尽可能保持包装容器良好密封","使用CO₂置换部分容器氧气","装瓶时反复搅动，让空气充分进入"],"answer":[0,1,2],"explain":"冷端避免增氧、密封良好、CO₂置换是常见控氧措施。","tag":"冷端控氧","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ046","cat":"酿造与原料","type":"multi","stem":"哪些环节可能影响最终的发酵酯香或其他发酵异味？","options":["酵母菌株","发酵温度","投酵母量和酵母健康","罐身贴纸颜色"],"answer":[0,1,2],"explain":"酵母菌株、温度与健康状况都会影响发酵代谢物。","tag":"发酵管理","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"}];

function home(){let avg=saved.history.length?Math.round(saved.history.reduce((a,x)=>a+x.percent,0)/saved.history.length):0;let n=saved.history.length;return `<div class="toprow"><span class="eyebrow">BJCP 啤酒评审认证 · 备考练习</span><span class="topmeta">独立原创练习 / 非官方考试平台</span></div><div class="intro"><div class="intro-card"><span class="eyebrow">简体中文网考模拟 · 试用版</span><h1>把风格知识，<br>练成答题速度。</h1><p>全部采用简体中文题干与解析，风格名称附英文对照。覆盖<span style="color:#fff;font-weight:800">风格 · 异味 · 酿造 · 规则</span>。选择练习题量，立即开始；做错的题会自动归档，支持反复重练。</p></div><div class="statcard"><div class="minititle">你目前的练习记录</div><div class="heroNum">${avg}% <small>平均正确率</small></div><div><div class="bar"><div style="width:${avg}%"></div></div><div class="minor">${n} 次完成 · ${saved.wrong.length} 道待重练错题<br>数据仅存于当前浏览器</div></div></div></div><div class="sectionhead"><h2>快速开始</h2><span>判断题 / 单选题 / 多选题</span></div><div class="configs"><div class="panel"><h3>01 / 知识点范围</h3><p>针对薄弱环节集中练习；默认随机抽题。</p><select class="select" id="catSelect">${CATEGORY.map(x=>`<option value="${esc(x)}" ${x===state.cat?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="panel"><h3>02 / 练习题量</h3><p>从10题尝试，再逐步增加到46题。</p><div class="pillrow">${[10,20,46].map(n=>`<button class="pill ${state.count===n?'active':''}" data-count="${n}">${n}题</button>`).join('')}</div></div><div class="panel"><h3>03 / 练习方式</h3><p>逐题解析适合学习，限时模拟适合冲刺。</p><div class="pillrow"><button class="pill active" onclick="begin('practice')">边做边看解析</button><button class="pill" onclick="begin('mock')">限时模拟</button></div></div></div><div class="startrow"><div><strong>推荐：20题入门练习</strong><div><span>实时答案解析 · 自动记录错题 · 结束后按专题诊断</span></div></div><div class="buttonset"><button class="btn dark" onclick="exportQuestions()">↓ 导出题库 JSON</button><button class="btn" onclick="begin('practice')">开始练习 →</button></div></div><p class="note"><strong>考试参考：</strong>正式BJCP啤酒网考为180题、60分钟、正确116题及格。本试用版限时模拟按每题20秒设置倒计时，按同等正确率计算练习通过参考线；不代表BJCP官方评分或题目难度。<br>依据：<a href="https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/" target="_blank" rel="noopener">官方网考学习指南</a> · <a href="https://www.bjcp.org/bjcp-style-guidelines/" target="_blank" rel="noopener">2021风格指南</a> · <a href="https://www.bjcp.org/education-training/education-resources/beer-faults/" target="_blank" rel="noopener">异味资料</a></p>`}

function begin(mode,fromWrong=false){stopClock();let catBox=$('#catSelect')||$('#mockCat');if(catBox)state.cat=catBox.value;let list=fromWrong?saved.wrong.map(getQ).filter(Boolean):QUESTIONS.filter(q=>state.cat==='全部分类'||q.cat===state.cat);if(!list.length){alert('当前没有可练习题目。');return;}let qs=shuffle(list).slice(0,fromWrong?list.length:state.count);state.run={mode,qs,index:0,answers:{},checked:{},deadline:mode==='mock'?Date.now()+qs.length*20000:null,fromWrong,done:false};state.report=null;state.view='session';render();if(mode==='mock'){state.tick=setInterval(()=>{if(!state.run||state.run.mode!=='mock'){stopClock();return}if(Date.now()>=state.run.deadline){finish(true)}else{let t=$('#timer');if(t){let left=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(left);t.classList.toggle('warn',left<60)}}},300)}window.scrollTo(0,0)}
function stopClock(){if(state.tick){clearInterval(state.tick);state.tick=null}}

function getSelected(q){return (state.run.answers[q.id]||[])}
function same(a,b){return [...a].sort().join(',')===[...b].sort().join(',')}
function choose(i){let r=state.run;if(!r||r.done)return;let q=r.qs[r.index];if(r.mode==='practice'&&r.checked[q.id])return;let a=getSelected(q);r.answers[q.id]=q.type==='multi'?(a.includes(i)?a.filter(x=>x!==i):[...a,i]):[i];renderSessionQuestion()}
function check(){let r=state.run;if(!r)return;let q=r.qs[r.index];if(!getSelected(q).length)return;r.checked[q.id]=true;renderSessionQuestion()}
function move(step){let r=state.run;if(!r)return;if(r.index+step>=r.qs.length){finish(false);return}r.index=Math.max(0,r.index+step);render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(auto){stopClock();let r=state.run;if(!r||r.done)return;r.done=true;let judged=r.qs.map(q=>{let selected=r.answers[q.id]||[];return {id:q.id,selected,correct:same(selected,q.answer),attempted:selected.length>0,cat:q.cat}});let hit=judged.filter(x=>x.correct).length;let wrong=judged.filter(x=>!x.correct).map(x=>x.id);const bad=new Set([...saved.wrong,...wrong]);judged.filter(x=>x.correct).forEach(x=>bad.delete(x.id));saved.wrong=[...bad];const rep={date:new Date().toLocaleString('zh-CN'),mode:r.mode,fromWrong:r.fromWrong,total:r.qs.length,correct:hit,attempted:judged.filter(x=>x.attempted).length,percent:Math.round(hit/r.qs.length*100),timeout:!!auto,judged};saved.history.unshift({date:rep.date,total:rep.total,correct:rep.correct,percent:rep.percent,mode:rep.mode});saved.history=saved.history.slice(0,60);persist();state.report=rep;state.view='results';render();window.scrollTo(0,0)}
function session(){let r=state.run,q=r.qs[r.index],num=r.index+1,answered=r.qs.filter(q=>(r.answers[q.id]||[]).length>0).length,left=r.mode==='mock'?Math.ceil((r.deadline-Date.now())/1000):null;return `<div class="examtop"><div><div class="eyebrow">${r.mode==='mock'?'限时模拟':'专项练习'} / ${r.fromWrong?'错题重练':'原创模拟题库'}</div><h2>第 ${num} 题 <span style="color:var(--sub);font-size:15px;font-weight:500">/ ${r.qs.length}</span></h2></div><div class="examnums">已作答 ${answered}/${r.qs.length}${left!==null?`<div class="timer ${left<60?'warn':''}" id="timer">${clock(left)}</div>`:''}</div></div><div class="progress"><span style="width:${num/r.qs.length*100}%"></span></div><div id="qarea"></div><p class="note">${r.mode==='practice'?'答题后点击“核对答案”查看解析。':'模拟过程中不显示答案；未作答题目会计为错误。'} &nbsp; · &nbsp; <a href="${E}" target="_blank">官方考试说明</a></p>`}
function renderSessionQuestion(){let area=$('#qarea');let r=state.run;if(!r||!area)return;let q=r.qs[r.index],a=getSelected(q),shown=!!r.checked[q.id],good=same(a,q.answer);let opts=q.options.map((opt,i)=>{let sel=a.includes(i),correct=q.answer.includes(i),className=shown&&correct?'correct':shown&&sel&&!correct?'incorrect':sel?'selected':'';return `<button type="button" class="option ${className}" ${shown?'disabled':''} onclick="choose(${i})"><span class="k">${q.type==='multi'?(sel?'✓':'□'):'ABCDE'[i]}</span><span>${esc(opt)}</span></button>`}).join('');area.innerHTML=`<section class="questioncard"><div class="qhead"><span class="chip b">${esc(q.cat)}</span><span class="chip">${esc(KIND[q.type])}</span><span class="chip">${esc(q.tag)}</span></div><div class="qstem">${esc(q.stem)}</div><p class="qhint">${q.type==='multi'?'本题为多选：可选多个答案，必须全部选对才计分。':q.type==='tf'?'请选择“正确”或“错误”。':'单选题：请选择一个最佳答案。'}</p><div class="options">${opts}</div>${shown?`<div class="answerbox"><strong style="color:${good?'var(--green)':'var(--red)'}">${good?'✓ 回答正确':'× 回答错误'} · 标准答案：${names(q.answer)}</strong><p>${esc(q.explain)}</p><small>知识点：${esc(q.tag)}　 <a href="${q.source}" target="_blank" rel="noopener noreferrer">查阅BJCP官方依据 ↗</a></small></div>`:''}<div class="qactions"><button class="btn ghost" onclick="${r.index===0?"quit()":"move(-1)"}">${r.index===0?'退出练习':'← 上一题'}</button><div class="buttonset">${r.mode==='practice'&&!shown?`<button class="btn dark" ${a.length?'':'disabled'} onclick="check()">核对答案</button>`:''}${r.mode==='practice'&&!shown?`<button class="btn ghost" onclick="move(1)">跳过 →</button>`:`<button class="btn" onclick="move(1)">${r.index===r.qs.length-1?'交卷 / 查看成绩':'下一题 →'}</button>`}${r.mode==='mock'?`<button class="btn ghost" onclick="finish(false)">提前交卷</button>`:''}</div></div></section>`}
function quit(){if(!confirm('结束当前练习并返回首页？本次未交卷，不计入成绩。'))return;switchView('home')}
function results(){let r=state.report;let passed=r.correct/r.total>=116/180;let breakdown=CATEGORY.slice(1).map(c=>{let z=r.judged.filter(x=>x.cat===c);return z.length?`<div class="metric"><strong>${z.filter(x=>x.correct).length}<span style="font-size:17px;color:var(--sub)">/${z.length}</span></strong><span>${c}</span></div>`:''}).join('');let mistakes=r.judged.filter(x=>!x.correct);return `<div class="toprow"><span class="eyebrow">考试结果 / 练习成绩</span><span class="topmeta">${esc(r.date)}</span></div><h1>本轮完成</h1><div class="resultBanner"><div><div class="eyebrow" style="color:var(--lime)">${passed?'达到参考通过线':'建议继续练习'}</div><h2>${r.correct} / ${r.total} 题正确</h2><p>${r.timeout?'本轮因倒计时结束而自动交卷。':'已完成本轮练习。'} 正式考试的及格线为116/180；这里仅对照正确率，不代表真实考试结论。</p></div><div class="score">${r.percent}%</div></div><div class="grid2">${breakdown}</div><div class="sectionhead"><h2>错题与漏答（${mistakes.length}）</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出练习记录</button><button class="btn tiny" onclick="repeatWrong()" ${!saved.wrong.length?'disabled':''}>重练全部错题 →</button></div></div>${mistakes.length?mistakes.map((x,i)=>{let q=getQ(x.id);return `<div class="reviewitem"><div class="label">${esc(q.cat)} · ${esc(q.id)} · ${x.attempted?'答错':'未答'}</div><h3>${i+1}. ${esc(q.stem)}</h3><div class="meta">你的选择：${x.selected.length?names(x.selected):'未作答'}　正确答案：${names(q.answer)}</div><p>${esc(q.explain)} <a href="${q.source}" target="_blank" rel="noopener">官方资料 ↗</a></p></div>`}).join(''):'<div class="empty"><strong>本轮全对</strong>这一轮没有错题。</div>'}<div class="buttonset" style="margin-top:22px"><button class="btn dark" onclick="switchView('home')">返回首页</button><button class="btn ghost" onclick="begin('${r.mode}')">再做一轮 →</button></div>`}
function repeatWrong(){state.cat='全部分类';begin('practice',true)}
function wrong(){let qs=saved.wrong.map(getQ).filter(Boolean);return `<div class="toprow"><span class="eyebrow">专项巩固 / 错题本</span><span class="topmeta">本机持久保存</span></div><h1>错题重练</h1><p class="lead">完成整轮练习后，答错或未答题目会加入错题本；重练答对的题会自动移出。</p><div class="sectionhead"><h2>${qs.length} 道待巩固</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出记录</button><button class="btn tiny" ${qs.length?'':'disabled'} onclick="repeatWrong()">开始错题重练 →</button></div></div>${qs.length?qs.map(x=>`<div class="reviewitem"><div class="label">${esc(x.cat)} · ${esc(KIND[x.type])} · ${esc(x.tag)}</div><h3>${esc(x.stem)}</h3><p>练习答对后可从错题本移除。 <a href="${x.source}" target="_blank" rel="noopener">查看相关官方知识点 ↗</a></p></div>`).join(''):'<div class="empty"><strong>还没有错题</strong>完成一轮模拟或专项练习后，这里会记录需要复习的内容。<div style="margin-top:18px"><button class="btn" onclick="switchView(&#39;home&#39;)">去做题 →</button></div></div>'}<div class="note">如果需要清空所有练习记录，可点击：<button class="btn tiny ghost" onclick="resetAll()">清空本机记录</button>。此操作无法撤销。</div>`}
function resetAll(){if(!confirm('确认清除错题及所有历史成绩？不可撤销。'))return;saved={wrong:[],history:[],saved:[]};persist();render()}
function index(){let groups=CATEGORY.slice(1).map(c=>({cat:c,tags:[...new Set(QUESTIONS.filter(q=>q.cat===c).map(q=>q.tag))],n:QUESTIONS.filter(q=>q.cat===c).length}));return `<div class="toprow"><span class="eyebrow">知识点索引 / 分类学习</span><span class="topmeta">2021 年版《啤酒风格指南》</span></div><h1>知识点索引</h1><p class="lead">按主题检索常考概念，点击开始针对性练习。每一道题均附有 BJCP 官方参考资料链接；题干与解析采用简体中文，风格名称保留英文对照。</p><div class="indexgrid" style="margin-top:24px">${groups.map(g=>`<div class="panel"><h3>${esc(g.cat)} <span style="color:var(--sub);font-size:12px;font-weight:500">· ${g.n}题</span></h3><p>${g.tags.map(esc).join(' · ')}</p><button class="btn tiny ghost" style="margin-top:18px" onclick="focusCategory('${g.cat}')">练这一类 →</button></div>`).join('')}</div><div class="sectionhead"><h2>官方资料入口</h2></div><div class="panel"><p style="font-size:14px"><a href="${G}" target="_blank" rel="noopener">BJCP 2021 啤酒风格指南 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${E}" target="_blank" rel="noopener">BJCP 网考学习指南与题型范围 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${F}" target="_blank" rel="noopener">BJCP Beer Faults 异味排查 ↗</a></p></div><div class="startrow"><div><strong>可导出本试用题库 JSON</strong><div><span>包含题干、选项、答案、解析、知识点与来源链接。</span></div></div><button class="btn dark" onclick="exportQuestions()">下载 JSON ↘</button></div>`}
function focusCategory(cat){state.cat=cat;switchView('home')}
function render(){let content=state.view==='home'?home():state.view==='exam'?modeHome():state.view==='session'?session():state.view==='results'?results():state.view==='wrong'?wrong():index();$('#app').innerHTML=content+'<footer class="footer">独立简体中文教育练习工具 · 非 BJCP 官方产品。题目均为原创模拟题，并非BJCP未公开真题。<br>引用官方资料仅供备考核对；建议考试前再查官方指南的最新更正。<span style="float:right">V0.3 · 2026-10-11</span></footer>';if(state.view==='session')renderSessionQuestion();document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{state.count=Number(b.dataset.count);render()}));let e=$('#catSelect')||$('#mockCat');if(e)e.addEventListener('change',()=>{state.cat=e.value});}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

// V0.3: 可恢复的答题进度。所有记录只写入本机 localStorage，不上传服务器。
const PROGRESS_KEY='bjcp-cn-web-progress-v03';
function stash(){
  let r=state.run;
  if(!r||r.done)return;
  try { localStorage.setItem(PROGRESS_KEY,JSON.stringify({mode:r.mode,qs:r.qs.map(q=>q.id),index:r.index,answers:r.answers,checked:r.checked,deadline:r.deadline,fromWrong:r.fromWrong,updatedAt:Date.now()})); } catch(e){}
}
function loadStash(){
  try {
    let o=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');
    if(!o||!Array.isArray(o.qs)||!o.qs.length)return null;
    let q=o.qs.map(getQ);
    if(q.some(x=>!x))return null;
    return {mode:o.mode,qs:q,index:Math.max(0,Math.min(o.index||0,q.length-1)),answers:o.answers||{},checked:o.checked||{},deadline:o.deadline||null,fromWrong:!!o.fromWrong,done:false};
  } catch(e){return null}
}
function forgetStash(){try{localStorage.removeItem(PROGRESS_KEY)}catch(e){}}
function relaunchTimer(){
  stopClock();
  if(!state.run||state.run.mode!=='mock')return;
  if(Date.now() >= state.run.deadline){ finish(true);return; }
  state.tick=setInterval(()=>{
    if(!state.run||state.run.mode!=='mock'){stopClock();return}
    if(Date.now()>=state.run.deadline){finish(true);return}
    let t=$('#timer'); if(t){let l=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(l);t.classList.toggle('warn',l<60)}
  },300);
}
function resumeSession(){
  let r=loadStash();
  if(!r){alert('没有可以恢复的练习进度。');render();return}
  state.run=r; state.report=null;state.view='session';
  render();relaunchTimer();window.scrollTo(0,0);
}
const _home=home;
home=function(){
  let html=_home();
  let r=loadStash();
  const resume=r?`<div class="resume-bar"><div><b>上次练习尚未完成</b><p>第 ${r.index+1} / ${r.qs.length} 题 · ${r.mode==='mock'?'限时模拟':'专项练习'}${r.mode==='mock'&&Date.now()>=r.deadline?' · 已超时':''}</p></div><button class="btn dark" onclick="resumeSession()">继续答题 →</button></div>`:'';
  const hint=`<div class="mobile-hint"><strong>📱 把题库放到 iPhone 主屏幕</strong>Safari 打开本网页 → 点击「分享」→「添加到主屏幕」。以后点图标就能打开。<div class="minor">练习记录仅保存在当前浏览器，本机可恢复未交卷的进度。清除 Safari 网站数据后，记录也可能消失；不会自动跨设备同步。</div></div>`;
  return resume+html+hint;
}
const _begin=begin;
begin=function(...args){forgetStash();_begin(...args);stash()};
const _choose=choose;
choose=function(...args){_choose(...args);stash()};
const _check=check;
check=function(...args){_check(...args);stash()};
const _move=move;
move=function(...args){_move(...args);stash()};
const _finish=finish;
finish=function(...args){_finish(...args);forgetStash()};
const _quit=quit;
quit=function(){let had=state.run;_quit();if(had && state.view==='home')forgetStash()};
const _reset=resetAll;
resetAll=function(){let had=saved.history.length+saved.wrong.length;_reset();if(had && saved.history.length===0 && saved.wrong.length===0)forgetStash()};
window.addEventListener('pagehide',stash);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stash();else if(state.run?.mode==='mock'&&Date.now()>=state.run.deadline)finish(true)});
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

render();
</script></body></html>
