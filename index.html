跃开始","确保煮沸剧烈且无盖，时间超过 60 分钟","熄火后迅速冷却麦汁","确保发酵前有足够的氧气供应/通气","降低糖化温度以促进更易发酵的麦汁形成"],"answer":[3],"explain":"慕尼黑淡色（BJCP 4A） 是德式拉格，果香酯应极低。明显果香说明酯类过高。\nD（确保发酵前有足够的氧气供应）正确。 充足的氧气供应可促进酵母健康生长，减少酯类生成（低溶\n氧是酯类升高的诱因之一）。\nA（高温投放酵母）会增加酯类；B（煮沸）解决 DMS；C（冷却）解决 DMS/乙醛；E（低温糖化）提\n高发酵度，不直接减少酯类。","tag":"原题 212","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":212},{"id":"S213","cat":"啤酒风格与比较","type":"single","stem":"美国拉格（American Lager）和捷克高级淡色拉格（Czech Premium Pale Lager）相似之处 在于：","options":["两者都使用软水酿造","两者都使用玉米或大米辅料酿造","两者都不应有萨兹啤酒花风味","两者通常都有萨兹啤酒花的风味","两者都可能具有贵族啤酒花的风味"],"answer":[4],"explain":"A（软水）错误。 美国拉格不要求软水；捷克拉格传统使用较软水质。\nB（玉米/大米辅料）错误。 美国拉格使用辅料；捷克拉格不使用辅料。\nC（不应有萨兹风味）错误。 捷克拉格应有萨兹酒花风味。\nD（都有萨兹风味）错误。 美国拉格不一定使用萨兹。\nE（都可能具有贵族啤酒花风味）正确。 两者均可使用贵族型酒花（花香/辛香）。","tag":"原题 213","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":213},{"id":"S214","cat":"啤酒风格与比较","type":"tf","stem":"烟熏味是一种与酚类相关的风味或香气。","options":["正确","错误"],"answer":[0],"explain":"烟熏味（smoky） 来源于酚类化合物（如愈创木酚、丁香酚等），属于酚类风味谱系。","tag":"原题 214","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":214},{"id":"S215","cat":"BJCP评审与制度","type":"tf","stem":"\"首席\"评委经管事同意后，可委托管事填写其组别啤酒的封面表。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】同类比赛封面表责任描述待核\nBJCP 比赛规程明确规定：首席评委不得接触或填写封面表，以保证盲评公正性。","tag":"原题 215","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"同类比赛封面表责任描述待核","sourceNo":215},{"id":"S216","cat":"啤酒风格与比较","type":"tf","stem":"外国特浓世涛（Foreign Extra Stout）和燕麦世涛（Oatmeal Stout）的苦味范围相似。","options":["正确","错误"],"answer":[1],"explain":"外国特浓世涛（BJCP 16D）：IBU 范围为 30-70。\n燕麦世涛（BJCP 16B）：IBU 范围为 20-40。\n两者苦味范围不完全重叠，外国特浓世涛苦味更高。","tag":"原题 216","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":216},{"id":"S217","cat":"啤酒风格与比较","type":"tf","stem":"麦芽提取物酿酒师只能酿造轻体啤酒。","options":["正确","错误"],"answer":[1],"explain":"麦芽提取物酿酒师可以通过调整麦芽提取物种类（浅色/深色/琥珀）、添加特色谷物（水晶麦芽、巧克\n力麦芽等）和控制糖化/发酵参数来酿造不同酒体、颜色和风味的啤酒。\n麦芽提取物与全麦芽一样可以酿造多种风格，包括烈性啤酒。","tag":"原题 217","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":217},{"id":"S218","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母可以产生酚类化合物。","options":["正确","错误"],"answer":[0],"explain":"野生酵母（尤其是 Brettanomyces 和非酿酒酵母属）可代谢阿魏酸等前体产生挥发性酚类化合物（4-\n乙基苯酚、4-乙烯基愈创木酚），赋予马毯、药味、烟熏等特征。","tag":"原题 218","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":218},{"id":"S219","cat":"酿造原料与工艺","type":"tf","stem":"酵母投加不足可能导致酒精感粗糙。","options":["正确","错误"],"answer":[0],"explain":"酵母投加不足（低接种率） 导致酵母经历更多对数生长期，产生高水平高级醇（fusel alcohols），\n表现为粗糙、溶剂感、辛辣的酒精特征。","tag":"原题 219","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":219},{"id":"S220","cat":"啤酒风格与比较","type":"tf","stem":"贵族啤酒花香气适用于淡色出口啤酒（German Helles Exportbier）和德国皮尔森啤酒 （German Pils）。","options":["正确","错误"],"answer":[0],"explain":"德国淡色出口啤酒（BJCP 5A） 和 德国皮尔森（BJCP 5D） 均以贵族型酒花（花香/辛香） 为特征性\n香气。","tag":"原题 220","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":220},{"id":"S221","cat":"酿造原料与工艺","type":"tf","stem":"小麦啤酒酵母通常是拉格酵母菌株。","options":["正确","错误"],"answer":[1],"explain":"小麦啤酒（Weissbier） 使用艾尔酵母（Saccharomyces cerevisiae） 的上发酵菌株，而非拉格酵\n母。\n德式小麦啤酒的典型丁香/香蕉特征正是来自艾尔酵母的酚类和酯类代谢。","tag":"原题 221","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":221},{"id":"S222","cat":"酿造原料与工艺","type":"tf","stem":"瓶装啤酒只能通过添加可发酵糖进行二次发酵来碳酸化。","options":["正确","错误"],"answer":[1],"explain":"瓶装啤酒可以通过强制碳酸化（force carbonation） 在装瓶前注入 CO₂，然后瓶装密封。\n添加可发酵糖进行瓶内二次发酵（瓶内发酵）只是方法之一，并非唯一方法。","tag":"原题 222","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":222},{"id":"S223","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 荣誉特级大师评委（Honorary Grand Master Judge）无需参加 BJCP 考试。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】BJCP荣誉等级免试规则待核\n荣誉特级大师（Honorary Grand Master） 是 BJCP 授予对啤酒行业有重大贡献人士的荣誉称号，不\n要求通过常规 BJCP 考试。\n该称号不通过考试获得，而是通过评审委员会提名授予。","tag":"原题 223","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"BJCP荣誉等级免试规则待核","sourceNo":223},{"id":"S224","cat":"酿造原料与工艺","type":"tf","stem":"苦味化合物可能由野生酵母污染产生。","options":["正确","错误"],"answer":[1],"explain":"啤酒中的苦味（bitterness） 主要来自酒花 α-酸的异构化。\n野生酵母污染（如 Brettanomyces）通常产生酚类（马毯/药味）、酸味、酯类等缺陷，而非苦味化合\n物。","tag":"原题 224","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":224},{"id":"S225","cat":"啤酒风格与比较","type":"tf","stem":"丰富复杂的麦芽味通常是深色博克啤酒的主要风味成分。","options":["正确","错误"],"answer":[0],"explain":"深色博克（BJCP 5B） 以丰富、复杂的麦芽风味为核心特征，包括美拉德产物、焦糖、太妃糖、烤面包\n等。","tag":"原题 225","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":225},{"id":"S226","cat":"啤酒风格与比较","type":"single","stem":"奶油艾尔（Cream Ale）的原始比重范围是：","options":["1.044 到 1.050","1.050 到 1.060","1.048 到 1.055","1.035 到 1.045","1.042 到 1.055"],"answer":[4],"explain":"奶油艾尔（BJCP 1C） 的 OG 范围为 1.042–1.055。\n此为淡色、清爽的艾尔风格，比重中等偏低。","tag":"原题 226","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":226},{"id":"S227","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。守护啤酒（Bière de Garde）和加州普通啤酒（California Common）的 不同之处在于：","options":["Bière de Garde 比加州普通啤酒苦味较低","守护啤酒比加州普通啤酒更突出麦芽风味","它们都可能具有质朴的特性，Bière de Garde 中的啤酒花和加州普通啤酒中的氧化作用产生这种特 性","它们都可能具有质朴特征，分别由守护啤酒中的氧化和加州普通啤酒中的啤酒花产生","守护啤酒的酒体比加州普通啤酒更饱满"],"answer":[1,3,4],"explain":"【答案尚待核验】守护啤酒与加州普通啤酒的描述有歧义\nBière de Garde（BJCP 26A） 与 加州普通啤酒（BJCP 19A） 对比：\nA（苦味较低）错误。 Bière de Garde IBU 18-28，加州普通啤酒 IBU 30-45，加州普通苦味更高，\nBière de Garde 确实苦味较低，但 A 表述\"比加州普通啤酒苦味较低\"实际上正确？需要检查——Bière\nde Garde IBU 18-28 确实低于加州普通啤酒的 30-45，但 Bière de Garde 啤酒花风味和苦味均较低，\nA 实际上正确，但本题答案设定为 B、D、E，需谨慎。根据 BJCP 指南，Bière de Garde 的苦味为中等\n偏低，加州普通为中等，故 A 正确。但题目要求选择不同之处，A 为相似点（均低苦味）？需检查。本\n题按标准答案设置为 B、D、E。\nB（守护啤酒更突出麦芽风味）正确。 Bière de Garde 以麦芽为主导（烤面包/坚果/焦糖），加州普通\n啤酒以酒花为主导。\nC（酒花 vs 氧化）错误。 描述混淆了两者质朴特征的来源。\nD（氧化 vs 酒花）正确。 Bière de Garde 的质朴特征来自氧化/陈年；加州普通啤酒的质朴特征来自酒\n花（木质/薄荷）。\nE（守护啤酒酒体更饱满）正确。 Bière de Garde 酒体中等至饱满，加州普通啤酒酒体中等。","tag":"原题 227","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"守护啤酒与加州普通啤酒的描述有歧义","sourceNo":227},{"id":"S229","cat":"酿造原料与工艺","type":"tf","stem":"硫酸盐增强啤酒花的苦味。","options":["正确","错误"],"answer":[0],"explain":"硫酸盐（SO₄²⁻） 在酿造水中增强啤酒花苦味的感知锐度，使苦味更干脆、清脆。","tag":"原题 229","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":229},{"id":"S230","cat":"酿造原料与工艺","type":"tf","stem":"苏格兰淡色啤酒（Scottish Light）和普通苦啤（Ordinary Bitter）都可能具有中高碳酸化水平。","options":["正确","错误"],"answer":[1],"explain":"苏格兰淡色啤酒（BJCP 14A）：碳酸化为低至中等（low to medium）。\n普通苦啤（BJCP 11A）：碳酸化为中等（medium）（瓶装版）或低（木桶版）。\n两者均非\"中高碳酸化\"。","tag":"原题 230","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":230},{"id":"S231","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。氯酚类物质可能被感知为：","options":["纸质感","烟熏味","草本味","臭鼬味","塑料味"],"answer":[1,4],"explain":"氯酚（chlorophenols） 是氯与酚类化合物反应生成的缺陷产物，典型风味为药味（medicinal）、\n塑料味（plastic）、创可贴（band-aid）、烟熏味（smoky）。\nA（纸质感）→氧化；C（草本味）→贵族酒花；D（臭鼬味）→光化学反应。","tag":"原题 231","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":231},{"id":"S232","cat":"啤酒风格与比较","type":"multi","stem":"美国琥珀艾尔（American Amber Ale）和加州普通啤酒（California Common）通常与其他 美国艾尔风格共享的相似特征是：","options":["自然野生发酵","低二乙酰","涩味","主要使用美国原料","泡沫保持力差"],"answer":[1,3],"explain":"美国琥珀艾尔（BJCP 19B） 和 加州普通啤酒（BJCP 19A） 均为美式艾尔风格：\nB（低二乙酰）正确。 美式风格通常要求双乙酰低至无。\nD（主要使用美国原料）正确。 这是所有美式风格的共性。\nA（野生发酵）错误——两者均为纯酵母发酵；C（涩味）缺陷；E（泡沫保持力差）非风格共性。","tag":"原题 232","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":232},{"id":"S233","cat":"啤酒风格与比较","type":"single","stem":"陈酿会增强啤酒的哪种特征？","options":["硫醇","纸板味","酚类","溶剂味","啤酒花苦味"],"answer":[1],"explain":"陈酿（aging） 会导致啤酒氧化，产生纸板味（cardboard/papery）、雪利酒味、陈旧味等老化特\n征。\n啤酒花苦味（E）在陈酿中会减弱（α-酸降解）。","tag":"原题 233","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":233},{"id":"S234","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 认证等级的啤酒评审考试最高分为 79%。","options":["正确","错误"],"answer":[1],"explain":"BJCP 认证等级（Certified）要求品鉴考试得分≥60%，最高分为 100%。\n79%是认证评委（Certified） 的最低通过分数的误解？实际上 60%为通过线。","tag":"原题 234","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":234},{"id":"S235","cat":"BJCP评审与制度","type":"tf","stem":"如果可能，每组评审中应至少有一名 BJCP 等级评委。","options":["正确","错误"],"answer":[0],"explain":"BJCP 比赛规程要求：每组评审中应至少有一名认证评委（Certified） 或更高级别评委。\n这是为了保证评审质量和一致性。","tag":"原题 235","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":235},{"id":"S236","cat":"啤酒风格与比较","type":"single","stem":"小麦啤酒（Weissbier）的香气特征最佳描述为：","options":["颗粒感的皮尔森麦芽，低辛辣度的啤酒花和低二甲基硫（DMS）","轻盈的小麦味，带有草本和辛辣香气，显著的花香啤酒花味","软质小麦，适度的柑橘和香料，轻微的酒精感","软质小麦，适度的香蕉酯和丁香酚","蜂蜜般的麦芽甜味，适中的芫荽和柑橘香气"],"answer":[3],"explain":"德式小麦啤酒（BJCP 10A） 的香气特征为软质小麦（soft wheat），适度的香蕉酯（banana\nesters，乙酸异戊酯） 和丁香酚（clove phenolics，4-乙烯基愈创木酚）。\nA/B/C/E 均不符合德式小麦特征（E 描述更接近白啤酒 Witbier）。","tag":"原题 236","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":236},{"id":"S237","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母污染可能增加苦味。","options":["正确","错误"],"answer":[1],"explain":"野生酵母污染通常产生酚类、酸味、酯类等缺陷，不增加苦味。\n苦味来自酒花 α-酸异构化，与酵母（野生或纯种）无关。","tag":"原题 237","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":237},{"id":"S238","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。以下哪些风味特征可在强烈苦啤（Strong Bitter）和美式波特（American Porter）中找到？","options":["低二乙酰","适度的矿物质/硫磺特征","适度的果香酯类","黑麦芽特征","英国啤酒花特性"],"answer":[2,4],"explain":"强烈苦啤（BJCP 11C） 和 美式波特（BJCP 20A）：\nC（适度的果香酯类）正确。 两者均使用艾尔酵母，具有低至中等的果酯。\nE（英国啤酒花特性）正确。 强烈苦啤使用英式酒花；美式波特允许英式酒花（或美式酒花），但英式\n酒花可出现在两者中。\nA（低二乙酰）——强烈苦啤允许低二乙酰，美式波特要求低二乙酰，不完全匹配；B（矿物质/硫磺）\n——非两者典型；D（黑麦芽）——美式波特有，强烈苦啤无。","tag":"原题 238","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":238},{"id":"S239","cat":"啤酒风格与比较","type":"tf","stem":"爱尔兰红艾尔（Irish Red Ale）可能具有烤面包和焦糖麦芽香气。","options":["正确","错误"],"answer":[0],"explain":"爱尔兰红艾尔（BJCP 15A） 的麦芽特征包括烤面包（toasty）、焦糖（caramel） 和轻度烘烤特征。","tag":"原题 239","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":239},{"id":"S240","cat":"啤酒风格与比较","type":"tf","stem":"小麦啤酒（Weissbier）可能有泡泡糖味。","options":["正确","错误"],"answer":[0],"explain":"德式小麦啤酒（BJCP 10A） 使用特定艾尔酵母菌株，在较高发酵温度下可产生泡泡糖\n（bubblegum） 酯类特征（主要是乙酸乙酯和乙酸异戊酯的组合），是风格允许的特征。","tag":"原题 240","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":240},{"id":"S241","cat":"BJCP评审与制度","type":"tf","stem":"在评审前几小时内应避免食用辛辣或油腻的食物。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评委在评审前应避免食用辛辣、油腻、重口味食物，因为这些食物会刺激味蕾、残留异味，干扰\n对啤酒香气和风味的敏感度。\n建议评审前食用清淡食物（如面包、饼干）。","tag":"原题 241","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":241},{"id":"S242","cat":"酿造原料与工艺","type":"tf","stem":"初始酵母数量翻倍一到三次被认为是最佳的。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】酵母初始数量翻倍次数题干不清\n酵母投放量通常以细胞计数/密度衡量，而非“翻倍次数”。\n标准投放率：艾尔约 0.75-1.0 百万细胞/mL/°P，拉格约 1.5-2.0 百万细胞/mL/°P。\n“翻倍一到三次”不是酵母投放的衡量标准。","tag":"原题 242","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"酵母初始数量翻倍次数题干不清","sourceNo":242},{"id":"S243","cat":"啤酒风格与比较","type":"single","stem":"啤酒浑浊可能由以下原因引起：","options":["酯类","酚类化合物","聚酯","二甲基硫","多酚"],"answer":[4],"explain":"多酚（polyphenols） 与蛋白质结合形成多酚-蛋白质复合物，是冷浑浊（chill haze） 和永久浑浊的\n主要成因。\nA（酯类）→风味化合物，非浑浊成因；B（酚类）→风味化合物；C（聚酯）→非啤酒相关；D\n（DMS）→风味化合物。","tag":"原题 243","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":243},{"id":"S244","cat":"酿造原料与工艺","type":"single","stem":"酵母细胞死亡称为：","options":["还原","浸出","自溶","克劳森（发酵添加法）","冲洗"],"answer":[2],"explain":"自溶（autolysis） 是酵母细胞死亡后自身酶分解细胞内容物的过程，释放出氨基酸、脂肪酸、核苷酸\n等，可产生橡胶味、肉汤味、硫味等缺陷。\nA（还原）→化学过程；B（浸出）→萃取过程；D（克劳森法）→再发酵添加工艺；E（冲洗）→洗糟\n操作。","tag":"原题 244","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":244},{"id":"S245","cat":"啤酒风格与比较","type":"tf","stem":"虽然脏杯子会影响比利时啤酒花边，但不会影响泡沫保持。","options":["正确","错误"],"answer":[1],"explain":"脏杯子上的油脂、洗涤剂残留会破坏啤酒泡沫的表面张力，不仅影响花边（lacing），也会显著降低泡\n沫稳定性（泡沫保持）。\n清洁的玻璃杯是啤酒品鉴的基本前提。","tag":"原题 245","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":245},{"id":"S246","cat":"啤酒风格与比较","type":"tf","stem":"比利时金色烈性艾尔的余味中通常有低至中等的啤酒花苦味。","options":["正确","错误"],"answer":[0],"explain":"比利时金色烈性艾尔（BJCP 25C） 的余味应有低至中等的啤酒花苦味（low to moderate hop\nbitterness），用于平衡高酒精度和麦芽甜味。\nIBU 范围为 25-35。","tag":"原题 246","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":246},{"id":"S247","cat":"啤酒风格与比较","type":"single","stem":"对深色淡啤（Dark Mild）外观的最佳描述是：","options":["深琥珀色，晶莹透亮，泡沫持久，呈棕褐色。","黑色，清澈，带有短暂的奶油色棕褐色泡沫头。","中棕色，清澈度很好，泡沫为适中棕褐色。","深棕色，微浑浊，带有短暂的乳白色泡沫头。","深铜色，清澈，带有坚硬的乳白色持久泡沫。"],"answer":[2],"explain":"深色淡啤（BJCP 13A） 的外观为：颜色中棕色（medium brown），清澈（clear），泡沫为适中棕\n褐色（moderate tan）。\nA（深琥珀色）色度过浅；B（黑色）色度过深；D（微浑浊）不应浑浊；E（深铜色）色度偏浅。","tag":"原题 247","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":247},{"id":"S248","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。德国皮尔森啤酒的收尾和余味应具有：","options":["迅速消退的啤酒花香","干型至中干型收尾","半甜到干爽的收尾","持久的啤酒花香","持久的酒精温热感"],"answer":[1,3],"explain":"德国皮尔森（BJCP 5D） 的收尾/余味特征：\nB（干型至中干型收尾）正确。 该风格要求干爽收尾。\nD（持久的啤酒花香）正确。 啤酒花苦味和香气在余味中持久。\nA（迅速消退）错误——酒花应持久；C（半甜）错误——应为干型；E（酒精温热感）错误——ABV\n4.4%-5.2%，酒精度低。","tag":"原题 248","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":248},{"id":"S249","cat":"啤酒风格与比较","type":"tf","stem":"慕尼黑深色啤酒在麦芽甜味和中等啤酒花苦味之间平衡均匀。","options":["正确","错误"],"answer":[0],"explain":"慕尼黑深色啤酒（BJCP 6A） 以麦芽甜味为主导，苦味（IBU 18-28）为中等偏低，用于平衡麦芽风味，\n达到均衡口感。","tag":"原题 249","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":249},{"id":"S250","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。适合慕尼黑淡色博克（Helles Bock）和双倍博克（Doppelbock）的口感特 征可能包括：","options":["无涩味","持久的刺激感","轻微酒精暖感","中等碳化","全身型"],"answer":[0,2,3],"explain":"淡色博克（BJCP 5A） 和 双倍博克（BJCP 5C） 的口感特征：\nA（无涩味）正确。 涩味为缺陷。\nC（轻微酒精暖感）正确。 高酒精度带来温和暖感。\nD（中等碳化）正确。 碳酸化为中等。\nB（持久的刺激感）错误——不应有刺激感；E（全身型）——与“口感”描述不匹配（疑似“full-\nbodied”但表述不当）。","tag":"原题 250","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":250},{"id":"S251","cat":"啤酒风格与比较","type":"tf","stem":"淡色博克可被视为深色博克的较温和、低酒精版本。","options":["正确","错误"],"answer":[1],"explain":"淡色博克（Helles Bock/Maibock，BJCP 5A） 和深色博克（Dark Bock，BJCP 5B） ABV 范围均\n为 6.3%-7.2%，酒精度相同。\n主要区别是颜色和麦芽风味（淡色博克以淡色麦芽/轻微酒花为特征，深色博克以深色麦芽/美拉德产物\n为特征）。","tag":"原题 251","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":251},{"id":"S252","cat":"BJCP评审与制度","type":"tf","stem":"桌上的首席评委应按照比赛管理的指示填写其品鉴组的啤酒封面表。","options":["正确","错误"],"answer":[1],"explain":"BJCP 比赛规程：首席评委不得接触或填写封面表（cover sheet），以保证盲评公正性。\n封面表应由比赛组织者或指定工作人员填写。","tag":"原题 252","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":252},{"id":"S253","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。哪些情况通常会导致涩味？","options":["高 pH 冲洗水中的单宁提取","野生酵母产生的酚类化合物","过度冲洗","糖化 pH 值高于 6.0","将特色谷物浸泡在沸水中"],"answer":[0,2,3,4],"explain":"涩味（astringency） 由多酚/单宁与口腔唾液蛋白结合产生，过量单宁萃取是主因：\nA（高 pH 冲洗水中的单宁提取）正确。 高 pH（>6.0）洗糟会过度萃取麦壳中的单宁。\nC（过度冲洗）正确。 过量洗糟会萃取过多多酚。\nD（糖化 pH 高于 6.0）正确。 高 pH 促进单宁溶解。\nE（特色谷物浸泡在沸水中）正确。 高温长时间浸泡深色谷物会萃取过多单宁。\nB（野生酵母酚类）错误——酚类产生药味/烟熏/马毯味，非涩味。","tag":"原题 253","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":253},{"id":"S254","cat":"啤酒风格与比较","type":"single","stem":"深色博克啤酒的麦芽特征通常是：","options":["口感干净，带有轻微谷物和奶油玉米香气","谷物味，带有干净的皮尔森麦芽特征","复杂且丰富，带有轻微烘烤和咖啡香气","复杂且丰富，带有面包和烘烤香气","浅至中等，带有轻微面包和焦糖香气"],"answer":[3],"explain":"深色博克（BJCP 5B） 的麦芽特征为复杂且丰富（complex and rich），带有面包（bread）和烘烤\n（toasty）香气。\nA 描述接近淡色拉格；B 描述接近皮尔森；C（咖啡香气）更接近世涛；E 描述酒体过轻。","tag":"原题 254","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":254},{"id":"S255","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。啤酒中的浑浊可以通过以下方法减少：","options":["使用明胶","过滤","糖化温度高于 150°F (65°C)","使用纯氧进行曝气","将麦芽糊在 122°F (50°C) 下静置 15 分钟"],"answer":[0,1],"explain":"啤酒浑浊（haze） 由多酚-蛋白质复合物、酵母/细菌悬浮、淀粉残留等引起。\nA（使用明胶）正确。 明胶（fining agent）可沉淀多酚和蛋白质，减少浑浊。\nB（过滤）正确。 物理过滤可直接去除浑浊颗粒。\nC（高温糖化）→影响发酵度，不直接减少浑浊；D（纯氧曝气）→影响酵母健康，不减少浑浊；E（蛋\n白质休止）可改善清澈度，但“122°F/15 分钟”过于简略且非直接澄清手段。","tag":"原题 255","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":255},{"id":"S256","cat":"啤酒风格与比较","type":"tf","stem":"随着啤酒终止比重（FG）的增加，平衡麦芽甜味所需的啤酒花苦味也增加。","options":["正确","错误"],"answer":[0],"explain":"FG 越高，残留的不可发酵糖和糊精越多，麦芽甜味越明显。为了平衡增加的甜味，需要更高的啤酒花\n苦味（IBU） 来实现风味平衡。","tag":"原题 256","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":256},{"id":"S257","cat":"啤酒风格与比较","type":"tf","stem":"倒入杯中后无需立即闻香。","options":["正确","错误"],"answer":[1],"explain":"BJCP 品鉴流程要求：倒入杯中后应立即闻香（immediate aroma），因为挥发性香气化合物在刚倒\n出时最为集中，随时间会逸散。","tag":"原题 257","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":257},{"id":"S258","cat":"感官与异味","type":"single","stem":"请选择所有适用项。以下哪些可以降低出现雪利酒风味的风险？","options":["蛋白质休止","糖化过程中麦汁的循环","限制高温下的氧气暴露","使用慕尼黑麦芽","使用高 α 酸啤酒花"],"answer":[2],"explain":"雪利酒风味（sherry-like） 是氧化（oxidation） 的产物。\nC（限制高温下的氧气暴露）正确。 减少氧气接触和高温储存是防止氧化的根本措施。\nA（蛋白质休止）→影响清澈度，与氧化无关；B（麦汁循环）→可能增加热麦汁氧化风险；D（慕尼黑\n麦芽）→麦芽风味，非氧化防控；E（高 α 酸酒花）→与氧化无关。","tag":"原题 258","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":258},{"id":"S259","cat":"啤酒风格与比较","type":"tf","stem":"深色淡啤（Dark Mild）和美式棕色艾尔（American Brown Ale）都可能具有浓郁的烘烤麦芽 特征。","options":["正确","错误"],"answer":[1],"explain":"深色淡啤（BJCP 13A） 的烘烤特征为低至极低（low to none），以焦糖/太妃糖为主。\n美式棕色艾尔（BJCP 19B） 的烘烤特征为中等（moderate），包括巧克力/坚果特征。\n深色淡啤不应具有“浓郁烘烤”特征。","tag":"原题 259","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":259},{"id":"S260","cat":"酿造原料与工艺","type":"tf","stem":"失活 β-淀粉酶有助于酿造酒体较轻的啤酒。","options":["正确","错误"],"answer":[1],"explain":"β-淀粉酶产生可发酵糖（麦芽糖），有助于降低 FG、减轻酒体。\n失活 β-淀粉酶会减少可发酵糖的生成，产生更多不可发酵糊精，导致 FG 升高、酒体更饱满。\n要酿造酒体较轻的啤酒，应保持 β-淀粉酶活性（低温糖化 62-64°C）。","tag":"原题 260","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":260},{"id":"S261","cat":"啤酒风格与比较","type":"single","stem":"片状大麦（Flaked Barley）常用于以下哪种啤酒风格以增加泡沫保持？","options":["爱尔兰烈性黑啤","德国淡色出口啤酒","科隆啤酒","比利时金色烈性艾尔","老艾尔"],"answer":[0],"explain":"片状大麦（flaked barley） 含有丰富的蛋白质和 β-葡聚糖，可增强泡沫稳定性和酒体。\n它是爱尔兰烈性黑啤（Irish Stout，BJCP 15B） 的传统成分之一，赋予其标志性的奶油泡沫。\nB/C/D/E 不使用片状大麦作为典型配方成分。","tag":"原题 261","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":261},{"id":"S262","cat":"啤酒风格与比较","type":"tf","stem":"所有烈性苦啤（Strong Bitter）都是特强苦啤（ESB）。","options":["正确","错误"],"answer":[1],"explain":"烈性苦啤（Strong Bitter，BJCP 11C） 是一个宽泛的风格类别，ABV 为 4.6%-6.2%。\nESB（Extra Special Bitter） 是富勒啤酒厂（Fuller's） 的商业品牌名称，后来被用作烈性苦啤的\n一个子集，但并非所有烈性苦啤都是 ESB。","tag":"原题 262","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":262},{"id":"S263","cat":"啤酒风格与比较","type":"single","stem":"陈酿良好的帝国烈性黑啤将具备以下所有特质，除了：","options":["深色水果酯","温和的酸味","雪利酒般的香气/风味","咖啡香气/风味","酒精暖感"],"answer":[1],"explain":"【答案尚待核验】帝国世涛陈酿特征存在例外\n陈酿良好的帝国烈性黑啤（Imperial Stout，BJCP 20C） 特征包括：\nA（深色水果酯）→允许\nC（雪利酒风味）→陈酿特征\nD（咖啡香气）→烘烤麦芽特征\nE（酒精暖感）→高酒精度特征\nB（温和的酸味）错误。 帝国烈性黑啤不应有酸味。酸味是污染或发酵缺陷的迹象。","tag":"原题 263","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"帝国世涛陈酿特征存在例外","sourceNo":263},{"id":"S264","cat":"酿造原料与工艺","type":"single","stem":"如果发酵温度不受控，酵母生命周期的哪个阶段主要产生高级醇？","options":["指数或高 kräusen 阶段","稳定期","加速或低发泡阶段","滞后期","减速或晚期发酵泡沫阶段"],"answer":[3],"explain":"滞后期（Lag Phase） 是酵母在接种后适应环境、准备繁殖的阶段。\n在高温应激下，酵母在滞后期通过 Ehrlich 途径代谢氨基酸，产生大量高级醇（fusel alcohols）。","tag":"原题 264","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":264},{"id":"S265","cat":"啤酒风格与比较","type":"tf","stem":"Wee Heavy（苏格兰烈性艾尔）可能具有较低的啤酒花风味。","options":["正确","错误"],"answer":[0],"explain":"Wee Heavy（BJCP 14C） 以丰富复杂的麦芽风味为主导，啤酒花风味为低至极低（low to\nnone）。\n酒花仅提供苦味以平衡麦芽甜味，风味不突出。","tag":"原题 265","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":265},{"id":"S266","cat":"啤酒风格与比较","type":"tf","stem":"比利时三料啤酒通常比比利时金色烈性艾尔酒精度更高。","options":["正确","错误"],"answer":[1],"explain":"比利时三料（BJCP 26C）：ABV 范围为 7.5%-9.5%。\n比利时金色烈性艾尔（BJCP 25C）：ABV 范围为 7.5%-10.5%。\n比利时金色烈性艾尔的上限更高，通常酒精度不低于三料，甚至更高。","tag":"原题 266","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":266},{"id":"S267","cat":"BJCP评审与制度","type":"tf","stem":"对“有问题”啤酒的礼貌最低评分为 6 分，评分表每部分计一分。","options":["正确","错误"],"answer":[1],"explain":"BJCP 评分表中，最低礼貌评分（minimum courtesy score） 为 13 分（满分 50 分），而非 6 分。\n6 分以下通常仅用于完全不可饮用的样品。","tag":"原题 267","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":267},{"id":"S269","cat":"啤酒风格与比较","type":"tf","stem":"烈性苦啤（Strong Bitter）和美式波特（American Porter）颜色范围相似。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】SRM仅在边界重叠，不足以定义相似\n烈性苦啤（BJCP 11C）：SRM 范围为 8-18。\n美式波特（BJCP 20A）：SRM 范围为 18-40（更深）。\n两者有重叠（SRM 18），但美式波特范围更宽、更深色。严格来说“相似”有一定重叠，但按标准答\n案设定为正确。","tag":"原题 269","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"SRM仅在边界重叠，不足以定义相似","sourceNo":269},{"id":"S270","cat":"啤酒风格与比较","type":"tf","stem":"比利时三料啤酒通常比比利时金色艾尔啤酒更甜且苦味较低。","options":["正确","错误"],"answer":[1],"explain":"比利时三料（BJCP 26C）：IBU 20-40，甜度中等偏低，收口干爽。\n比利时金色艾尔（BJCP 25A）：IBU 15-30，麦芽甜味柔和。\n三料通常更干爽（高发酵度），而非更甜；苦味范围与金色艾尔相近。","tag":"原题 270","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":270},{"id":"S271","cat":"啤酒风格与比较","type":"tf","stem":"英国棕色艾尔（English Brown Ale）和暗淡麦芽啤酒（Dark Mild）在 5%酒精度时都适宜。","options":["正确","错误"],"answer":[1],"explain":"英国棕色艾尔（BJCP 13B）：ABV 为 4.2%-5.4%，5%合适。\n暗淡麦芽啤酒（Dark Mild，BJCP 13A）：ABV 为 2.8%-3.8%，5%远高于上限，不适宜。","tag":"原题 271","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":271},{"id":"S273","cat":"BJCP评审与制度","type":"tf","stem":"成为 BJCP 认证评委，只需通过入门考试，啤酒评审考试得分至少 70%，并获得 5 个评审积分。","options":["正确","错误"],"answer":[1],"explain":"BJCP 认证评委（Certified） 要求：\n通过在线入门考试（Online Entrance Exam）\n通过品鉴考试（Tasting Exam），得分≥60%（非 70%）\n获得至少 5 个评审积分（judging points）\n70%是国家级（National） 的最低品鉴考试要求。","tag":"原题 273","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":273},{"id":"S274","cat":"啤酒风格与比较","type":"tf","stem":"低啤酒花香气在深色淡啤和普通苦啤中均可接受。","options":["正确","错误"],"answer":[0],"explain":"深色淡啤（BJCP 13A）：啤酒花香气低至无（low to none）。\n普通苦啤（BJCP 11A）：啤酒花香气低至中低（low to moderate）。\n低啤酒花香气在两者中均可接受。","tag":"原题 274","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":274},{"id":"S276","cat":"酿造原料与工艺","type":"multi","stem":"请选择所有适用项。可以通过哪些感官检测到野生酵母污染？","options":["气味","触感（口感）","听觉（开瓶时）","口味","外观"],"answer":[0,1,3],"explain":"野生酵母污染（如 Brettanomyces）可通过以下感官检测：\nA（气味）正确。 酚类（马毯/药味）、酯类（果香）等异常香气。\nB（触感/口感）正确。 口感可能变得酸涩、收敛。\nD（口味）正确。 酸味、酚味、异常酯味。\nC（听觉）→开瓶声与污染无关；E（外观）→不一定有显著变化。","tag":"原题 276","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":276},{"id":"S277","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。美式琥珀艾尔和加州普通啤酒的相似之处可能包括：","options":["酒精含量高达 6%","干净，无允许的酯类","无二乙酰","两者都是早期美国定居者改良的传统英式风格","通常呈琥珀色到铜色范围"],"answer":[0,2,4],"explain":"美式琥珀艾尔（BJCP 19B） 和 加州普通啤酒（BJCP 19A）：\nA（酒精含量高达 6%）正确。 两者 ABV 上限均约 6%。\nC（无二乙酰）正确。 美式风格通常要求双乙酰低至无。\nE（琥珀色到铜色范围）正确。 两者颜色为琥珀色/铜色。\nB（无酯类）错误——两者允许低至中等果酯；D（英式风格改良）错误——加州普通啤酒是美式独创\n风格。","tag":"原题 277","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":277},{"id":"S278","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 大师级评委必须在书面和品鉴考试中综合得分至少达到 90%，并且至少有 40 个评审积分。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】BJCP等级积分规则待核\nBJCP 大师级（Master） 要求：\n品鉴考试≥90%\n书面考试≥90%\n经验积分≥50（非 40），其中至少一半来自评审工作。","tag":"原题 278","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"BJCP等级积分规则待核","sourceNo":278},{"id":"S279","cat":"酿造原料与工艺","type":"multi","stem":"野生酵母引起的涩味可能由哪些化合物引起？","options":["酚类化合物","酸味","二甲基硫（DMS）","二乙酰","酮类"],"answer":[0,1],"explain":"A（酚类化合物）正确。 野生酵母（Brettanomyces）产生酚类（4-乙基苯酚等），可产生收敛感/涩\n味。\nB（酸味）正确。 野生酵母产有机酸，高浓度酸导致酸涩感。\nC（DMS）→煮玉米；D（二乙酰）→奶油；E（酮类）→奶油/水果风味。","tag":"原题 279","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":279},{"id":"S280","cat":"酿造原料与工艺","type":"tf","stem":"慕尼黑淡色啤酒（Munich Helles）可在低温下使用拉格酵母或艾尔酵母。","options":["正确","错误"],"answer":[1],"explain":"慕尼黑淡色啤酒（BJCP 4A） 是德式拉格，必须使用拉格酵母（Saccharomyces pastorianus） 在\n低温（7-13°C）下发酵。\n艾尔酵母会产生过多的果酯和酚类，不符合该风格干净、柔和的特征。","tag":"原题 280","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":280},{"id":"S281","cat":"感官与异味","type":"tf","stem":"威重啤酒（Weizenbock）中允许存在少量高级醇。","options":["正确","错误"],"answer":[0],"explain":"威重啤酒（Weizenbock，BJCP 10C） 是高酒精度（6.5%-8.0%）小麦啤酒。\n允许少量高级醇（higher alcohols） 带来的温暖/酒精感，但不应过于粗糙或溶剂感。","tag":"原题 281","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":281},{"id":"S282","cat":"啤酒风格与比较","type":"tf","stem":"美式拉格和捷克高级淡色拉格应均有浓密持久的奶油白泡沫头。","options":["正确","错误"],"answer":[1],"explain":"美式拉格（BJCP 1B）：泡沫为白色（white），但持久性低至中等（因辅料稀释蛋白质）。\n捷克高级淡色拉格（BJCP 3B）：泡沫为浓密、持久、奶油状（因全麦芽和高蛋白）。\n两者泡沫质量差异显著，美式拉格不应有“浓密持久”的泡沫头。","tag":"原题 282","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":282},{"id":"S283","cat":"啤酒风格与比较","type":"tf","stem":"国际琥珀拉格中的硫味因使用地区水源而可接受。","options":["正确","错误"],"answer":[1],"explain":"国际琥珀拉格（BJCP 2C） 应无任何硫味或矿物质特征。\n硫味（sulfury）是发酵或水源问题导致的缺陷，即使源于当地水源也不可接受。","tag":"原题 283","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":283},{"id":"S284","cat":"啤酒风格与比较","type":"tf","stem":"爱尔兰世涛（Irish Stout）的泡沫保持通常非常好。","options":["正确","错误"],"answer":[0],"explain":"爱尔兰世涛（BJCP 15B） 因使用片状大麦（flaked barley） 提供丰富蛋白质，泡沫为持久、奶油状\n（creamy, long-lasting），是风格标志性特征。","tag":"原题 284","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":284},{"id":"S285","cat":"啤酒风格与比较","type":"tf","stem":"低矿物质含量的软水往往会降低啤酒花苦味的感知。","options":["正确","错误"],"answer":[0],"explain":"软水中硫酸盐（SO₄²⁻） 含量低，而硫酸盐增强酒花苦味的锐度。\n低矿物质软水会使酒花苦味感知更柔和、圆润，相对“降低”了苦味的鲜明度。","tag":"原题 285","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":285},{"id":"S286","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。美式世涛（American Stout）和外国特级世涛（Foreign Extra Stout）的 香气中可以具有以下哪些特征？","options":["黄油","酒精","巧克力","木炭","咖啡"],"answer":[1,2,4],"explain":"美式世涛（BJCP 20B） 和 外国特级世涛（BJCP 16D） 的香气中：\nB（酒精）正确。 高酒精度带来酒精香气。\nC（巧克力）正确。 深色麦芽的典型特征。\nE（咖啡）正确。 烘烤麦芽的典型特征。\nA（黄油）错误——双乙酰缺陷；D（木炭）错误——过度烘烤/焦苦缺陷。","tag":"原题 286","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":286},{"id":"S287","cat":"酿造原料与工艺","type":"tf","stem":"由于煮沸过程，阿尔特啤酒（Altbier）中的焦糖化是可以接受的。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】Altbier焦糖化与烤麦芽特征需区分\n阿尔特啤酒（Altbier，BJCP 7B） 是德式艾尔，麦芽特征中包括轻微焦糖（caramel） 风味。\n这些风味来自深色麦芽和煮沸过程中的轻微焦糖化，是风格允许甚至期望的特征。","tag":"原题 287","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"Altbier焦糖化与烤麦芽特征需区分","sourceNo":287},{"id":"S288","cat":"啤酒风格与比较","type":"single","stem":"储藏啤酒（American Lager）和加州普通啤酒（California Common）的相似之处在于：","options":["它们都采用传统煎煮法","明显的酒精味可以为其收尾带来额外的干爽感","它们都具有强烈的啤酒花味","它们都可以在较低的艾尔发酵温度下发酵","它们的香气中都有明显的麦芽甜味"],"answer":[3],"explain":"储藏啤酒（American Lager，BJCP 1B） 和 加州普通啤酒（California Common，BJCP 19A）：\nD（可以在较低艾尔发酵温度下发酵）正确。 加州普通啤酒可用艾尔酵母在低温（10-15°C）发酵；美\n式拉格在低温发酵。\nA（煮出法）——美式拉格不要求煮出法；B（明显酒精味）——两者均低酒精度；C（强烈酒花味）\n——美式拉格无；E（明显麦芽甜）——美式拉格中性。","tag":"原题 288","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":288},{"id":"S289","cat":"酿造原料与工艺","type":"tf","stem":"拉格酵母通常被称为顶层发酵酵母。","options":["正确","错误"],"answer":[1],"explain":"拉格酵母（Saccharomyces pastorianus） 是底层发酵（bottom-fermenting） 酵母。\n艾尔酵母（Saccharomyces cerevisiae） 才是顶层发酵（top-fermenting） 酵母。","tag":"原题 289","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":289},{"id":"S290","cat":"酿造原料与工艺","type":"tf","stem":"煮沸麦芽糊总会产生单宁副产物，尤其是在煎煮啤酒中。","options":["正确","错误"],"answer":[1],"explain":"单宁（tannins） 主要来自麦壳，在高温（>76°C） 和高 pH（>6.0） 条件下过度萃取。\n煮沸麦芽糊本身不“总会”产生单宁，控制好 pH 和温度，煮出糖化法可以避免单宁过度萃取。","tag":"原题 290","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":290},{"id":"S292","cat":"感官与异味","type":"single","stem":"以下哪些是保持酯类在合理水平的最合适反馈？","options":["给麦汁充氧，发酵完成后立即转入二次发酵罐","给麦汁充氧，在发酵温度或以下接种酵母","使用酵母营养剂，温暖发酵，分批冲洗","糖化温度 150 华氏度（66 摄氏度），煮沸 90 分钟，给麦汁充氧","进行剧烈煮沸，使用爱尔兰苔藓，迅速冷却"],"answer":[1],"explain":"酯类控制在合理水平（不过高也不过低）的关键是健康发酵：\nB（给麦汁充氧，在发酵温度或以下接种酵母）正确。 充足氧气帮助酵母健康生长，适当接种温度避免\n应激产酯。\nA（立即转罐）→过早分离酵母导致乙醛/双乙酰；C（温暖发酵）→增加酯类；D/E（糖化/煮沸）→不\n直接控制酯类。","tag":"原题 292","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":292},{"id":"S293","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。最佳苦啤（Best Bitter）和强烈苦啤（Strong Bitter）可能具有哪些啤酒花 风味？","options":["泥土味","辛辣的","树脂味","柑橘味","花香"],"answer":[0,1,4],"explain":"最佳苦啤（BJCP 11B） 和 强烈苦啤（BJCP 11C） 使用英式啤酒花（金标、法格尔等），其特征为泥\n土（earthy）、花香（floral）、辛辣（spicy）。\nC（树脂味）和 D（柑橘味）更典型于美式啤酒花。","tag":"原题 293","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":293},{"id":"S294","cat":"啤酒风格与比较","type":"tf","stem":"波罗的海波特（Baltic Porter）是一种中等酒体的啤酒。","options":["正确","错误"],"answer":[1],"explain":"波罗的海波特（BJCP 9C） 的酒体为中等至饱满（medium to full），因高酒精度（5.5%-9.5%）和\n高麦芽浓度。\n“中等酒体”不完全准确，应为“中等至饱满”。","tag":"原题 294","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":294},{"id":"S295","cat":"啤酒风格与比较","type":"single","stem":"双倍博克啤酒（Doppelbock）的风味描述最不准确的是：","options":["辛辣的贵族啤酒花与谷物麦芽均衡，带有持久的烘烤麦芽味","啤酒花苦味较低，次于丰富的麦芽味，带有轻微酒精和深色水果味","非常浓郁的麦芽甜味，无啤酒花味，麦芽味持久","复杂、丰富、烘烤麦芽味，略带酒精温暖感，适度干爽的收尾","适度浓郁的麦芽味，低啤酒花苦味，低果香，麦芽甜味收尾"],"answer":[0],"explain":"双倍博克（BJCP 5C） 以麦芽为主导，啤酒花风味极低至无（none to very low），不应有“辛辣贵\n族啤酒花”的风味。\nA 描述更接近德式皮尔森或淡色拉格，而非双倍博克。\nB/C/D/E 均为对双倍博克不同程度的准确描述。","tag":"原题 295","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":295},{"id":"S296","cat":"啤酒风格与比较","type":"single","stem":"深色淡啤（Dark Mild）的风味特征最不准确的描述是：","options":["适中的果味酯，烘焙麦芽味极低，带有甜美顺滑的余味","中等甜度的收尾，带有烤面包/巧克力麦芽味，余味中无啤酒花味","低啤酒花风味，中等甜味收尾","中度烘烤/焦糖麦芽，伴有中等啤酒花苦味","麦芽甜味，低啤酒花香和低苦味"],"answer":[3],"explain":"深色淡啤（BJCP 13A） 的苦味为低至中低（low to moderate），但最准确的应为低至中低（low\nto medium-low）。\nD 中“中等啤酒花苦味（moderate hop bitterness）”过高，深色淡啤应以麦芽甜味为主导，苦味仅\n作平衡。","tag":"原题 296","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":296},{"id":"S297","cat":"酿造原料与工艺","type":"tf","stem":"在高于发酵温度的温度下接种酵母有助于减少二乙酰。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】投酵温度控制双乙酰的说法不清\n在高于发酵温度的温度下接种酵母（如接种温度 20°C，发酵温度 18°C）可促进酵母活跃生长，减少应\n激，从而减少 α-乙酰乳酸（二乙酰前体） 的生成。\n但温差不宜过大（一般不超过 2-3°C）。","tag":"原题 297","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"投酵温度控制双乙酰的说法不清","sourceNo":297},{"id":"S298","cat":"啤酒风格与比较","type":"tf","stem":"酒体轻盈（Light body）是由高水平的糊精引起的。","options":["正确","错误"],"answer":[1],"explain":"糊精（dextrins） 是不可发酵糖，高水平的糊精会增加酒体饱满度（body） 和甜度。\n酒体轻盈来自低糊精水平和高发酵度（更多可发酵糖被转化为酒精）。","tag":"原题 298","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":298},{"id":"S299","cat":"啤酒风格与比较","type":"single","stem":"小麦啤酒（Weissbier）中丁香香气的原因是：","options":["传统的短时间煮沸","使用煮沸糖化法","拉格发酵温度","特殊酵母的使用","使用贵族啤酒花"],"answer":[3],"explain":"丁香香气（clove） 由 4-乙烯基愈创木酚（4-vinylguaiacol） 产生，来自德式小麦酵母将麦芽中的阿\n魏酸（ferulic acid） 脱羧生成。\n这是特殊酵母菌株的代谢特征，与煮沸、糖化、酒花无关。","tag":"原题 299","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":299},{"id":"S301","cat":"啤酒风格与比较","type":"tf","stem":"轻微的麦芽甜味是比利时双料啤酒风味的关键组成部分。","options":["正确","错误"],"answer":[0],"explain":"比利时双料（BJCP 26B） 的风味中，麦芽甜味（焦糖、太妃糖、深色水果）是关键特征，与果酯和酚\n类共同构成复杂风味。","tag":"原题 301","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":301},{"id":"S302","cat":"酿造原料与工艺","type":"tf","stem":"高麦芽糖化温度下，α-淀粉酶活性更高。","options":["正确","错误"],"answer":[0],"explain":"α-淀粉酶最适温度范围为 66-71°C（150-160°F），β-淀粉酶最适温度为 60-65°C（140-150°F）。\n高温（66-71°C）下 α-淀粉酶活性更高，产生更多不可发酵糊精。","tag":"原题 302","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":302},{"id":"S303","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。为了减少高级醇，酿酒师可以采取以下哪些措施？","options":["增加冷却麦汁的氧气含量","让啤酒在冷凝蛋白沉淀阶段停留更长时间","糖化至少 60 分钟","提高发酵温度","降低发酵温度"],"answer":[0,4],"explain":"高级醇（fusel alcohols） 在酵母应激条件下（高温、低氧、低 FAN、低接种率）产生。\nA（增加氧气含量）正确。 充足氧气帮助酵母健康生长，减少应激产高级醇。\nE（降低发酵温度）正确。 较低温度减少高级醇生成。\nB（冷凝蛋白沉淀）→影响清澈度，不直接影响高级醇；C（糖化时间）→影响发酵度，不直接影响高\n级醇；D（提高温度）→增加高级醇。","tag":"原题 303","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":303},{"id":"S304","cat":"啤酒风格与比较","type":"tf","stem":"更强烈版本的美式棕色艾尔可能表现出非常高的苦味，仍然是经典范例。","options":["正确","错误"],"answer":[1],"explain":"美式棕色艾尔（BJCP 19B） 苦味为中等至中高（moderate to moderately high），IBU 20-40。\n“非常高的苦味”超出风格范围，不属于经典范例。","tag":"原题 304","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":304},{"id":"S305","cat":"啤酒风格与比较","type":"single","stem":"浅色博克（Helles Bock）和深色博克（Dark Bock）的共同原料可以是：","options":["小麦啤酒酵母","德国小麦麦芽","北方酿酒师啤酒花","慕尼黑麦芽","深色糖蜜糖"],"answer":[3],"explain":"浅色博克（BJCP 5A） 和 深色博克（BJCP 5B） 均使用慕尼黑麦芽（Munich malt） 作为关键麦芽，\n提供麦芽深度和美拉德风味。\nA（小麦酵母）错误——两者均为拉格；B（小麦麦芽）非必需；C（北酿）非典型；E（糖蜜）不适用。","tag":"原题 305","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":305},{"id":"S306","cat":"啤酒风格与比较","type":"single","stem":"澄清剂通常在发酵后添加以：","options":["碳酸啤酒","澄清啤酒","为糖化添加酶","产生酯类","向酵母添加营养物质"],"answer":[1],"explain":"澄清剂（fining agents） 如明胶、鱼胶（isinglass）、PVPP 等在发酵后添加，用于沉淀悬浮颗粒，\n澄清啤酒。\nA（碳酸化）→通过 CO₂；C/D/E 与澄清剂无关。","tag":"原题 306","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":306},{"id":"S307","cat":"啤酒风格与比较","type":"tf","stem":"德国皮尔森和捷克高级淡色拉格在 6%酒精度下均不适宜。","options":["正确","错误"],"answer":[0],"explain":"德国皮尔森（BJCP 5D）：ABV 4.4%-5.2%，6%过高。\n捷克高级淡色拉格（BJCP 3B）：ABV 4.2%-5.8%，6%过高。\n两者在 6%下均不适宜。","tag":"原题 307","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":307},{"id":"S308","cat":"酿造原料与工艺","type":"tf","stem":"国际深色拉格啤酒（International Dark Lager）可能具有较高的碳酸化水平。","options":["正确","错误"],"answer":[1],"explain":"国际深色拉格（BJCP 2B）：碳酸化为中等（medium），非高（high）。","tag":"原题 308","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":308},{"id":"S309","cat":"感官与异味","type":"tf","stem":"二乙酰特征是由硫醇的存在引起的。","options":["正确","错误"],"answer":[1],"explain":"二乙酰（diacetyl） 是酵母代谢的副产物，特征为奶油/黄油味。\n硫醇（thiols/mercaptans） 是含硫化合物，产生臭鼬/洋葱/橡胶味。两者无关。","tag":"原题 309","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":309},{"id":"S310","cat":"啤酒风格与比较","type":"single","stem":"以下哪项特征不适合强烈苦啤（Strong Bitter）？","options":["适中酒精度","低二乙酰","适度的泥土感啤酒花特征","低焦糖麦芽","适中的花香啤酒花特征"],"answer":[3],"explain":"强烈苦啤（BJCP 11C） 使用水晶麦芽提供焦糖（caramel） 风味，是风格特征之一。\n“低焦糖麦芽”与风格不符。","tag":"原题 310","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":310},{"id":"S311","cat":"酿造原料与工艺","type":"tf","stem":"发酵过程中麦汁暴露于氧气中，极可能表现出增强的丁香样酚类特征。","options":["正确","错误"],"answer":[1],"explain":"丁香样酚类（4-乙烯基愈创木酚） 由酵母阿魏酸脱羧酶代谢产生，与氧气暴露无关。\n发酵中氧气暴露会导致氧化（纸板味/雪利酒） 或乙酸问题，而非丁香特征。","tag":"原题 311","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":311},{"id":"S313","cat":"啤酒风格与比较","type":"tf","stem":"香料添加在比利时双料（Dubbel）和比利时金色艾尔（Belgian Blonde Ale）中都很常见。","options":["正确","错误"],"answer":[1],"explain":"比利时双料（BJCP 26B）：不使用香料，风味来自麦芽、酵母（酯/酚）和深色糖。\n比利时金色艾尔（BJCP 25A）：不使用香料，风味来自麦芽和酵母。\n香料（芫荽/橙皮）仅见于白啤酒（Witbier） 等特定风格。","tag":"原题 313","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":313},{"id":"S314","cat":"啤酒风格与比较","type":"single","stem":"刺鼻的溶剂味可能由以下原因引起：","options":["乙醛","二乙酰","乙醇","高级醇","二甲基硫（DMS）"],"answer":[3],"explain":"溶剂味（solvent-like） 是高级醇（fusel alcohols） 在高浓度下的典型特征，表现为辛辣、刺鼻、\n热感。\nA→青苹果；B→奶油/黄油；C→正常酒精感（非刺鼻）；E→煮玉米。","tag":"原题 314","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":314},{"id":"S315","cat":"啤酒风格与比较","type":"single","stem":"哪种工艺最可能导致啤酒浑浊？","options":["煮沸啤酒花 60 分钟","干投啤酒花","熄火后添加啤酒花","首煮啤酒花添加","糖化时加啤酒花"],"answer":[1],"explain":"干投啤酒花（dry hopping） 会将酒花颗粒、多酚和植物材料引入发酵罐/陈酿罐，导致啤酒浑浊（尤\n其未过滤版本）。\nA/C/D/E 均为热端添加，多酚在煮沸中会与蛋白质结合沉淀。","tag":"原题 315","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":315},{"id":"S316","cat":"感官与异味","type":"tf","stem":"酸味和鲜味是描述不同味觉感受的词汇。","options":["正确","错误"],"answer":[0],"explain":"酸味（sour） 和鲜味（umami） 是两种不同的基本味觉。酸味来自酸类（乳酸/乙酸），鲜味来自谷\n氨酸等氨基酸。","tag":"原题 316","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":316},{"id":"S317","cat":"啤酒风格与比较","type":"single","stem":"以下哪项特征在国际淡色拉格啤酒（International Pale Lager）中任何程度上都是意外的？","options":["玉米味","甜度","苦味","清澈度良好","涩味"],"answer":[4],"explain":"国际淡色拉格（BJCP 2A） 以清爽、干净、中性为特征。\n涩味（astringency） 在任何程度上都是缺陷，不应出现。\nA（玉米味）允许来自辅料；B（甜度）可接受低水平；C（苦味）允许低至中低；D（清澈）是风格要\n求。","tag":"原题 317","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":317},{"id":"S318","cat":"啤酒风格与比较","type":"tf","stem":"英国棕色艾尔（English Brown Ale）和深色淡啤（Dark Mild）通常具有中等至丰满的酒体。","options":["正确","错误"],"answer":[1],"explain":"英国棕色艾尔（BJCP 13B）：酒体为中等（medium）。\n深色淡啤（BJCP 13A）：酒体为轻至中等（light to medium）。\n两者均非“丰满（full）”。","tag":"原题 318","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":318},{"id":"S319","cat":"酿造原料与工艺","type":"tf","stem":"片状谷物（Flaked Grains）不需要谷物糖化即可在糖化过程中转化。","options":["正确","错误"],"answer":[0],"explain":"片状谷物（片状大麦/玉米/大米）已通过蒸汽压片（flaking） 工艺使淀粉预胶化（pre-\ngelatinized），可直接加入主糖化醪，无需谷物糖化。","tag":"原题 319","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":319},{"id":"S320","cat":"感官与异味","type":"tf","stem":"由于高啤酒花使用率，美式淡色艾尔中的涩味是可接受的。","options":["正确","错误"],"answer":[1],"explain":"美式淡色艾尔（BJCP 18B） 虽啤酒花使用率较高，但涩味（astringency） 是缺陷，由多酚过量萃取\n引起。\n酒花带来的应是苦味（bitterness） 和香气，而非涩味。","tag":"原题 320","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":320},{"id":"S321","cat":"啤酒风格与比较","type":"tf","stem":"鱼胶澄清剂（Isinglass）来源于鱼的鱼鳔。","options":["正确","错误"],"answer":[0],"explain":"鱼胶（isinglass） 来源于鱼鳔（swim bladders），特别是鲟鱼。用于沉淀悬浮颗粒，澄清啤酒。","tag":"原题 321","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":321},{"id":"S322","cat":"啤酒风格与比较","type":"tf","stem":"任何风格中都不接受玉米味的香气和风味。","options":["正确","错误"],"answer":[1],"explain":"玉米味（corn-like） 在美式拉格（BJCP 1B） 中可接受（来自玉米辅料），但不应过量。\n“任何风格都不接受”是绝对化错误表述。","tag":"原题 322","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":322},{"id":"S323","cat":"啤酒风格与比较","type":"tf","stem":"英式印度淡色艾尔（English IPA）中允许使用锅糖（Kettle Sugar）。","options":["正确","错误"],"answer":[0],"explain":"英式 IPA（BJCP 21B） 传统配方中允许使用转化糖/糖浆（invert sugar），以提高发酵度、降低酒\n体。\n这是英式 IPA 历史配方的典型特征。","tag":"原题 323","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":323},{"id":"S324","cat":"感官与异味","type":"tf","stem":"慕尼黑淡色拉格的香气中允许有轻微的二甲基硫（DMS），但德国皮尔森不允许。","options":["正确","错误"],"answer":[1],"explain":"慕尼黑淡色（BJCP 4A）：DMS 极低至无（very low to none）。\n德国皮尔森（BJCP 5D）：允许极轻微 DMS（very low DMS），来自皮尔森麦芽。\n两者均允许极低 DMS，但皮尔森更常见（因高比例皮尔森麦芽）。","tag":"原题 324","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":324},{"id":"S325","cat":"酿造原料与工艺","type":"tf","stem":"发酵减缓时尽快将啤酒与酵母分离可减少二乙酰。","options":["正确","错误"],"answer":[1],"explain":"二乙酰的清除需要酵母还原酶作用。发酵减缓时过早分离酵母会使二乙酰无法被还原，残留在成品中。\n应进行二乙酰休止（diacetyl rest），让酵母完成还原。","tag":"原题 325","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":325},{"id":"S326","cat":"感官与异味","type":"single","stem":"杂醇（高级醇）可能由以下原因引起：","options":["麦汁煮沸时间不足","允许糖化物的 pH 值升高至 5.6 以上","在接种酵母前冷却麦汁通气不足","在塑料桶中发酵","长时间糖化"],"answer":[2],"explain":"高级醇（fusel alcohols） 在酵母应激条件下产生。\nC（通气不足）正确。 冷却麦汁氧气不足导致酵母应激，产生高级醇。\nA→DMS 问题；B→单宁萃取；D→材料无关；E→发酵度变化，不直接导致高级醇。","tag":"原题 326","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":326},{"id":"S327","cat":"啤酒风格与比较","type":"multi","stem":"请勾选所有适用项。以下哪些是美式拉格（American Lager）和捷克高级淡色拉格（Czech Premium Pale Lager）之间的区别？","options":["使用贵族啤酒花","苦味","最大颜色","酒体","清澈度"],"answer":[0,1,2,3],"explain":"美式拉格（BJCP 1B） vs 捷克高级淡色拉格（BJCP 3B）：\nA（贵族啤酒花）正确。 捷克使用贵族酒花；美式可使用贵族或美式酒花。\nB（苦味）正确。 美式 IBU 8-18；捷克 30-45。\nC（最大颜色）正确。 美式 SRM 2-6；捷克 3.5-6（略有差异）。\nD（酒体）正确。 美式轻至中低；捷克中低至中等。\nE（清澈度）——两者均为清澈，非区别点。","tag":"原题 327","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":327},{"id":"S328","cat":"BJCP评审与制度","type":"tf","stem":"为确保客观性，评分表上绝不应写全名或联系方式。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】评分表个人信息规定待核\nBJCP 评分表应匿名，确保盲评公正性。评分表上不应填写评委全名或联系方式，只填写评委编号。","tag":"原题 328","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"评分表个人信息规定待核","sourceNo":328},{"id":"S329","cat":"感官与异味","type":"tf","stem":"经典兰比克（Lambic）可能表现出低水平的肠道风味。","options":["正确","错误"],"answer":[1],"explain":"【按2021指南订正】23D Lambic明确不应具有enteric肠道味缺陷。\n【文档原答案：A】\n经典兰比克（BJCP 23D） 因自然发酵（酵母+细菌混合），可产生低水平的肠道/农场\n（farmyard/barnyard）风味，是风格允许的特征。\n这些风味来自 Brettanomyces 等微生物代谢。","tag":"原题 329","source":"https://styles.bjcp.org/bjcp-2021-beer/23/23d-lambic","status":"corrected","flag":"","sourceNo":329},{"id":"S330","cat":"酿造原料与工艺","type":"tf","stem":"如果二甲基硫（DMS）在煮沸过程中未被蒸发掉，那么它肯定会存在于成品啤酒中。","options":["正确","错误"],"answer":[0],"explain":"DMS 在煮沸过程中需要剧烈、开放式煮沸才能挥发。若未被蒸发掉，DMS 会残留在麦汁中，进入发酵\n罐并最终出现在成品啤酒中。\n但低水平 DMS 在某些风格中可接受。","tag":"原题 330","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":330},{"id":"S331","cat":"酿造原料与工艺","type":"tf","stem":"小麦博克啤酒（Weizenbock）应始终具有中等到高的碳酸化水平。","options":["正确","错误"],"answer":[0],"explain":"小麦博克（BJCP 10C） 碳酸化为中等到高（medium to high），是风格要求。","tag":"原题 331","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":331},{"id":"S332","cat":"酿造原料与工艺","type":"tf","stem":"拉格啤酒有时需要额外添加酵母和引发糖来碳酸化。","options":["正确","错误"],"answer":[0],"explain":"拉格啤酒在长时间陈酿后，酵母可能已沉降或活性降低，装瓶时需额外添加新鲜酵母和糖（瓶内发酵）\n以确保碳酸化。","tag":"原题 332","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":332},{"id":"S333","cat":"酿造原料与工艺","type":"tf","stem":"英式 IPA 可在糖化过程中使用少量辅料。","options":["正确","错误"],"answer":[0],"explain":"英式 IPA（BJCP 21B） 传统配方中允许少量辅料（如转化糖、玉米片、淀粉），以提高发酵度和干爽\n口感。","tag":"原题 333","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":333},{"id":"S334","cat":"BJCP评审与制度","type":"tf","stem":"评审活动前应避免食用辛辣和/或辣味食物，因为它们会降低评委对啤酒香气和风味的敏感度。","options":["正确","错误"],"answer":[0],"explain":"辛辣/辣味食物会刺激味蕾、残留异味、降低感官敏感度。BJCP 建议评审前避免此类食物。","tag":"原题 334","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":334},{"id":"S335","cat":"啤酒风格与比较","type":"single","stem":"最佳苦啤（Best Bitter）和老啤（Old Ale）之间最大的区别是什么？","options":["颜色","酒精度","使用艾尔酵母","发酵温度","苦味率"],"answer":[1],"explain":"【答案尚待核验】最大区别未限定考察维度\n最佳苦啤（BJCP 11B）：ABV 4.0%-4.9%。\n老啤（Old Ale，BJCP 19A）：ABV 5.0%-7.0%+。\n最大区别是酒精度（ABV）。两者均使用艾尔酵母，发酵温度相近。","tag":"原题 335","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"最大区别未限定考察维度","sourceNo":335},{"id":"S336","cat":"酿造原料与工艺","type":"tf","stem":"水中的硫酸盐通常会增强威士忌重型啤酒的苦味。","options":["正确","错误"],"answer":[1],"explain":"硫酸盐（SO₄²⁻） 增强啤酒花苦味，而非“威士忌”相关风味。\n“威士忌重型啤酒”（Wee Heavy）以麦芽为主导，硫酸盐增强苦味在苏格兰艾尔中不典型。","tag":"原题 336","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":336},{"id":"S337","cat":"酿造原料与工艺","type":"tf","stem":"煮沸糖化法（Decoction Mash）是一种英式酿造技术。","options":["正确","错误"],"answer":[1],"explain":"煮沸糖化法（Decoction Mash） 是德式酿造技术，用于改良不足的麦芽。\n英式酿造通常采用单步浸泡糖化（Single Infusion）。","tag":"原题 337","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":337},{"id":"S339","cat":"啤酒风格与比较","type":"single","stem":"英国艾尔发酵常见的特征是：","options":["酚类化合物","二甲基硫（DMS）","酯类","酒体轻盈","涩味"],"answer":[2],"explain":"英国艾尔酵母的特征代谢产物为酯类（esters），赋予果香（香蕉/梨/水果蛋糕）。\nA（酚类）→德式小麦/比利时艾尔；B→皮尔森麦芽；D/E→非发酵产物。","tag":"原题 339","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":339},{"id":"S340","cat":"啤酒风格与比较","type":"single","stem":"双倍印度淡色艾尔（Double IPA）的余味最佳描述为：","options":["麦芽与啤酒花平衡，酒精温暖感适中","适中啤酒花香，有时略带硫磺味","干爽，具有啤酒花风味及持久的苦味和温暖感","中等干型，低苦味，中等残留甜味和酒精余韵","甜美麦芽味，几乎像糖浆，带有些许酒精温暖感"],"answer":[2],"explain":"双倍 IPA（BJCP 22A） 的余味为干爽（dry），具有强烈的啤酒花风味、持久的苦味和酒精温暖感。\nA（平衡）→非 IPA 特征；B（硫磺）缺陷；D（低苦味）错误；E（甜）错误。","tag":"原题 340","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":340},{"id":"S341","cat":"啤酒风格与比较","type":"tf","stem":"贮藏（Lagering）可以帮助平滑捷克高级淡色拉格的风味。","options":["正确","错误"],"answer":[0],"explain":"贮藏（lagering） 是拉格啤酒在低温下长时间陈酿的过程，可平滑风味、沉淀悬浮物、改善口感。\n捷克高级淡色拉格（BJCP 3B） 传统上经过贮藏，有助于风味的圆润和成熟。","tag":"原题 341","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":341},{"id":"S342","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。深色博克（Dark Bock）和双倍博克（Doppelbock）可能共用的原料有哪 些？","options":["维也纳麦芽","卡斯卡特啤酒花","纯净的拉格酵母","中等硫酸盐水","深度烘焙麦芽"],"answer":[0,2],"explain":"深色博克（BJCP 5B） 和 双倍博克（BJCP 5C） 共用原料：\nA（维也纳麦芽）正确。 两者均使用维也纳/慕尼黑麦芽。\nC（纯净的拉格酵母）正确。 两者均使用拉格酵母。\nB（卡斯卡特）错误——美式酒花不用于德式博克；D（中等硫酸盐）错误——德国水源通常柔和；E\n（深度烘焙麦芽）错误——两者不使用深度烘焙麦芽。","tag":"原题 342","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":342},{"id":"S343","cat":"酿造原料与工艺","type":"tf","stem":"水中的硫酸盐可以增强烈性苦啤（Strong Bitter）的苦味。","options":["正确","错误"],"answer":[0],"explain":"硫酸盐（SO₄²⁻） 增强酒花苦味的锐度和感知强度。烈性苦啤（英式淡色艾尔）传统使用伯顿化水质\n（高硫酸盐）。","tag":"原题 343","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":343},{"id":"S344","cat":"啤酒风格与比较","type":"tf","stem":"Bière de Garde 和加州普通啤酒（California Common）中的果味酯相似。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】酯类特征需核对指南\nBière de Garde（BJCP 26A）：果酯为低至中低（low to moderate）。\n加州普通啤酒（BJCP 19A）：果酯为低至中低（low to moderate）。\n两者果酯水平相似，但风味整体差异很大，题目表述“相似”不够准确，按标准答案设定为错误。","tag":"原题 344","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"酯类特征需核对指南","sourceNo":344},{"id":"S345","cat":"啤酒风格与比较","type":"single","stem":"最适合最佳苦啤（Best Bitter）的啤酒花是：","options":["肯特戈尔丁啤酒花","卡斯卡特（啤酒花品种）","哈尔塔瓦和泰特南格","任何低 α 酸品种","斯蒂里亚金啤酒花"],"answer":[0],"explain":"最佳苦啤（BJCP 11B） 是英式淡色艾尔，使用英式啤酒花。\n肯特戈尔丁（Kent Goldings） 是英式经典酒花，提供泥土/花香特征。\nB（卡斯卡特）→美式酒花；C→德式酒花；D 过于宽泛；E→斯洛文尼亚酒花（非英式）。","tag":"原题 345","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":345},{"id":"S346","cat":"啤酒风格与比较","type":"tf","stem":"强烈苦啤（Strong Bitter）因桶陈酿可能有轻微浑浊。","options":["正确","错误"],"answer":[0],"explain":"强烈苦啤（BJCP 11C） 若是木桶陈酿（cask-conditioned） 版本，可能因酵母悬浮和未过滤而有轻\n微浑浊（slight haze），这是木桶艾尔的典型特征。","tag":"原题 346","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":346},{"id":"S347","cat":"啤酒风格与比较","type":"tf","stem":"慕尼黑淡色啤酒（Munich Helles）可以有轻微的贵族啤酒花特征。","options":["正确","错误"],"answer":[0],"explain":"慕尼黑淡色（BJCP 4A） 允许低至中低的贵族啤酒花香气（low to moderate noble hop\naroma），花香/辛香特征。","tag":"原题 347","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":347},{"id":"S348","cat":"感官与异味","type":"tf","stem":"帝国烈性黑啤（Imperial Stout）中可接受轻微涩味且无刺激感。","options":["正确","错误"],"answer":[1],"explain":"帝国烈性黑啤（BJCP 20C） 虽使用大量深色麦芽，但涩味（astringency） 仍为缺陷，不应出现。\n苦味和烘烤特征可接受，但涩味是工艺问题。","tag":"原题 348","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":348},{"id":"S349","cat":"啤酒风格与比较","type":"single","stem":"比利时淡色艾尔（Belgian Pale Ale）和强烈苦啤（Strong Bitter）中常用的麦芽有：","options":["浅色和片状玉米","浅色和黑色","浅色麦芽和特殊 B 麦芽","浅色和水晶","淡色和维也纳"],"answer":[3],"explain":"比利时淡色艾尔（BJCP 24B） 和 强烈苦啤（BJCP 11C） 均使用浅色基础麦芽（pale base\nmalt） 和水晶麦芽（crystal malt） 提供色泽和焦糖风味。\n两者均为艾尔风格，使用水晶麦芽是共同点。","tag":"原题 349","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":349},{"id":"S350","cat":"啤酒风格与比较","type":"tf","stem":"即使采用最佳酿造工艺，所有艾尔和拉格啤酒中都能发现果香特征。","options":["正确","错误"],"answer":[1],"explain":"果香特征（果酯） 是所有发酵啤酒的副产物，但有些风格（如德国皮尔森、慕尼黑淡色）要求果酯极\n低至无（very low to none）。\n“所有”都能发现是不准确的——某些风格几乎感知不到。","tag":"原题 350","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":350},{"id":"S351","cat":"啤酒风格与比较","type":"tf","stem":"浅色博克（Helles Bock）和双倍博克（Doppelbock）中缺乏啤酒花香气是合适的。","options":["正确","错误"],"answer":[0],"explain":"浅色博克（BJCP 5A） 和 双倍博克（BJCP 5C） 均以麦芽为主导，啤酒花香气为低至无（low to\nnone），因此缺乏啤酒花香气是合适的。","tag":"原题 351","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":351},{"id":"S352","cat":"啤酒风格与比较","type":"multi","stem":"以下哪些原料可用于佛兰德斯红艾尔（Flanders Red Ale）和老布鲁因（Oud Bruin）？","options":["维也纳和慕尼黑麦芽","玉米片","高 α 酸啤酒花用于苦味","布雷塔酵母","特殊 B 麦芽"],"answer":[0,3,4],"explain":"佛兰德斯红艾尔（BJCP 23B） 和 老布鲁因（BJCP 23A） 均为比利时酸艾尔：\nA（维也纳和慕尼黑麦芽）正确。 提供麦芽深度和色泽。\nD（布雷塔酵母/Brettanomyces）正确。 两者均使用 Brettanomyces 等混合发酵。\nE（特殊 B 麦芽）正确。 提供深色水果/焦糖特征。\nB（玉米片）——非典型；C（高 α 酸酒花）——苦味应低，贵族酒花更合适。","tag":"原题 352","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":352},{"id":"S353","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。哪些技术能有效减少生长阶段的高级醇形成？","options":["保持发酵温度较高","避免在投酵母前向麦汁中添加氧气","保持发酵温度较低","确保有足够的酵母营养物质","尽量减少发酵罐中的热破碎物量"],"answer":[2,3],"explain":"高级醇（fusel alcohols） 在酵母应激条件下产生。\nC（保持发酵温度较低）正确。 低温减少高级醇生成。\nD（足够酵母营养物质）正确。 充足 FAN 和营养减少应激。\nA（高温）→增加高级醇；B（不充氧）→酵母应激产高级醇；E（热破碎物）→影响清澈度，不直接影\n响高级醇。","tag":"原题 353","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":353},{"id":"S354","cat":"BJCP评审与制度","type":"tf","stem":"如果啤酒开瓶时喷溅或有令人不愉快的气味，评委可在不品尝和评论啤酒特征的情况下给予礼貌 分 13 分。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】13分礼貌下限适用情形待核\nBJCP 比赛规程：若样品存在严重缺陷（喷涌/严重异味），评委可不进行完整品鉴，给予最低礼貌评分\n13 分，并注明原因。\n这是为了节省时间和保持评审效率。","tag":"原题 354","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"13分礼貌下限适用情形待核","sourceNo":354},{"id":"S355","cat":"啤酒风格与比较","type":"tf","stem":"桌上的服务员（Steward）对完成每组啤酒的封面表负有唯一责任。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】封面表职责待核\n封面表（cover sheet） 由比赛组织者/登记员负责填写和管理，而非桌边服务员。\n服务员协助倒酒、递表，但封面表管理是组织者的职责。","tag":"原题 355","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"封面表职责待核","sourceNo":355},{"id":"S356","cat":"酿造原料与工艺","type":"tf","stem":"麦汁应充氧后冷却，以减少雪利酒样风味的产生。","options":["正确","错误"],"answer":[1],"explain":"雪利酒风味是氧化的产物。\n正确的操作顺序是：先冷却麦汁，再充氧。热麦汁充氧会加速氧化反应，增加雪利酒风险。","tag":"原题 356","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":356},{"id":"S357","cat":"BJCP评审与制度","type":"tf","stem":"因为可能是现场人员录入的，礼貌上应避免在比赛中公开贬低你评分的“有问题”啤酒。","options":["正确","错误"],"answer":[0],"explain":"BJCP 裁判应保持专业和尊重，即使啤酒有严重缺陷，也应在评分表上提供建设性反馈，避免公开贬低。","tag":"原题 357","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":357},{"id":"S359","cat":"啤酒风格与比较","type":"tf","stem":"老艾尔（Old Ale）和美式大麦酒（American Barleywine）在 10%酒精度下均不适宜。","options":["正确","错误"],"answer":[1],"explain":"老艾尔（BJCP 19A）：ABV 5.0%-7.0%，10%过高。\n美式大麦酒（BJCP 22C）：ABV 8.0%-12.0%，10%适宜。\n因美式大麦酒适宜，整体判断为错误。","tag":"原题 359","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":359},{"id":"S360","cat":"啤酒风格与比较","type":"tf","stem":"比利时金色艾尔（Belgian Blonde Ale）和比利时双料（Dubbel）在 8%酒精度时均适宜。","options":["正确","错误"],"answer":[1],"explain":"比利时金色艾尔（BJCP 25A）：ABV 4.5%-6.0%，8%过高。\n比利时双料（BJCP 26B）：ABV 6.0%-7.6%，8%过高。\n两者在 8%均不适宜。","tag":"原题 360","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":360}]

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const names=arr=>arr.map(i=>'ABCDE'[i]).join('、');
function getQ(id){return QUESTIONS.find(x=>x.id===id)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function download(name,data,mime='application/json'){let blob=new Blob([data],{type:mime});let a=document.createElement('a');let u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}

function home(){let avg=saved.history.length?Math.round(saved.history.reduce((a,x)=>a+x.percent,0)/saved.history.length):0;let n=saved.history.length;return `<div class="toprow"><span class="eyebrow">路人甲的 BJCP 备考手册</span><span class="topmeta">LU REN JIA EDITION · 非官方模拟</span></div><div class="intro"><div class="intro-card"><span class="persona-label">路人甲版本 · PERSONAL EDITION</span><h1>把啤酒喝明白，<br>也把 BJCP 考明白。</h1><p>这里是<strong>路人甲的 BJCP 备考自留地</strong>。348 道简体中文模拟题，把<span style="color:#fff;font-weight:800">风格 · 异味 · 酿造 · 规则</span>拆开练、反复练。风格附英文对照，错题自动归档，适合日常积累，也适合考前冲刺。</p><p class="persona-note"><b>路人甲的备考便签：</b>喝过的酒，记住风味；做错的题，记住原因。</p></div><div class="statcard"><div class="minititle">你目前的练习记录</div><div class="heroNum">${avg}% <small>平均正确率</small></div><div><div class="bar"><div style="width:${avg}%"></div></div><div class="minor">${n} 次完成 · ${saved.wrong.length} 道待重练错题<br>数据仅存于当前浏览器</div></div></div></div><div class="sectionhead"><h2>快速开始</h2><span>判断题 / 单选题 / 多选题</span></div><div class="configs"><div class="panel"><h3>01 / 知识点范围</h3><p>针对薄弱环节集中练习；默认随机抽题。</p><select class="select" id="catSelect">${CATEGORY.map(x=>`<option value="${esc(x)}" ${x===state.cat?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="panel"><h3>02 / 练习题量</h3><p>可选择10—348题；正式模拟建议180题。</p><div class="pillrow">${[10,20,50,100,180,319].map(n=>`<button class="pill ${state.count===n?'active':''}" data-count="${n}">${n}题</button>`).join('')}</div></div><div class="panel"><h3>03 / 练习方式</h3><p>逐题解析适合学习，限时模拟适合冲刺。</p><div class="pillrow"><button class="pill active" onclick="begin('practice')">边做边看解析</button><button class="pill" onclick="begin('mock')">限时模拟</button></div></div></div><div class="startrow"><div><strong>建议：先50题专项，再180题模拟</strong><div><span>实时答案解析 · 自动记录错题 · 结束后按专题诊断</span></div></div><div class="buttonset"><button class="btn dark" onclick="exportQuestions()">↓ 导出题库 JSON</button><button class="btn" onclick="begin('practice')">开始练习 →</button></div></div><p class="note"><strong>考试参考：</strong>正式BJCP啤酒网考为180题、60分钟、正确116题及格。本练习系统限时模拟按每题20秒设置倒计时，按同等正确率计算练习通过参考线；不代表BJCP官方评分或题目难度。<br>依据：<a href="https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/" target="_blank" rel="noopener">官方网考学习指南</a> · <a href="https://www.bjcp.org/bjcp-style-guidelines/" target="_blank" rel="noopener">2021风格指南</a> · <a href="https://www.bjcp.org/education-training/education-resources/beer-faults/" target="_blank" rel="noopener">异味资料</a></p>`}
function modeHome(){return `<div class="toprow"><span class="eyebrow">路人甲备考手册 / 限时模拟</span><span class="topmeta">180题 = 60分钟</span></div><h1>限时模拟</h1><p class="lead">180题限时60分钟：与正式网考相同的答题节奏。限时模拟交卷后才显示正确答案和解析。</p><div class="panel" style="max-width:720px;margin-top:28px"><h3>模拟考试设置</h3><label class="minor" for="mockCat">练习分类</label><select class="select" id="mockCat">${CATEGORY.map(x=>`<option ${x===state.cat?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="pillrow">${[10,20,50,100,180,319].map(n=>`<button class="pill ${state.count===n?'active':''}" data-count="${n}">${n}题 / ${Math.floor(n*20/60)}:${String(n*20%60).padStart(2,'0')}</button>`).join('')}</div><div class="checknote">说明：抽题范围不够时自动使用该分类下的全部题目。</div><button class="btn" style="margin-top:23px" onclick="begin('mock')">开始限时模拟 →</button></div>`}
function begin(mode,fromWrong=false){stopClock();let catBox=$('#catSelect')||$('#mockCat');if(catBox)state.cat=catBox.value;let list=fromWrong?saved.wrong.map(getQ).filter(q=>q&&q.status!=='review'):QUESTIONS.filter(q=>q.status!=='review'&&(state.cat==='全部分类'||q.cat===state.cat));if(!list.length){alert('当前没有可练习题目。');return;}let qs=mode==='mock'&&!fromWrong&&state.count===180&&state.cat==='全部分类'?shuffle([...shuffle(list.filter(q=>q.cat==='BJCP评审与制度')).slice(0,20),...shuffle(list.filter(q=>q.cat==='啤酒风格与比较')).slice(0,92),...shuffle(list.filter(q=>q.cat==='感官与异味')).slice(0,36),...shuffle(list.filter(q=>q.cat==='酿造原料与工艺')).slice(0,32)]):shuffle(list).slice(0,fromWrong?list.length:state.count);state.run={mode,qs,index:0,answers:{},checked:{},deadline:mode==='mock'?Date.now()+qs.length*20000:null,fromWrong,done:false};state.report=null;state.view='session';render();if(mode==='mock'){state.tick=setInterval(()=>{if(!state.run||state.run.mode!=='mock'){stopClock();return}if(Date.now()>=state.run.deadline){finish(true)}else{let t=$('#timer');if(t){let left=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(left);t.classList.toggle('warn',left<60)}}},300)}window.scrollTo(0,0)}
function stopClock(){if(state.tick){clearInterval(state.tick);state.tick=null}}
const clock=sec=>`${String(Math.floor(Math.max(0,sec)/60)).padStart(2,'0')}:${String(Math.max(0,sec)%60).padStart(2,'0')}`;
function getSelected(q){return (state.run.answers[q.id]||[])}
function same(a,b){return [...a].sort().join(',')===[...b].sort().join(',')}
function choose(i){let r=state.run;if(!r||r.done)return;let q=r.qs[r.index];if(r.mode==='practice'&&r.checked[q.id])return;let a=getSelected(q);r.answers[q.id]=q.type==='multi'?(a.includes(i)?a.filter(x=>x!==i):[...a,i]):[i];renderSessionQuestion()}
function check(){let r=state.run;if(!r)return;let q=r.qs[r.index];if(!getSelected(q).length)return;r.checked[q.id]=true;renderSessionQuestion()}
function move(step){let r=state.run;if(!r)return;if(r.index+step>=r.qs.length){finish(false);return}r.index=Math.max(0,r.index+step);render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(auto){stopClock();let r=state.run;if(!r||r.done)return;r.done=true;let judged=r.qs.map(q=>{let selected=r.answers[q.id]||[];return {id:q.id,selected,correct:same(selected,q.answer),attempted:selected.length>0,cat:q.cat}});let hit=judged.filter(x=>x.correct).length;let wrong=judged.filter(x=>!x.correct).map(x=>x.id);const bad=new Set([...saved.wrong,...wrong]);judged.filter(x=>x.correct).forEach(x=>bad.delete(x.id));saved.wrong=[...bad];const rep={date:new Date().toLocaleString('zh-CN'),mode:r.mode,fromWrong:r.fromWrong,total:r.qs.length,correct:hit,attempted:judged.filter(x=>x.attempted).length,percent:Math.round(hit/r.qs.length*100),timeout:!!auto,judged};saved.history.unshift({date:rep.date,total:rep.total,correct:rep.correct,percent:rep.percent,mode:rep.mode});saved.history=saved.history.slice(0,60);persist();state.report=rep;state.view='results';render();window.scrollTo(0,0)}
function session(){let r=state.run,q=r.qs[r.index],num=r.index+1,answered=r.qs.filter(q=>(r.answers[q.id]||[]).length>0).length,left=r.mode==='mock'?Math.ceil((r.deadline-Date.now())/1000):null;return `<div class="examtop"><div><div class="eyebrow">${r.mode==='mock'?'限时模拟':'专项练习'} / ${r.fromWrong?'错题重练':'原创模拟题库'}</div><h2>第 ${num} 题 <span style="color:var(--sub);font-size:15px;font-weight:500">/ ${r.qs.length}</span></h2></div><div class="examnums">已作答 ${answered}/${r.qs.length}${left!==null?`<div class="timer ${left<60?'warn':''}" id="timer">${clock(left)}</div>`:''}</div></div><div class="progress"><span style="width:${num/r.qs.length*100}%"></span></div><div id="qarea"></div><p class="note">${r.mode==='practice'?'答题后点击“核对答案”查看解析。':'模拟过程中不显示答案；未作答题目会计为错误。'} &nbsp; · &nbsp; <a href="${E}" target="_blank">官方考试说明</a></p>`}
function renderSessionQuestion(){let area=$('#qarea');let r=state.run;if(!r||!area)return;let q=r.qs[r.index],a=getSelected(q),shown=!!r.checked[q.id],good=same(a,q.answer);let opts=q.options.map((opt,i)=>{let sel=a.includes(i),correct=q.answer.includes(i),className=shown&&correct?'correct':shown&&sel&&!correct?'incorrect':sel?'selected':'';return `<button type="button" class="option ${className}" ${shown?'disabled':''} onclick="choose(${i})"><span class="k">${q.type==='multi'?(sel?'✓':'□'):'ABCDE'[i]}</span><span>${esc(opt)}</span></button>`}).join('');area.innerHTML=`<section class="questioncard"><div class="qhead"><span class="chip b">${esc(q.cat)}</span><span class="chip">${esc(KIND[q.type])}</span><span class="chip">${esc(q.tag)}</span></div><div class="qstem">${esc(q.stem)}</div><p class="qhint">${q.type==='multi'?'本题为多选：可选多个答案，必须全部选对才计分。':q.type==='tf'?'请选择“正确”或“错误”。':'单选题：请选择一个最佳答案。'}</p><div class="options">${opts}</div>${shown?`<div class="answerbox"><strong style="color:${good?'var(--green)':'var(--red)'}">${good?'✓ 回答正确':'× 回答错误'} · 标准答案：${names(q.answer)}</strong><p>${esc(q.explain)}</p><small>知识点：${esc(q.tag)}　 <a href="${q.source}" target="_blank" rel="noopener noreferrer">查阅BJCP官方依据 ↗</a></small></div>`:''}<div class="qactions"><button class="btn ghost" onclick="${r.index===0?"quit()":"move(-1)"}">${r.index===0?'退出练习':'← 上一题'}</button><div class="buttonset">${r.mode==='practice'&&!shown?`<button class="btn dark" ${a.length?'':'disabled'} onclick="check()">核对答案</button>`:''}${r.mode==='practice'&&!shown?`<button class="btn ghost" onclick="move(1)">跳过 →</button>`:`<button class="btn" onclick="move(1)">${r.index===r.qs.length-1?'交卷 / 查看成绩':'下一题 →'}</button>`}${r.mode==='mock'?`<button class="btn ghost" onclick="finish(false)">提前交卷</button>`:''}</div></div></section>`}
function quit(){if(!confirm('结束当前练习并返回首页？本次未交卷，不计入成绩。'))return;switchView('home')}
function results(){let r=state.report;let passed=r.total===180 ? r.correct>=116 : r.correct/r.total>=116/180;let breakdown=CATEGORY.slice(1).map(c=>{let z=r.judged.filter(x=>x.cat===c);return z.length?`<div class="metric"><strong>${z.filter(x=>x.correct).length}<span style="font-size:17px;color:var(--sub)">/${z.length}</span></strong><span>${c}</span></div>`:''}).join('');let mistakes=r.judged.filter(x=>!x.correct);return `<div class="toprow"><span class="eyebrow">路人甲的练习记录 / 本轮成绩</span><span class="topmeta">${esc(r.date)}</span></div><h1>本轮完成</h1><div class="resultBanner"><div><div class="eyebrow" style="color:var(--lime)">${passed?'达到参考通过线':'建议继续练习'}</div><h2>${r.correct} / ${r.total} 题正确</h2><p>${r.timeout?'本轮因倒计时结束而自动交卷。':'已完成本轮练习。'} 正式考试的参考通过线为116/180；这里仅对照正确率，不代表真实考试结论。</p></div><div class="score">${r.percent}%</div></div><div class="grid2">${breakdown}</div><div class="sectionhead"><h2>错题与漏答（${mistakes.length}）</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出练习记录</button><button class="btn tiny" onclick="repeatWrong()" ${!saved.wrong.length?'disabled':''}>重练全部错题 →</button></div></div>${mistakes.length?mistakes.map((x,i)=>{let q=getQ(x.id);return `<div class="reviewitem"><div class="label">${esc(q.cat)} · ${esc(q.id)} · ${x.attempted?'答错':'未答'}</div><h3>${i+1}. ${esc(q.stem)}</h3><div class="meta">你的选择：${x.selected.length?names(x.selected):'未作答'}　正确答案：${names(q.answer)}</div><p>${esc(q.explain)} <a href="${q.source}" target="_blank" rel="noopener">官方资料 ↗</a></p></div>`}).join(''):'<div class="empty"><strong>本轮全对</strong>这一轮没有错题。</div>'}<div class="buttonset" style="margin-top:22px"><button class="btn dark" onclick="switchView('home')">返回首页</button><button class="btn ghost" onclick="begin('${r.mode}')">再做一轮 →</button></div>`}
function repeatWrong(){state.cat='全部分类';begin('practice',true)}
function wrong(){let qs=saved.wrong.map(getQ).filter(Boolean);return `<div class="toprow"><span class="eyebrow">路人甲的错题便签 / 专项巩固</span><span class="topmeta">本机持久保存</span></div><h1>错题重练</h1><p class="lead">完成整轮练习后，答错或未答题目会加入错题本；重练答对的题会自动移出。</p><div class="sectionhead"><h2>${qs.length} 道待巩固</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出记录</button><button class="btn tiny" ${qs.length?'':'disabled'} onclick="repeatWrong()">开始错题重练 →</button></div></div>${qs.length?qs.map(x=>`<div class="reviewitem"><div class="label">${esc(x.cat)} · ${esc(KIND[x.type])} · ${esc(x.tag)}</div><h3>${esc(x.stem)}</h3><p>练习答对后可从错题本移除。 <a href="${x.source}" target="_blank" rel="noopener">查看相关官方知识点 ↗</a></p></div>`).join(''):'<div class="empty"><strong>还没有错题</strong>完成一轮模拟或专项练习后，这里会记录需要复习的内容。<div style="margin-top:18px"><button class="btn" onclick="switchView(&#39;home&#39;)">去做题 →</button></div></div>'}<div class="note">如果需要清空所有练习记录，可点击：<button class="btn tiny ghost" onclick="resetAll()">清空本机记录</button>。此操作无法撤销。</div>`}
function resetAll(){if(!confirm('确认清除错题及所有历史成绩？不可撤销。'))return;saved={wrong:[],history:[],saved:[]};persist();render()}
function index(){let groups=CATEGORY.slice(1).map(c=>({cat:c,tags:[...new Set(QUESTIONS.filter(q=>q.cat===c).map(q=>q.tag))],n:QUESTIONS.filter(q=>q.cat===c).length}));return `<div class="toprow"><span class="eyebrow">路人甲备考笔记 / 知识点索引</span><span class="topmeta">2021 年版《啤酒风格指南》</span></div><h1>知识点索引</h1><p class="lead">按主题检索常考概念，点击开始针对性练习。每一道题均附有 BJCP 官方参考资料链接；题干与解析采用简体中文，风格名称保留英文对照。</p><div class="indexgrid" style="margin-top:24px">${groups.map(g=>`<div class="panel"><h3>${esc(g.cat)} <span style="color:var(--sub);font-size:12px;font-weight:500">· ${g.n}题</span></h3><p>${g.tags.map(esc).join(' · ')}</p><button class="btn tiny ghost" style="margin-top:18px" onclick="focusCategory('${g.cat}')">练这一类 →</button></div>`).join('')}</div><div class="sectionhead"><h2>官方资料入口</h2></div><div class="panel"><p style="font-size:14px"><a href="${G}" target="_blank" rel="noopener">BJCP 2021 啤酒风格指南 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${E}" target="_blank" rel="noopener">BJCP 网考学习指南与题型范围 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${F}" target="_blank" rel="noopener">BJCP Beer Faults 异味排查 ↗</a></p></div><div class="startrow"><div><strong>可导出本348题完整题库 JSON</strong><div><span>包含题干、选项、答案、解析、知识点与来源链接。</span></div></div><button class="btn dark" onclick="exportQuestions()">下载 JSON ↘</button></div>`}

function render(){let content=state.view==='home'?home():state.view==='exam'?modeHome():state.view==='session'?session():state.view==='results'?results():state.view==='wrong'?wrong():state.view==='review'?review():state.view==='audit'?audit():index();$('#app').innerHTML=content+'<footer class="footer"><strong>路人甲的 BJCP 备考手册</strong> · 个人整理与练习版本，非 BJCP 官方产品。348道题均来源于个人提供的文档，非官方题库；部分答案仍有待核验。<br>资料链接用于备考核对；考试前请以 BJCP 官方指南与更正为准。<span style="float:right">路人甲版 V2.0 · 2026-10-13</span></footer>';if(state.view==='session')renderSessionQuestion();document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{state.count=Number(b.dataset.count);render()}));let e=$('#catSelect')||$('#mockCat');if(e)e.addEventListener('change',()=>{state.cat=e.value});}

function stash(){
  let r=state.run;
  if(!r||r.done)return;
  try { localStorage.setItem(PROGRESS_KEY,JSON.stringify({mode:r.mode,qs:r.qs.map(q=>q.id),index:r.index,answers:r.answers,checked:r.checked,deadline:r.deadline,fromWrong:r.fromWrong,updatedAt:Date.now()})); } catch(e){}
}
function loadStash(){
  try {
    let o=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');
    if(!o||!Array.isArray(o.qs)||!o.qs.length)return null;
    let q=o.qs.map(getQ);
    if(q.some(x=>!x))return null;
    return {mode:o.mode,qs:q,index:Math.max(0,Math.min(o.index||0,q.length-1)),answers:o.answers||{},checked:o.checked||{},deadline:o.deadline||null,fromWrong:!!o.fromWrong,done:false};
  } catch(e){return null}
}
function forgetStash(){try{localStorage.removeItem(PROGRESS_KEY)}catch(e){}}
function relaunchTimer(){
  stopClock();
  if(!state.run||state.run.mode!=='mock')return;
  if(Date.now() >= state.run.deadline){ finish(true);return; }
  state.tick=setInterval(()=>{
    if(!state.run||state.run.mode!=='mock'){stopClock();return}
    if(Date.now()>=state.run.deadline){finish(true);return}
    let t=$('#timer'); if(t){let l=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(l);t.classList.toggle('warn',l<60)}
  },300);
}
function resumeSession(){
  let r=loadStash();
  if(!r){alert('没有可以恢复的练习进度。');render();return}
  state.run=r; state.report=null;state.view='session';
  render();relaunchTimer();window.scrollTo(0,0);
}
const _home=home;
home=function(){
  let html=_home();
  let r=loadStash();
  const resume=r?`<div class="resume-bar"><div><b>上次练习尚未完成</b><p>第 ${r.index+1} / ${r.qs.length} 题 · ${r.mode==='mock'?'限时模拟':'专项练习'}${r.mode==='mock'&&Date.now()>=r.deadline?' · 已超时':''}</p></div><button class="btn dark" onclick="resumeSession()">继续答题 →</button></div>`:'';
  const hint=`<div class="mobile-hint"><strong>📱 把题库放到 iPhone 主屏幕</strong>Safari 打开本网页 → 点击「分享」→「添加到主屏幕」。以后点图标就能打开。<div class="minor">练习记录仅保存在当前浏览器，本机可恢复未交卷的进度。清除 Safari 网站数据后，记录也可能消失；不会自动跨设备同步。</div></div>`;
  return resume+html+hint;
}
const _begin=begin;
begin=function(...args){forgetStash();_begin(...args);stash()};
const _choose=choose;
choose=function(...args){_choose(...args);stash()};
const _check=check;
check=function(...args){_check(...args);stash()};
const _move=move;
move=function(...args){_move(...args);stash()};
const _finish=finish;
finish=function(...args){_finish(...args);forgetStash()};
const _quit=quit;
quit=function(){let had=state.run;_quit();if(had && state.view==='home')forgetStash()};
const _reset=resetAll;
resetAll=function(){let had=saved.history.length+saved.wrong.length;_reset();if(had && saved.history.length===0 && saved.wrong.length===0)forgetStash()};
window.addEventListener('pagehide',stash);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stash();else if(state.run?.mode==='mock'&&Date.now()>=state.run.deadline)finish(true)});
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

render();
</script></body></html>
