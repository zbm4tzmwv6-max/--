<script>
const QUESTIONS=[{"id":"BJ001","cat":"BJCP规则","type":"tf","stem":"通过 BJCP 啤酒网考后，就已经取得 BJCP 认证评审身份。","options":["正确","错误"],"answer":[1],"explain":"网考是参加后续品鉴评审考试的入场资格；还需通过品鉴评审考试才可获得认证身份。","tag":"认证流程","source":"https://www.bjcp.org/exam-certification/exam-program-overview/online-exam/"},{"id":"BJ002","cat":"BJCP规则","type":"tf","stem":"BJCP 啤酒网考允许考生查阅风格指南等资料。","options":["正确","错误"],"answer":[0],"explain":"网考采用开卷形式，但180题仅有60分钟，考前熟悉资料位置非常重要。","tag":"考试规则","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ003","cat":"BJCP规则","type":"single","stem":"参加 BJCP 啤酒网考时，时间与题量的正确组合是？","options":["90题／30分钟","180题／60分钟","100题／90分钟","180题／120分钟"],"answer":[1],"explain":"官方规定啤酒网考180题，限时60分钟。","tag":"考试规则","source":"https://www.bjcp.org/exam-certification/exam-program-overview/online-exam/"},{"id":"BJ004","cat":"BJCP规则","type":"tf","stem":"BJCP评审给出反馈时，应尽量描述可感知的特征，并提出建设性建议，而非仅表达个人喜恶。","options":["正确","错误"],"answer":[0],"explain":"评审需要感官描述、准确度和建设性的改进反馈；仅表达“我不喜欢”，不构成充分的评审依据。","tag":"评审方法","source":"https://www.bjcp.org/education-training/exam-preparation/beer-part-1-bjcp-process-guidelines/"},{"id":"BJ005","cat":"BJCP规则","type":"tf","stem":"2021 版 BJCP《啤酒风格指南》（Beer Style Guidelines） 仍是啤酒网考采用的现行风格标准。","options":["正确","错误"],"answer":[0],"explain":"BJCP官方说明2021版为当前啤酒风格指南，适用于网考、品鉴考试与笔试。","tag":"参考标准","source":"https://www.bjcp.org/bjcp-style-guidelines/"},{"id":"BJ006","cat":"啤酒风格","type":"tf","stem":"21A 美式 IPA（American IPA） 应以酒花为主导，发酵特征通常较干净，收口偏干。","options":["正确","错误"],"answer":[0],"explain":"21A强调突出的酒花香气与苦度、干净的发酵表现、较干的收口。","tag":"21A 美式IPA","source":"https://www.bjcp.org/style/2021/21/21A/"},{"id":"BJ007","cat":"啤酒风格","type":"single","stem":"一杯啤酒有明显香蕉酯香、丁香酚香、高碳酸感和柔软麦香，最接近以下哪类？","options":["10A 德式小麦啤酒（Weissbier）","1D 美式小麦啤酒（American Wheat Beer）","3B 捷克优质浅色拉格（Czech Premium Pale Lager）","21A 美式 IPA（American IPA）"],"answer":[0],"explain":"10A德式小麦的标志性发酵轮廓是香蕉酯香和丁香酚香。","tag":"10A 德式小麦","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ008","cat":"啤酒风格","type":"tf","stem":"1D 美式小麦啤酒（American Wheat Beer） 的典型特征包括显著丁香酚香与香蕉酯香。","options":["正确","错误"],"answer":[1],"explain":"美式小麦通常使用较干净的发酵表现；明显香蕉和丁香特征不符合1D。","tag":"1D 美式小麦","source":"https://www.bjcp.org/style/2021/1/1D/"},{"id":"BJ009","cat":"啤酒风格","type":"tf","stem":"3B 捷克优质浅色拉格（Czech Premium Pale Lager） 在低水平时允许出现双乙酰（Diacetyl），但浓重黄油味仍然是缺陷。","options":["正确","错误"],"answer":[0],"explain":"3B允许轻微至中低水平双乙酰，这并不意味着强烈黄油味符合风格。","tag":"3B 捷克优质浅色拉格","source":"https://www.bjcp.org/style/2021/3/3B/"},{"id":"BJ010","cat":"啤酒风格","type":"single","stem":"下列哪种风格通常比德国皮尔森（德式皮尔森（German Pils））更偏向柔和麦芽表现、苦度较克制？","options":["慕尼黑淡色拉格（Munich Helles）","美式 IPA（American IPA）","双倍 IPA（Double IPA）","柏林小麦酸啤（Berliner Weisse）"],"answer":[0],"explain":"慕尼黑淡色拉格（4A）倾向细腻、麦芽主导且苦度较低；德式皮尔森（German Pils）更突出清脆苦度。","tag":"4A 慕尼黑淡色拉格","source":"https://www.bjcp.org/style/2021/4/4A/"},{"id":"BJ011","cat":"啤酒风格","type":"tf","stem":"与3B 捷克优质浅色拉格（Czech Premium Pale Lager）相比，3A 捷克浅色拉格（Czech Pale Lager） 通常酒精度更低、酒体更轻。","options":["正确","错误"],"answer":[0],"explain":"3A保留捷克浅色拉格特点，但强度较低、酒体较轻。","tag":"3A与3B对比","source":"https://www.bjcp.org/style/2021/3/3A/"},{"id":"BJ012","cat":"啤酒风格","type":"single","stem":"以下哪类通常是 21A 美式 IPA（American IPA） 的更高酒精度、更强酒花表现版本？","options":["22A 双倍 IPA（Double IPA）","11A 普通英式苦啤（Ordinary Bitter）","4A 慕尼黑淡色拉格（Munich Helles）","10A 德式小麦啤酒（Weissbier）"],"answer":[0],"explain":"22A 双倍 IPA（Double IPA）比美式 IPA（American IPA）更强、更浓郁且酒花表达更高。","tag":"22A 双倍IPA","source":"https://www.bjcp.org/style/2021/22/22A/"},{"id":"BJ013","cat":"啤酒风格","type":"tf","stem":"18B 美式淡色艾尔（American Pale Ale） 通常比21A 美式 IPA（American IPA）更低酒精度，酒花强度也较温和。","options":["正确","错误"],"answer":[0],"explain":"18B总体强度和酒花苦度通常低于21A，具体风味仍有重叠。","tag":"18B与21A对比","source":"https://www.bjcp.org/style/2021/18/18B/"},{"id":"BJ014","cat":"啤酒风格","type":"tf","stem":"21B 黑 IPA（Black IPA） 应具有突出的焦糊味、浓烈黑麦芽烘烤味，盖过酒花香气。","options":["正确","错误"],"answer":[1],"explain":"黑IPA应保留IPA平衡；深色麦芽仅作辅助，不应出现强烈焦糊或明显主导的烘烤味。","tag":"21B 黑IPA","source":"https://www.bjcp.org/style/2021/21/"},{"id":"BJ015","cat":"啤酒风格","type":"single","stem":"25C 比利时金色烈性艾尔（Belgian Golden Strong Ale） 的典型组合是？","options":["浅色、高发酵度、偏干、高碳酸","深黑色、厚重焦糊、低碳酸","低酒精、强乳酸味、无酒花","浓烈木桶香、高残糖、低碳酸"],"answer":[0],"explain":"比利时金色烈性艾尔浅色、高发酵度、高碳酸、较轻酒体与干爽收口。","tag":"25C 比利时金色烈性","source":"https://www.bjcp.org/style/2021/25/25C/"},{"id":"BJ016","cat":"啤酒风格","type":"tf","stem":"10B 深色德式小麦啤酒（Dunkles Weissbier） 可同时具有德式小麦酵母的香蕉／丁香发酵特征和更明显的深色麦芽风味。","options":["正确","错误"],"answer":[0],"explain":"10B保留小麦酵母特征，并有更深色、更丰富的麦芽风味。","tag":"10B 深色德式小麦","source":"https://www.bjcp.org/style/2021/10/10B/"},{"id":"BJ017","cat":"啤酒风格","type":"single","stem":"哪类啤酒主要以清洁乳酸酸度、较低酒精度、很高的碳酸感为识别要点？","options":["23A 柏林小麦酸啤（Berliner Weisse）","9A 双博克（Doppelbock）","15C 爱尔兰加强世涛（Irish Extra Stout）","21A 美式 IPA（American IPA）"],"answer":[0],"explain":"23A柏林小麦酸啤强调乳酸酸度、较轻酒体、低酒精和高碳酸。","tag":"23A 柏林小麦酸","source":"https://www.bjcp.org/style/2021/23/23A/"},{"id":"BJ018","cat":"啤酒风格","type":"tf","stem":"25B 赛松（Saison） 的典型收口通常偏干，且可出现果香、辛香酵母特征。","options":["正确","错误"],"answer":[0],"explain":"赛松通常高度发酵、较高碳酸、干爽，果香与辛香来自酵母和酒花的组合。","tag":"25B 赛松","source":"https://www.bjcp.org/style/2021/25/25B/"},{"id":"BJ019","cat":"啤酒风格","type":"tf","stem":"4A 慕尼黑淡色拉格（Munich Helles） 的典型平衡应当比5D 德式皮尔森（German Pils）更加突出尖锐苦度。","options":["正确","错误"],"answer":[1],"explain":"慕尼黑淡色拉格（Helles）注重柔和麦芽和克制苦度；德式皮尔森（German Pils）苦度与收口通常更突出。","tag":"浅色拉格比较","source":"https://www.bjcp.org/style/2021/4/4A/"},{"id":"BJ020","cat":"啤酒风格","type":"single","stem":"与美式小麦啤酒（American Wheat）相比，10A 德式小麦啤酒（Weissbier）最具辨识度的区别通常是？","options":["明显的香蕉酯香与丁香酚香","一定使用烟熏麦芽","必须具有乳酸酸度","必须使用美式酒花干投"],"answer":[0],"explain":"德式小麦的酵母特征更鲜明，美式小麦强调干净发酵。","tag":"小麦风格对比","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ021","cat":"啤酒风格","type":"tf","stem":"11A 普通英式苦啤（Ordinary Bitter） 通常属于相对低酒精度的英式苦啤，适合体现麦芽、酒花与酵母的平衡。","options":["正确","错误"],"answer":[0],"explain":"普通英式苦啤（Ordinary Bitter）是日常饮用的低度英式苦啤，麦芽与苦度、酯香应均衡。","tag":"11A 英式苦啤","source":"https://www.bjcp.org/style/2021/11/11A/"},{"id":"BJ022","cat":"啤酒风格","type":"single","stem":"下列哪种风格以较强麦芽轮廓为主，常见面包皮／深色麦芽的美拉德风味，苦度通常不占主导？","options":["9A 双博克（Doppelbock）","21A 美式 IPA（American IPA）","23A 柏林小麦酸啤（Berliner Weisse）","1D 美式小麦啤酒（American Wheat）"],"answer":[0],"explain":"双博克（Doppelbock）属于强烈、富麦芽风味的德式博克家族酒款。","tag":"9A 双博克","source":"https://www.bjcp.org/style/2021/9/9A/"},{"id":"BJ023","cat":"啤酒风格","type":"tf","stem":"16A 甜世涛（Sweet Stout） 可因乳糖等不可发酵糖而产生明显甜度与较饱满的口感。","options":["正确","错误"],"answer":[0],"explain":"甜世涛（甜世涛（Sweet Stout））通常比干世涛更甜、更丰满，乳糖是常见做法。","tag":"16A 甜世涛","source":"https://www.bjcp.org/style/2021/16/16A/"},{"id":"BJ024","cat":"啤酒风格","type":"multi","stem":"关于21A 美式 IPA（American IPA），选择所有正确表述。","options":["酒花香气可以是柑橘、松脂、热带水果等","通常要求强烈烤焦味压倒酒花","整体平衡通常偏向酒花","可接受明显粗糙、灼烧般的收敛感"],"answer":[0,2],"explain":"21A鼓励多样酒花表达，但要求苦味有支撑且避免明显粗糙感；重度焦糊不是典型特点。","tag":"21A 美式IPA","source":"https://www.bjcp.org/style/2021/21/21A/"},{"id":"BJ025","cat":"啤酒风格","type":"multi","stem":"比较德式小麦（10A）和美式小麦（1D），哪些陈述正确？","options":["10A常有香蕉酯香","1D应具有典型丁香酚香","1D通常较干净、突出谷物小麦风味","10A通常具有较高碳酸感"],"answer":[0,2,3],"explain":"10A酵母风味较突出；1D酵母轮廓较干净。二者都可能有不错的碳酸感。","tag":"小麦风格对比","source":"https://www.bjcp.org/style/2021/10/10A/"},{"id":"BJ026","cat":"啤酒风格","type":"multi","stem":"下列哪些描述符合3B 捷克优质浅色拉格（Czech Premium Pale Lager）的典型表现？","options":["面包感较丰富的麦芽","辛香、草本或花香酒花","圆润但不粗糙的苦度","浓烈醋酸感是典型风味"],"answer":[0,1,2],"explain":"3B有较丰富的麦芽与欧洲型酒花平衡，通常不应有明显醋酸。","tag":"3B 捷克优质浅色拉格","source":"https://www.bjcp.org/style/2021/3/3B/"},{"id":"BJ027","cat":"啤酒风格","type":"multi","stem":"关于25B 赛松（Saison），选择所有正确表述。","options":["通常收口很干","可具有辛香或果香发酵特征","通常碳酸感较高","典型要求厚重、黏腻、极甜的收口"],"answer":[0,1,2],"explain":"高度发酵、干爽与较高碳酸是赛松的重要特征；厚重甜腻不合适。","tag":"25B 赛松","source":"https://www.bjcp.org/style/2021/25/25B/"},{"id":"BJ028","cat":"啤酒风格","type":"multi","stem":"哪些表述更符合德国皮尔森与慕尼黑淡色拉格的风格对比？","options":["德式皮尔森（German Pils）往往呈现更鲜明的苦度","慕尼黑淡色拉格（Munich Helles）通常更强调细致麦芽","两者都必须有明显香蕉酯香","两者均属浅色拉格"],"answer":[0,1,3],"explain":"德式皮尔森（German Pils）更清脆偏苦；慕尼黑淡色拉格（Helles）更柔和平衡且偏麦芽；都不是德式小麦。","tag":"浅色拉格比较","source":"https://www.bjcp.org/style/2021/5/5D/"},{"id":"BJ029","cat":"啤酒风格","type":"multi","stem":"关于22A 双倍 IPA（Double IPA），哪些描述通常正确？","options":["强度通常高于21A 美式 IPA（American IPA）","强调酒花表现与较干的收口","典型风格应表现强烈溶剂味","属于高酒精度的IPA相关风格"],"answer":[0,1,3],"explain":"双倍 IPA（Double IPA）保持酒花主导与可饮用性，酒精可感但刺激性溶剂味不应成为优点。","tag":"22A 双倍IPA","source":"https://www.bjcp.org/style/2021/22/22A/"},{"id":"BJ030","cat":"感官与异味","type":"single","stem":"某杯啤酒有类似奶油爆米花的味道，应首先怀疑什么化合物？","options":["双乙酰 Diacetyl","乙醛 Acetaldehyde","二甲基硫 DMS","异戊酸 Isovaleric acid"],"answer":[0],"explain":"双乙酰典型呈黄油、奶油糖或黄油爆米花风味；是否为缺陷取决于风格与强度。","tag":"双乙酰","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ031","cat":"感官与异味","type":"single","stem":"闻到显著的水煮玉米／罐头玉米气味，最应考虑？","options":["DMS（二甲基硫）","异戊酸","单宁","氧化纸板味"],"answer":[0],"explain":"DMS常描述为熟玉米味，高水平可能与煮沸、冷却等工艺有关。","tag":"DMS","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ032","cat":"感官与异味","type":"single","stem":"明显的生青苹果、青叶气味最常关联哪项？","options":["乙醛 Acetaldehyde","乳酸 Lactic acid","双乙酰 Diacetyl","乙酸乙酯 Ethyl acetate"],"answer":[0],"explain":"乙醛典型呈生青苹果或青草等气味，可见于未充分成熟的啤酒。","tag":"乙醛","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ033","cat":"感官与异味","type":"single","stem":"一款原本酒花新鲜的啤酒出现纸板、陈旧纸张气息，最应考虑？","options":["氧化 Oxidation","乳酸发酵","正常丁香酚香","正常DMS"],"answer":[0],"explain":"纸板／陈旧纸味常与氧化有关，尤其须控制发酵后的氧接触。","tag":"氧化","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ034","cat":"感官与异味","type":"tf","stem":"收敛感（Astringency）与苦度（Bitterness）是完全相同的感官概念。","options":["正确","错误"],"answer":[1],"explain":"收敛感常是口腔干涩、粗糙、收缩感；苦度则是味觉强度，两者可同时出现但并不等同。","tag":"收敛感","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ035","cat":"感官与异味","type":"tf","stem":"丁香、胡椒一类的辛香有时与啤酒中的酚类（Phenols）相关。","options":["正确","错误"],"answer":[0],"explain":"酚类可以表现为丁香、胡椒等辛香，也可能造成烟熏／药味等不同感官印象。","tag":"酚类","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ036","cat":"感官与异味","type":"tf","stem":"酯类（Esters）可以带来梨、香蕉、苹果等水果气息，且在部分啤酒风格中属于期望特征。","options":["正确","错误"],"answer":[0],"explain":"酯类是发酵过程中形成的芳香物质，是否适合取决于对应风格。","tag":"酯类","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ037","cat":"感官与异味","type":"multi","stem":"哪些属于啤酒常见的缺陷或感官描述与对应关系？","options":["双乙酰—黄油／奶油糖","DMS—熟玉米","乙醛—青苹果","氧化—更强烈的新鲜酒花香"],"answer":[0,1,2],"explain":"三种关联均是BJCP常见缺陷线索；氧化一般使新鲜酒花表现下降，可能带来纸板或陈旧感。","tag":"异味辨识","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ038","cat":"感官与异味","type":"multi","stem":"对于明显收敛、涩口的啤酒，哪些操作可能是合理的排查方向？","options":["检查洗糟水pH是否过高","评估是否过度洗糟","检查是否有过量提取的谷壳单宁","认定一定是因为酒花品种不够昂贵"],"answer":[0,1,2],"explain":"洗糟条件、谷壳单宁等均可导致收敛；不存在由酒花价格直接决定的规律。","tag":"收敛感","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ039","cat":"酿造与原料","type":"tf","stem":"在其他条件相近时，提高糖化温度往往会降低麦汁可发酵性，使成酒更丰满。","options":["正确","错误"],"answer":[0],"explain":"较高糖化温度倾向产生更多不易被酵母发酵的糊精，通常会提高终点密度和酒体。","tag":"糖化温度","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ040","cat":"酿造与原料","type":"tf","stem":"冷端干投酒花主要用于增加酒花香气，但并不保证所有情况下苦度都完全不变。","options":["正确","错误"],"answer":[0],"explain":"干投首要作用是提高香气与风味，但酒花多酚、氧化葎草酮（humulinones）等因素也可能影响感知苦度。","tag":"干投酒花","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ041","cat":"酿造与原料","type":"single","stem":"若希望降低传统拉格中剩余的双乙酰，哪项做法通常更有针对性？","options":["在主发酵尾期安排适当升温的双乙酰休止","发酵结束后立即彻底滤除酵母","向酒中加入更多晶体麦芽","延长酒花煮沸到几天"],"answer":[0],"explain":"双乙酰休止让健康酵母有机会进一步还原双乙酰。","tag":"双乙酰休止","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ042","cat":"酿造与原料","type":"tf","stem":"用来抑制水中微生物的氯或氯胺，如果处理不当，可能在啤酒中形成不良酚味。","options":["正确","错误"],"answer":[0],"explain":"氯和氯胺可能导致氯酚相关药味等缺陷，酿造水处理很重要。","tag":"水处理","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ043","cat":"酿造与原料","type":"single","stem":"啤酒发酵后包装过程，应优先避免什么操作来降低氧化风险？","options":["剧烈泼溅、混入空气","使用CO₂置换容器中的空气","检查罐／瓶密封","低温储存"],"answer":[0],"explain":"发酵后氧接触可促进氧化，尤其损害酒花导向型啤酒的鲜度。","tag":"冷端控氧","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ044","cat":"酿造与原料","type":"tf","stem":"煮沸麦汁并及时冷却通常有助于降低DMS残留风险。","options":["正确","错误"],"answer":[0],"explain":"DMS具有挥发性，充分开放煮沸以及及时冷却有利于减少其积累。","tag":"DMS控制","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ045","cat":"酿造与原料","type":"multi","stem":"哪些措施通常有助于改善啤酒氧化控制？","options":["灌装时尽量减少空气混入","尽可能保持包装容器良好密封","使用CO₂置换部分容器氧气","装瓶时反复搅动，让空气充分进入"],"answer":[0,1,2],"explain":"冷端避免增氧、密封良好、CO₂置换是常见控氧措施。","tag":"冷端控氧","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ046","cat":"酿造与原料","type":"multi","stem":"哪些环节可能影响最终的发酵酯香或其他发酵异味？","options":["酵母菌株","发酵温度","投酵母量和酵母健康","罐身贴纸颜色"],"answer":[0,1,2],"explain":"酵母菌株、温度与健康状况都会影响发酵代谢物。","tag":"发酵管理","source":"https://www.bjcp.org/education-training/education-resources/beer-faults/"},{"id":"BJ047","cat":"啤酒风格","type":"single","stem":"BJCP 2021 中的风格编号 1A 指哪一种啤酒？","options":["美式拉格（American Lager）","美式小麦啤酒（American Wheat Beer）","美式淡拉格（American Light Lager）","奶油艾尔（Cream Ale）"],"answer":[2],"explain":"1A 对应 美式淡拉格（American Light Lager）。","tag":"风格编号","source":"https://www.bjcp.org/style/2021/1/1A/"},{"id":"BJ048","cat":"啤酒风格","type":"single","stem":"按照 BJCP 2021 风格指南，美式拉格（American Lager）对应哪个风格编号？","options":["X1","1D","1A","1B"],"answer":[3],"explain":"该风格在2021版指南的正式编号是 1B，名称为 American Lager。","tag":"风格编号","source":"https://www.bjcp.org/style/2021/1/1B/"},{"id":"BJ049","cat":"啤酒风格","type":"single","stem":"BJCP 2021 中的风格编号 1C 指哪一种啤酒？","options":["美式淡拉格（American Light Lager）","潘帕斯金色艾尔（Dorada Pampeana）","奶 ","反式-2-壬烯醛"],"answer":[2],"explain":"乙醛是发酵中间产物，未完全成熟的啤酒中可能较明显。","tag":"乙醛","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ345","cat":"感官与异味","type":"single","stem":"玉米罐头或煮熟玉米味通常与哪一种物质相关？","options":["乙酸","二甲基硫（DMS）","4-乙烯基愈创木酚","异戊酸"],"answer":[1],"explain":"DMS来自含硫前体物质的转化，风格适宜性依强度而不同。","tag":"DMS","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ346","cat":"感官与异味","type":"single","stem":"杯中出现臭鼬或强烈日晒异味，应首先考虑什么？","options":["光照促使酒花成分发生反应","双乙酰休止过长","乳酸菌正常发酵","麦芽焦糖化"],"answer":[0],"explain":"光照异味（lightstruck）常与酒花苦味成分受光发生反应有关。","tag":"光照异味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ347","cat":"感官与异味","type":"single","stem":"纸板、陈旧纸张香气最典型地提示什么？","options":["加入了大量小麦","酒花新鲜度极高","初级发酵正在旺盛进行","氧化或老化"],"answer":[3],"explain":"氧化可带来纸板样气味，反式-2-壬烯醛是常见相关化合物。","tag":"氧化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ348","cat":"感官与异味","type":"single","stem":"传统德式小麦的丁香香常由哪一酚类产生？","options":["4-乙烯基愈创木酚（4-VG）","二甲基硫","乳酸","乙醛"],"answer":[0],"explain":"4-VG的丁香样酚香是部分德式小麦风格的重要酵母表达。","tag":"酚类","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ349","cat":"感官与异味","type":"single","stem":"典型德式小麦的香蕉香通常与哪一类产物联系紧密？","options":["酒花异构α酸","氯酚","乙酸异戊酯等酯类","乳酸"],"answer":[2],"explain":"乙酸异戊酯可产生香蕉香；酵母株和发酵管理影响酯香。","tag":"酯类","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ350","cat":"感官与异味","type":"single","stem":"啤酒有明显刺鼻溶剂感、灼热酒精感，可能与哪项有关？","options":["高级醇过高","只有水中氯离子不足","酒花苦味太低","只使用了浅色麦芽"],"answer":[0],"explain":"高级醇在高浓度时会产生粗糙溶剂或热辣感，高原麦汁和发酵压力可能增大风险。","tag":"高级醇","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ351","cat":"感官与异味","type":"single","stem":"类似臭鸡蛋的硫味常关联哪一种物质？","options":["香草醛","酒花香叶醇","乳糖","硫化氢（H₂S）"],"answer":[3],"explain":"H₂S有臭鸡蛋气味，部分发酵阶段可出现，残留过量通常不理想。","tag":"硫化氢","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ352","cat":"感官与异味","type":"single","stem":"啤酒中出现干草纸板味并伴随酒花香衰减，优先排查什么？","options":["包装后的氧接触与储藏老化","小麦比例过高","水温过低","酵母沉降过快"],"answer":[0],"explain":"氧在包装与储运过程进入酒体，会促进风味老化并损害酒花香。","tag":"包装氧化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ353","cat":"感官与异味","type":"single","stem":"不新鲜酒花带来的奶酪、汗袜味通常与哪种酸有关？","options":["磷酸","异戊酸（Isovaleric acid）","柠檬酸","乳酸"],"answer":[1],"explain":"异戊酸常描述为奶酪或汗臭，与酒花老化相关。","tag":"酒花老化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ354","cat":"感官与异味","type":"single","stem":"明显的醋酸刺激与尖锐醋味通常归因于什么？","options":["乙酸积累","可溶性淀粉","硫化氢","双乙酰"],"answer":[0],"explain":"乙酸可产生醋味，乙酸菌等微生物在有氧环境下可能生成。","tag":"乙酸","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ355","cat":"感官与异味","type":"single","stem":"柔和酸奶样的酸味通常更接近哪种酸？","options":["乳酸","乙酸","丁酸","硫酸"],"answer":[0],"explain":"乳酸通常比乙酸更圆润；酸啤中乳酸可由乳酸菌产生。","tag":"乳酸","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ356","cat":"感官与异味","type":"single","stem":"马厩、皮革、野趣气味在部分野生艾尔中可能来自什么？","options":["布雷特酵母（Brettanomyces）","饮用水的二氧化碳","完全无酵母的纯糖发酵","未开封的麦芽"],"answer":[0],"explain":"Brett可产生特定酚类和复杂发酵风味；是否合适取决于风格。","tag":"布雷特","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ357","cat":"感官与异味","type":"single","stem":"消毒药水、创可贴样异味通常应考虑什么？","options":["氯酚类化合物","新鲜柑橘酒花","乙酸异戊酯","只有乳酸"],"answer":[0],"explain":"氯或氯胺与酚类相关反应可能产生氯酚异味。","tag":"氯酚","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ358","cat":"感官与异味","type":"single","stem":"啤酒中出现明显硬币、血腥样金属味，优先排查什么？","options":["酒花干投香气","酵母产香蕉酯","天然柠檬皮","金属离子或设备接触"],"answer":[3],"explain":"铁或铜等金属来源可能导致金属味。","tag":"金属异味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ359","cat":"感官与异味","type":"single","stem":"强烈的药水、塑料样酚味在清洁的美式艾尔中通常如何评价？","options":["可能属于风格外缺陷","只表示碳酸化不足","等同于新鲜酒花香","典型且必须高强度存在"],"answer":[0],"explain":"某些酚香在比利时、德式小麦中可合适，但清洁型美式艾尔不应有刺鼻药味。","tag":"风格适宜性","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ360","cat":"感官与异味","type":"single","stem":"一杯啤酒有类似指甲油去除剂的溶剂/果香，应考虑哪一种酯？","options":["双乙酰","乳酸","乙酸乙酯（Ethyl acetate）","硫化氢"],"answer":[2],"explain":"乙酸乙酯低强度可果香，过量则类似指甲油溶剂。","tag":"乙酸乙酯","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ361","cat":"感官与异味","type":"single","stem":"燃烧火柴样的刺激性硫气味最可能属于哪一类？","options":["烘烤麦芽风味","二氧化硫相关硫味","酯类香蕉味","香草木桶味"],"answer":[1],"explain":"SO₂常有火柴样硫味；需与H₂S臭鸡蛋味区分。","tag":"硫味辨别","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ362","cat":"感官与异味","type":"single","stem":"啤酒中明显的烟熏、培根样气味可能与什么关联？","options":["烟熏麦芽中的挥发性酚类","二氧化碳泡沫","纯葡萄糖","天然乳糖"],"answer":[0],"explain":"烟熏麦芽在干燥时吸收烟气酚类，是经典烟熏啤酒的重要来源。","tag":"烟熏酚类","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ363","cat":"感官与异味","type":"single","stem":"威士忌桶熟成啤酒中的香草香常与哪种木材成分有关？","options":["香草醛及相关橡木提取物","乙醛","酒花异构α酸","硫化氢"],"answer":[0],"explain":"橡木熟成可带来香草、木质或单宁风味。","tag":"橡木熟成","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ364","cat":"感官与异味","type":"single","stem":"椰子或木质甜香在一些橡木桶熟成啤酒中通常和什么有关？","options":["乳酸菌","二甲基硫","橡木内酯","铁锈"],"answer":[2],"explain":"橡木内酯可产生椰子、木质甜香，浓度与桶型有关。","tag":"橡木风味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ365","cat":"感官与异味","type":"single","stem":"舌面干涩、口腔收敛通常首先联想到哪种感官现象？","options":["残糖极高","只存在的碳酸感","涩感（Astringency）","纯粹甜感"],"answer":[2],"explain":"涩感是多酚等引发的口腔收敛感，不能简单等同于酒花苦度。","tag":"涩感","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ366","cat":"感官与异味","type":"single","stem":"酿得很干的啤酒一定口感很轻薄吗？","options":["不一定，干爽与酒体饱满度不是同一指标","一定完全不含蛋白质","一定酒体极重","一定酒体极轻"],"answer":[0],"explain":"干度与发酵终点有关，酒体还受蛋白质、糊精、碳酸化等因素影响。","tag":"干度与酒体","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ367","cat":"感官与异味","type":"single","stem":"高碳酸化的啤酒通常带来什么口腔感受？","options":["保证酒精度上升","使苦味单位必然降低","更强的起泡感与刺激感","完全消除酸味"],"answer":[2],"explain":"较高的CO₂含量可增加气泡刺激与清爽感。","tag":"碳酸化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ368","cat":"感官与异味","type":"single","stem":"酒精度较高的啤酒出现温暖感通常如何理解？","options":["表示完全未发酵","表示啤酒一定感染","适度酒精温暖感可能符合强艾尔风格","必然说明酒中甲醇超标"],"answer":[2],"explain":"在强酒风格中温暖感可适宜，但明显溶剂灼烧感通常不理想。","tag":"酒精温暖感","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ369","cat":"感官与异味","type":"single","stem":"一款柏林酸小麦呈柔和乳酸酸度，应该如何判定？","options":["所有酸味都应当扣满分","可直接判定为重度氧化","应结合对应酸啤风格评价","表示必须存在醋酸菌"],"answer":[2],"explain":"酸味在某些传统酸啤中是正向风格特征。","tag":"酸啤评审","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ370","cat":"感官与异味","type":"single","stem":"酒花带来的明显苦度和口腔干涩感是一回事吗？","options":["不是；苦度与涩感属于不同感官特征","是；两个术语完全等同","是；二者都只由糖产生","是；二者永远只来自酵母"],"answer":[0],"explain":"苦度主要与苦味物质有关，涩感更偏向口腔摩擦与收敛。","tag":"苦度与涩感","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ371","cat":"感官与异味","type":"single","stem":"捷克拉格出现低度双乙酰应如何判断？","options":["任何浓度都意味着必须淘汰","依具体风格和强度判断，部分可容许","等同于光照异味","必须达到强烈奶油糖香"],"answer":[1],"explain":"部分捷克拉格允许低水平双乙酰，但不应压倒风格特征。","tag":"允许的异味强度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ372","cat":"感官与异味","type":"single","stem":"在德式皮尔森中闻到强烈黄油味，通常应该如何评价？","options":["等同于适度硫化物","这是所有德式皮尔森必需特征","通常偏离清爽、干净的风格描述","说明酒花必定更新鲜"],"answer":[2],"explain":"德式皮尔森通常要求干净、突出酒花与麦芽平衡，强烈双乙酰不合适。","tag":"风格匹配","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ373","cat":"感官与异味","type":"single","stem":"德式小麦出现丁香酚香，最合理的结论是？","options":["说明风格编号错误","一定是氯污染","可能是合适的酵母特征","只能来自橡木桶"],"answer":[2],"explain":"传统德式小麦的丁香型酚类属于风格核心特征。","tag":"酵母表达","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ374","cat":"感官与异味","type":"single","stem":"浑浊 IPA 的蛋白/酒花雾浊应该怎么判断？","options":["任何浑浊都意味着细菌感染","结合21C风格描述，适度浑浊可以符合风格","浑浊只可能来自木桶","浑浊一定是双乙酰"],"answer":[1],"explain":"21C Hazy IPA 允许且以一定浑浊度为典型外观特征。","tag":"浑浊度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ375","cat":"感官与异味","type":"single","stem":"IPA 产生刺喉、粗糙酒花涩感时，是否可视为风格必需？","options":["不可以；明显粗糙涩感不是风格必需","是；所有 IPA 必须有明显溶剂味","是；IPA 的唯一评分标准","是；涩感越强必然越优秀"],"answer":[0],"explain":"强烈的酒花苦度可符合一些IPA，刺激性涩感与粗糙度仍需谨慎判断。","tag":"IPA涩感","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ376","cat":"感官与异味","type":"single","stem":"香蕉、梨子、苹果等水果香在没有加水果时也可能出现，主要为什么？","options":["水果香必然来自真实果汁","发酵酵母产生的酯类","完全由二氧化碳直接产生","只能来自麦汁过滤"],"answer":[1],"explain":"多种发酵酯会呈果香，不必依赖水果添加。","tag":"发酵酯","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ377","cat":"感官与异味","type":"single","stem":"比利时赛松的胡椒辛香可能主要与哪类物质有关？","options":["麦芽中的乳糖","乙醛氧化","金属锌污染","酵母形成的酚类化合物"],"answer":[3],"explain":"某些酚类酵母可产生胡椒、丁香等辛香；强度适宜性因风格而异。","tag":"赛松酚香","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ378","cat":"感官与异味","type":"single","stem":"低度焦糖味与双乙酰黄油味容易混淆时应如何处理？","options":["只凭酒精度决定","把任何甜香都当成双乙酰","区分麦芽焦糖甜香与双乙酰黄油/油滑特征","只看泡沫颜色"],"answer":[2],"explain":"焦糖可源于麦芽；双乙酰有独特黄油气味与油滑口感。","tag":"感官校准","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ379","cat":"感官与异味","type":"single","stem":"出现在部分浅色拉格中的低度DMS应如何评价？","options":["煮玉米越浓越符合全部风格","所有拉格都必须没有DMS","等同于黄油味","依据具体风格条款及强度判断"],"answer":[3],"explain":"BJCP允许某些浅色拉格存在低度煮玉米样DMS，但不能一概而论。","tag":"DMS风格边界","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ380","cat":"感官与异味","type":"single","stem":"出现强烈醋味但风格仅要求柔和乳酸酸度，可能存在什么问题？","options":["仅代表碳酸化正常","乙酸过高并偏离目标风格","一定是新鲜酒花香","完全与微生物无关"],"answer":[1],"explain":"乙酸尖锐的醋酸特征不同于圆润乳酸酸度。","tag":"酸种辨别","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ381","cat":"感官与异味","type":"single","stem":"新鲜切草、青绿植物的风味是哪个属性的典型描述？","options":["纸板样（Papery）","奶油糖样（Buttery）","青草样（Grassy）","椰子样（Coconut）"],"answer":[2],"explain":"青草样可以出现在酒花或加工相关表现中，须结合风格判断。","tag":"植物气味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ382","cat":"感官与异味","type":"single","stem":"啤酒刚开瓶时硫化氢轻微，但杯中散去后不明显，评审宜如何记录？","options":["记录实际感知的强度与变化","把其写成香蕉香","立即认定整批啤酒不可饮用","忽略所有其他特征"],"answer":[0],"explain":"感官记录应忠实反映强度及持续时间，而非夸大单一气味。","tag":"感官记录","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ383","cat":"感官与异味","type":"single","stem":"品评时强烈碳酸刺激可能使酸味感受怎样变化？","options":["可以完全消除酸味物质","能让啤酒立刻变为拉格","必定提高ABV","可能增加尖锐刺激的感知"],"answer":[3],"explain":"碳酸刺激与酸度共同影响整体口腔感受。","tag":"碳酸与酸","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ384","cat":"感官与异味","type":"single","stem":"同一杯酒在升温后香气更明显，说明什么？","options":["挥发与感知受到温度影响","评分应只凭最初闻香","官方ABV范围发生变化","发酵会立即重新开始"],"answer":[0],"explain":"温度变化影响芳香化合物挥发和感官表现，评审可观察其变化。","tag":"温度与品评","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ385","cat":"感官与异味","type":"single","stem":"颜色很深的啤酒必然酒精度很高吗？","options":["一定且必然超过10%","一定富含乳糖","不一定；颜色和ABV彼此独立","一定属于帝国世涛"],"answer":[2],"explain":"深色米尔德等可低酒精度，颜色主要取决于原料与工艺。","tag":"颜色误区","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ386","cat":"感官与异味","type":"single","stem":"深色烘烤麦芽常产生哪类风味？","options":["纯粹椰子桶香","香蕉丁香酵母酯酚","自然的强烈醋酸","咖啡、烘烤与可可样风味"],"answer":[3],"explain":"高温烘烤麦芽中的风味物质可贡献咖啡、焦香、巧克力等印象。","tag":"烘烤麦芽","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ387","cat":"感官与异味","type":"single","stem":"评审遇到果香浓郁的浑浊 IPA，应如何区分它与显著果汁添加？","options":["只看酒标颜色","依据酒花及酵母风味表现，不凭香气断定添加物","闻到芒果一定加了真实芒果","看到浑浊一定加了水果"],"answer":[1],"explain":"新世界酒花可产生热带水果香，感官无法仅凭果香确认真实水果添加。","tag":"风味来源","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ388","cat":"感官与异味","type":"single","stem":"一杯啤酒乳酸与醋酸同时存在，评审应关注什么？","options":["直接把两种酸视为酒精","酸的类型、强度和平衡是否符合目标风格","只关注泡沫高度","完全不用闻香"],"answer":[1],"explain":"两种酸感官表现不同，酸的平衡对酸啤尤为重要。","tag":"酸度平衡","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ389","cat":"感官与异味","type":"single","stem":"涩感显著的啤酒，最常见的品评描述是什么？","options":["类似熟玉米甜味","舌面或口腔收敛、发干","纯香蕉水果香","舌面有黄油油滑感"],"answer":[1],"explain":"涩感常被描述为口腔收敛与发干，需与酒花苦度区分。","tag":"涩感描述","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ390","cat":"感官与异味","type":"single","stem":"感官上高度酯香是否等于酒被污染？","options":["是；所有啤酒必须没有酯类","是；香蕉香只能来自污染","是；酯香总是表示包装漏氧","不等于；部分比利时和德式小麦风格允许明显酯香"],"answer":[3],"explain":"酯类可为正常酵母代谢产物，适宜性取决于风格。","tag":"酯类适宜性","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ391","cat":"感官与异味","type":"single","stem":"泡沫消散很快就可以判定DMS超标吗？","options":["可以；出现DMS泡沫必定变红","不可以；泡沫保持与DMS不是一一对应的关系","可以；泡沫与DMS完全同义","可以；所有泡沫问题均由DMS导致"],"answer":[1],"explain":"泡沫保持受蛋白质、酒体、杯具清洁及碳酸等影响，不能单凭泡沫诊断DMS。","tag":"外观与风味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ392","cat":"感官与异味","type":"single","stem":"闻香时感到烤面包、面包皮味，优先考虑哪一类来源？","options":["纯粹乳酸","麦芽与烘烤/美拉德反应","二氧化碳本身","光照异味"],"answer":[1],"explain":"面包香往往由麦芽原料与热反应产生，不能直接视作污染。","tag":"麦芽风味","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/troubleshooting/"},{"id":"BJ393","cat":"酿造与原料","type":"single","stem":"糖化温度偏高一般更容易产生什么结果？","options":["IBU立即降至零","麦汁完全不含糖","较多不易发酵糊精，酒体可能偏饱满","酵母必定死光"],"answer":[2],"explain":"较高糖化温度通常偏向α-淀粉酶相关产物，可能提高糊精比例。","tag":"糖化温度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ394","cat":"酿造与原料","type":"single","stem":"糖化温度适当降低，在其他条件相同时通常更有利于什么？","options":["保证生成更多不可发酵糊精","必然生成DMS","必然出现氯酚异味","提高可发酵性，收口更干"],"answer":[3],"explain":"糖化温度会影响糖谱，较低的适宜区间往往提高可发酵糖比例。","tag":"糖化控制","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ395","cat":"酿造与原料","type":"single","stem":"淀粉转化成糖主要发生在哪个酿造环节？","options":["糖化（Mashing）","冷藏运输","开瓶倒酒","装瓶贴标"],"answer":[0],"explain":"糖化阶段由淀粉酶分解麦芽淀粉。","tag":"酶与糖化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ396","cat":"酿造与原料","type":"single","stem":"α-淀粉酶和β-淀粉酶在酿造中主要负责什么？","options":["产生烟熏酚香","去除成品酒精","协同降解麦芽淀粉","直接把酒花变成麦芽"],"answer":[2],"explain":"两种淀粉酶作用位点不同，共同影响可发酵糖和糊精的比例。","tag":"淀粉酶","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ397","cat":"酿造与原料","type":"single","stem":"过滤麦糟或洗糟的主要目的是什么？","options":["从麦糟中分离并回收含糖麦汁","让酒精直接挥发","将酵母转为麦芽","生成全部啤酒碳酸"],"answer":[0],"explain":"过滤/洗糟分离液体麦汁并回收可溶物，过程中过量高pH洗糟可能带出不利多酚。","tag":"过滤洗糟","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ398","cat":"酿造与原料","type":"single","stem":"长时间过度洗糟且麦汁pH偏高，增加什么风险？","options":["自动消除所有氧化","保证果香上升","抽提出较多单宁而带来涩感","使颜色恒定为透明"],"answer":[2],"explain":"高pH和过度洗糟可能增加单宁及其他不良物质的提取。","tag":"单宁","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ399","cat":"酿造与原料","type":"single","stem":"麦汁煮沸阶段加入苦味酒花的主要作用之一是什么？","options":["使α酸异构化并增加苦度","让麦汁立即变澄清酒","直接产乙醇","使乳糖变成乳酸"],"answer":[0],"explain":"酒花α酸在煮沸时异构化，形成重要的苦味成分。","tag":"酒花苦度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ400","cat":"酿造与原料","type":"single","stem":"较靠近煮沸结束或旋沉阶段加入酒花，通常更强调什么？","options":["完全消除苦味","保留较多挥发性酒花香气","提高麦芽的淀粉含量","去除所有芳香物质"],"answer":[1],"explain":"晚期酒花添加倾向于保留香气，仍可能贡献一定苦味。","tag":"晚期酒花","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ401","cat":"酿造与原料","type":"single","stem":"干投酒花的主要目标通常是什么？","options":["增强酒花香气而非依赖传统煮沸异构苦度","立刻消除DMS","把麦芽糖完全转为乳酸","让酒精度翻倍"],"answer":[0],"explain":"干投重视芳香物质提取，但也可能影响感知苦度及其他酒体特征。","tag":"干投","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ402","cat":"酿造与原料","type":"single","stem":"酒花中的α酸经煮沸异构化后，主要影响什么感官指标？","options":["苦味","红色色泽","酒精温暖感","香蕉酯香"],"answer":[0],"explain":"异构α酸是常见的啤酒苦味来源。","tag":"α酸","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ403","cat":"酿造与原料","type":"single","stem":"为什么剧烈煮沸麦汁有助于减少部分DMS？","options":["彻底杀死麦芽淀粉酶后再糖化","直接消除乙醇","挥发和带走二甲基硫","制造更多乳糖"],"answer":[2],"explain":"开盖煮沸会帮助带走易挥发DMS，煮后缓慢冷却也可能增加其积累。","tag":"DMS控制","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ404","cat":"酿造与原料","type":"single","stem":"使用浅色皮尔森麦芽时，为什么要特别注意DMS？","options":["皮尔森麦芽本身全是酒花","部分皮尔森麦芽含有较多DMS前体SMM","所有皮尔森麦芽不含淀粉","麦芽颜色越浅必然含乙酸菌"],"answer":[1],"explain":"SMM在受热时可分解产生DMS，煮沸管理很重要。","tag":"麦芽与DMS","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ405","cat":"酿造与原料","type":"single","stem":"增加焦糖/水晶麦芽比例，通常更可能影响什么？","options":["产生典型丁香酚","直接生成光照臭鼬味","必定使酒精度为零","增加焦糖、太妃糖样麦芽风味"],"answer":[3],"explain":"水晶麦芽是许多焦糖、甜香与色泽来源之一。","tag":"特殊麦芽","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ406","cat":"酿造与原料","type":"single","stem":"较多深色烘烤麦芽一般会带来哪种变化？","options":["颜色更深并可能带来烘烤风味","保证成品完全透明无色","必然生成香蕉酯","完全消除苦度"],"answer":[0],"explain":"烘烤麦芽影响颜色与风味，使用量需要匹配目标风格。","tag":"深色麦芽","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ407","cat":"酿造与原料","type":"single","stem":"小麦芽在啤酒配方中通常能帮助增加什么？","options":["乙酸菌数量","自动形成橡木香","蛋白贡献与泡沫保持","酒花α酸含量"],"answer":[2],"explain":"小麦蛋白等可以有助于泡沫保持和口感表现。","tag":"小麦原料","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ408","cat":"酿造与原料","type":"single","stem":"燕麦用于浑浊IPA配方时常被期望贡献什么？","options":["柔滑、饱满的口感","直接生成臭鼬味","自动达到100 IBU","让成品不含蛋白"],"answer":[0],"explain":"燕麦可影响口感与雾浊稳定，但不意味着任何配方都会形成相同结果。","tag":"燕麦","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ409","cat":"酿造与原料","type":"single","stem":"玉米和米作为部分拉格辅料时，主要可能帮助什么？","options":["减轻麦芽风味和酒体","必然生成深色泡沫","必然形成丁香味","让麦汁无法发酵"],"answer":[0],"explain":"部分谷物辅料可稀释麦芽蛋白及风味强度，适用于部分拉格配方。","tag":"谷物辅料","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ410","cat":"酿造与原料","type":"single","stem":"使用较多可完全发酵的简单糖，在其他条件相近时通常有何效果？","options":["必然降低终点发酵度","保证形成更多糊精","保证出现大量DMS","提高酒精潜力而不同比例增加酒体"],"answer":[3],"explain":"简单糖较易被酵母利用，可使某些高酒精风格保持较干的收口。","tag":"简单糖","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ411","cat":"酿造与原料","type":"single","stem":"酿造水中硫酸盐较高时，常可能强化哪种感官印象？","options":["香蕉酯香的形成","酒精度必然降低","干爽和酒花苦味的突出程度","乳酸菌必定停止生长"],"answer":[2],"explain":"硫酸盐与氯离子平衡可改变感知上的苦味及饱满度。","tag":"水质矿物","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ412","cat":"酿造与原料","type":"single","stem":"氯离子相对较高的酿造水，通常会强调哪类口感表现？","options":["苦味单位精确归零","形成光照臭鼬味","麦芽圆润感与酒体饱满感","必定出现金属味"],"answer":[2],"explain":"氯离子在适当范围可能提升柔和饱满的印象，需结合整体水质。","tag":"水质氯离子","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ413","cat":"酿造与原料","type":"single","stem":"糖化pH过高可能增加哪类问题的风险？","options":["只提升香草桶味","只造成香蕉香","单宁涩感与糖化效率问题","保证所有酒款澄清"],"answer":[2],"explain":"合适的糖化pH与酶活性、风味和后续工艺有关。","tag":"糖化pH","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ414","cat":"酿造与原料","type":"single","stem":"麦汁入发酵罐前适量充氧主要为了什么？","options":["支持酵母增殖与细胞膜合成","产生更多纸板老化味","让完成发酵的酒长期接触氧","直接把水变成酒精"],"answer":[0],"explain":"酵母在发酵前期需氧合成甾醇和不饱和脂肪酸；成酒后应尽量控氧。","tag":"酵母充氧","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ415","cat":"酿造与原料","type":"single","stem":"啤酒主发酵结束后频繁接触氧气通常带来什么风险？","options":["成品氧化与香气衰减","让二氧化碳立即消失","必然增加ABV","直接增强酒花新鲜度"],"answer":[0],"explain":"后段工艺控氧尤其对酒花丰富的啤酒很重要。","tag":"氧管理","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ416","cat":"酿造与原料","type":"single","stem":"拉格发酵结束前安排双乙酰休止，主要为了什么？","options":["帮助酵母还原双乙酰及其前体","增加光照臭鼬味","把乳糖转为酒花","让DMS立即生成"],"answer":[0],"explain":"双乙酰休止通常适度提高温度，帮助酵母清理发酵相关物质。","tag":"双乙酰休止","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ417","cat":"酿造与原料","type":"single","stem":"酵母投放量严重不足，可能增加什么风险？","options":["自动改善所有啤酒风格","保证发酵时间为零","酵母应激与异常发酵风味","必定提高泡沫稳定性"],"answer":[2],"explain":"不足投放可能提高酵母压力，改变酯类、高级醇等表现。","tag":"投酵量","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ418","cat":"酿造与原料","type":"single","stem":"传统拉格通常相对于多数艾尔采用哪种温度策略？","options":["必须全程沸腾发酵","较低温主发酵并在低温条件下熟成","只能在冰点以下发酵","完全不需要酵母"],"answer":[1],"explain":"底发酵酵母常适应较低温区，后续低温贮藏有助于风味成熟。","tag":"拉格发酵","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ419","cat":"酿造与原料","type":"single","stem":"表观发酵度（Attenuation）通常反映什么？","options":["包装瓶的重量","水中镁离子数量","麦汁可发酵物被转化的程度","酒花颜色深浅"],"answer":[2],"explain":"发酵度描述酵母对麦汁可发酵物的消耗程度，与最终密度相关。","tag":"发酵度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ420","cat":"酿造与原料","type":"single","stem":"酵母絮凝性（Flocculation）主要与什么有关？","options":["麦芽烘烤温度","啤酒瓶颜色","酒花α酸含量","酵母细胞聚集并沉降的倾向"],"answer":[3],"explain":"絮凝影响酵母沉降、澄清和发酵控制。","tag":"絮凝性","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ421","cat":"酿造与原料","type":"single","stem":"酵母需要氮源和微量元素，主要是为了什么？","options":["直接提高啤酒IBU","支持健康增殖和发酵代谢","制造麦芽烟熏味","保证木桶绝不渗漏"],"answer":[1],"explain":"游离氨基氮（FAN）和微量营养素不足可能影响发酵健康。","tag":"酵母营养","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ422","cat":"酿造与原料","type":"single","stem":"酿造设备的卫生清洁与消毒为什么重要？","options":["彻底取消煮沸步骤","确保所有风格必须浑浊","降低非目标微生物污染风险","让所有酒苦度相同"],"answer":[2],"explain":"污染菌可产生酸、酚类或其他偏离风格的风味。","tag":"卫生消毒","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ423","cat":"酿造与原料","type":"single","stem":"冷崩（Cold Crash）通常用于什么？","options":["直接生成乙醇","把酵母转化为酒花","增加麦芽糖化温度","促进酵母和悬浮颗粒沉降"],"answer":[3],"explain":"降温有助于颗粒沉降，可能改善澄清，但并不杀灭所有微生物。","tag":"冷崩","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ424","cat":"酿造与原料","type":"single","stem":"过滤或离心成酒最直接的效果之一是什么？","options":["直接保证氧含量为零","降低部分悬浮颗粒和酵母","制造丁香香","使ABV自动升高"],"answer":[1],"explain":"过滤和离心可提高澄清度，但需控制氧摄入和香气损失。","tag":"澄清工艺","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ425","cat":"酿造与原料","type":"single","stem":"乳酸菌在某些酸啤酿造中最直接贡献什么？","options":["形成酒花异构α酸","赋予明显烤面包香","生成香草醛木桶味","生成乳酸并使pH下降"],"answer":[3],"explain":"乳酸菌通常发酵糖类生成乳酸，工艺方式与风格有关。","tag":"乳酸菌","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ426","cat":"酿造与原料","type":"single","stem":"布雷特酵母与普通酿酒酵母相比，特色之一是什么？","options":["必定完全不产生气体","无法进行任何发酵","只能生产乳糖","可产生野趣酚香并进一步改变残糖"],"answer":[3],"explain":"Brettanomyces 的发酵副产物和糖利用谱不同，适用于部分野生风格。","tag":"Brett发酵","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ427","cat":"酿造与原料","type":"single","stem":"自然发酵兰比克（Lambic）的传统方式有什么特点？","options":["只在20分钟内完成全部酿造","必须添加咖啡豆","借助环境微生物与混合菌群长期发酵","完全不使用任何麦芽"],"answer":[2],"explain":"传统兰比克依赖多种微生物参与，风味与时间密切相关。","tag":"兰比克","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ428","cat":"酿造与原料","type":"single","stem":"传统贵兹（Gueuze）的制作特色是什么？","options":["混合不同陈酿年份的兰比克","只使用新酒花精油","将世涛加入果汁直接灌装","完全不进行二次发酵"],"answer":[0],"explain":"传统贵兹通过混合不同年份的兰比克形成复杂度及瓶中发酵潜力。","tag":"贵兹混酿","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ429","cat":"酿造与原料","type":"single","stem":"在啤酒中加入装瓶糖进行瓶内二次发酵，主要目的是什么？","options":["把二氧化碳转成乙醇","直接增加酒花IBU","由残存活酵母自然产生CO₂","消除所有感官缺陷"],"answer":[2],"explain":"装瓶糖可供酵母继续发酵产生碳酸，必须控制剂量与卫生。","tag":"瓶中碳酸化","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ430","cat":"酿造与原料","type":"single","stem":"大多数啤酒瓶罐包装时减少溶解氧，主要是为了什么？","options":["立即消除酒精感","保护风味稳定性与保鲜","让颜色永远不变","自动提高麦芽糖度"],"answer":[1],"explain":"包装控氧可以延缓氧化与酒花香衰减。","tag":"包装保鲜","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ431","cat":"酿造与原料","type":"single","stem":"发酵温度升高可能使某些艾尔酵母出现什么变化？","options":["二氧化碳完全无法溶解","IBU范围自动改变","酒杯颜色变红","酯类和高级醇产生程度改变"],"answer":[3],"explain":"酵母株、温度和投放量都会影响发酵副产物。","tag":"酵母温度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ432","cat":"酿造与原料","type":"single","stem":"发酵温度远超酵母推荐区间时，可能发生什么？","options":["始终得到最佳结果","直接生成酒花香叶醇","保证永远不出现DMS","出现酵母压力并产生不理想发酵副产物"],"answer":[3],"explain":"超出合理发酵温度容易影响酵母代谢与风味稳定。","tag":"发酵应激","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ433","cat":"酿造与原料","type":"single","stem":"啤酒出酒时使用洁净、无油的杯具主要有何意义？","options":["保证啤酒酒精度升高","直接提高麦芽投料量","避免油脂破坏泡沫并干扰香气","把IPA变成拉格"],"answer":[2],"explain":"杯具清洁对于泡沫外观与感官评测很重要。","tag":"杯具卫生","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ434","cat":"酿造与原料","type":"single","stem":"酿造中旋沉（Whirlpool）主要有助于什么？","options":["把澄清啤酒变混浊IPA","直接得到发酵后的酒精","消除所有的蛋白质","让部分热凝固物与酒花残渣集中分离"],"answer":[3],"explain":"旋沉用于分离热凝物与酒花颗粒，也常作晚期酒花投加环节。","tag":"旋沉","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ435","cat":"酿造与原料","type":"single","stem":"原麦汁浓度（OG）与终点密度（FG）为什么重要？","options":["可直接决定麦芽品种颜色","用于估计发酵程度及酒精生成","与啤酒任何参数都无关","只用于计算啤酒泡沫颜色"],"answer":[1],"explain":"OG和FG之差与发酵糖消耗、酒精生成及残余物质有关。","tag":"原麦汁与终点密度","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ436","cat":"酿造与原料","type":"single","stem":"国际苦味单位 IBU 能否准确等价于实际感知苦味？","options":["可以，在所有啤酒中完全相同","不能，风格平衡和残糖等会影响苦味感受","可以，IBU就是ABV的别名","不能，因为IBU只表示啤酒颜色"],"answer":[1],"explain":"IBU衡量与苦味相关的化学组分，感知苦度还受甜度、酒体与水质影响。","tag":"IBU含义","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ437","cat":"酿造与原料","type":"single","stem":"啤酒混浊度的提高只可能由感染造成吗？","options":["一定；只有木桶会造成浑浊","不一定；蛋白质、酒花多酚与酵母也可能造成浑浊","一定；浑浊完全等同感染","一定；只有DMS会造成浑浊"],"answer":[1],"explain":"不同来源的悬浮物和胶体可导致不同浑浊表现，风格判断要结合目标。","tag":"浑浊机制","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ438","cat":"酿造与原料","type":"single","stem":"麦芽的烘焙/干燥处理通常直接影响什么？","options":["酶活性、麦芽色泽和风味","瓶子的抗压强度","酒花的种植纬度","啤酒瓶贴纸尺寸"],"answer":[0],"explain":"麦芽制备和烘焙程度影响其发酵潜力与麦芽风味。","tag":"制麦与烘焙","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ439","cat":"酿造与原料","type":"single","stem":"皮尔森型浅色麦芽相较高度烘烤麦芽通常保有更多什么？","options":["适用于糖化的酶活性","浓烈巧克力烘烤风味","天然果汁","酒花α酸"],"answer":[0],"explain":"浅色基麦芽通常有较好糖化酶力，而高度烘烤麦芽酶活性多已损失。","tag":"基麦芽","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ440","cat":"酿造与原料","type":"single","stem":"杀菌/巴氏处理是否意味着啤酒无需防氧化？","options":["意味着，氧化绝不发生","意味着，酒花永远不会老化","不意味着；氧化与微生物稳定是不同问题","意味着，所有啤酒都能常温永久储存"],"answer":[2],"explain":"巴氏处理主要改善微生物稳定性，不能消除氧化老化风险。","tag":"巴氏处理","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ441","cat":"酿造与原料","type":"single","stem":"啤酒发酵中 CO₂ 的主要来源是什么？","options":["酵母糖发酵过程产生","木桶木质纤维自动释气","酒花α酸直接产生","麦芽蛋白在瓶中直接变气体"],"answer":[0],"explain":"酒精发酵将糖转化为乙醇与二氧化碳。","tag":"二氧化碳","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ442","cat":"酿造与原料","type":"single","stem":"高原麦汁（High Gravity）酿造为什么需要特别注意酵母健康？","options":["因为原麦汁越高必然无酒精","因为酵母完全不再生长","因为高原麦汁不含糖","较高渗透压与酒精压力会增加发酵负担"],"answer":[3],"explain":"高原麦汁会使酵母面临渗透压和后期酒精压力，良好营养与投酵管理更重要。","tag":"高原麦汁","source":"https://www.bjcp.org/exam-certification/program/studying/beer-exam-study-guide/yeast-and-fermentation/"},{"id":"BJ443","cat":"BJCP规则","type":"single","stem":"通过BJCP啤酒网考后，下一步通常需要通过什么才能获得正式评审等级？","options":["参加任意啤酒节即自动取得等级","再做一次同样的免费练习","进一步通过啤酒品鉴评审考试","购买啤酒杯"],"answer":[2],"explain":"入口网考是品鉴考试的资格环节，通过网考本身不会获得BJCP认证等级。","tag":"认证流程","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ444","cat":"BJCP规则","type":"single","stem":"BJCP啤酒入口网考的标准题量是多少？","options":["100题","50题","60题","180题"],"answer":[3],"explain":"当前BJCP官方说明，啤酒入口网考180题，限时60分钟。","tag":"网考规则","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ445","cat":"BJCP规则","type":"single","stem":"BJCP啤酒入口网考的正式限时是多少？","options":["90分钟","30分钟","120分钟","60分钟"],"answer":[3],"explain":"官方要求180题在60分钟内作答，平均每题约20秒。","tag":"时间管理","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ446","cat":"BJCP规则","type":"single","stem":"BJCP网考当前支持的语言中，哪一种对中文考生可直接选择？","options":["只支持日文","简体中文","只支持繁体中文","只支持德文"],"answer":[1],"explain":"BJCP官方说明在线入口考试支持简体中文，也支持英语和其他几种语言。","tag":"考试语言","source":"https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/"},{"id":"BJ447","cat":"BJCP规则","type":"single","stem":"BJCP在线入口考试是否提供免费模拟练习？","options":["提供官方免费练习入口" const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const names=arr=>arr.map(i=>'ABCDE'[i]).join('、');
function getQ(id){return QUESTIONS.find(x=>x.id===id)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function switchView(view){stopClock();state.view=view;state.run=null;state.report=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();window.scrollTo(0,0)}
function download(name,data,mime='application/json'){let blob=new Blob([data],{type:mime});let a=document.createElement('a');let u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportQuestions(){download('BJCP_简体中文500题_V1.0.json',JSON.stringify(QUESTIONS,null,2))}
function exportReport(){let doc={exportedAt:new Date().toISOString(),result:state.report,wrongQuestions:saved.wrong.map(getQ).filter(Boolean),history:saved.history};download('BJCP_练习记录.json',JSON.stringify(doc,null,2))}
function home(){let avg=saved.history.length?Math.round(saved.history.reduce((a,x)=>a+x.percent,0)/saved.history.length):0;let n=saved.history.length;return `<div class="toprow"><span class="eyebrow">路人甲的 BJCP 备考手册</span><span class="topmeta">LU REN JIA EDITION · 非官方模拟</span></div><div class="intro"><div class="intro-card"><span class="persona-label">路人甲版本 · PERSONAL EDITION</span><h1>把啤酒喝明白，<br>也把 BJCP 考明白。</h1><p>这里是<strong>路人甲的 BJCP 备考自留地</strong>。500 道简体中文模拟题，把<span style="color:#fff;font-weight:800">风格 · 异味 · 酿造 · 规则</span>拆开练、反复练。风格附英文对照，错题自动归档，适合日常积累，也适合考前冲刺。</p><p class="persona-note"><b>路人甲的备考便签：</b>喝过的酒，记住风味；做错的题，记住原因。</p></div><div class="statcard"><div class="minititle">你目前的练习记录</div><div class="heroNum">${avg}% <small>平均正确率</small></div><div><div class="bar"><div style="width:${avg}%"></div></div><div class="minor">${n} 次完成 · ${saved.wrong.length} 道待重练错题<br>数据仅存于当前浏览器</div></div></div></div><div class="sectionhead"><h2>快速开始</h2><span>判断题 / 单选题 / 多选题</span></div><div class="configs"><div class="panel"><h3>01 / 知识点范围</h3><p>针对薄弱环节集中练习；默认随机抽题。</p><select class="select" id="catSelect">${CATEGORY.map(x=>`<option value="${esc(x)}" ${x===state.cat?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="panel"><h3>02 / 练习题量</h3><p>可选择10—500题；正式模拟建议180题。</p><div class="pillrow">${[10,20,50,100,180,500].map(n=>`<button class="pill ${state.count===n?'active':''}" data-count="${n}">${n}题</button>`).join('')}</div></div><div class="panel"><h3>03 / 练习方式</h3><p>逐题解析适合学习，限时模拟适合冲刺。</p><div class="pillrow"><button class="pill active" onclick="begin('practice')">边做边看解析</button><button class="pill" onclick="begin('mock')">限时模拟</button></div></div></div><div class="startrow"><div><strong>建议：先50题专项，再180题模拟</strong><div><span>实时答案解析 · 自动记录错题 · 结束后按专题诊断</span></div></div><div class="buttonset"><button class="btn dark" onclick="exportQuestions()">↓ 导出题库 JSON</button><button class="btn" onclick="begin('practice')">开始练习 →</button></div></div><p class="note"><strong>考试参考：</strong>正式BJCP啤酒网考为180题、60分钟、正确116题及格。本练习系统限时模拟按每题20秒设置倒计时，按同等正确率计算练习通过参考线；不代表BJCP官方评分或题目难度。<br>依据：<a href="https://www.bjcp.org/exam-certification/program/studying/online-beer-exam-study-guide/" target="_blank" rel="noopener">官方网考学习指南</a> · <a href="https://www.bjcp.org/bjcp-style-guidelines/" target="_blank" rel="noopener">2021风格指南</a> · <a href="https://www.bjcp.org/education-training/education-resources/beer-faults/" target="_blank" rel="noopener">异味资料</a></p>`}
function modeHome(){return `<div class="toprow"><span class="eyebrow">路人甲备考手册 / 限时模拟</span><span class="topmeta">180题 = 60分钟</span></div><h1>限时模拟</h1><p class="lead">180题限时60分钟：与正式网考相同的答题节奏。限时模拟交卷后才显示正确答案和解析。</p><div class="panel" style="max-width:720px;margin-top:28px"><h3>模拟考试设置</h3><label class="minor" for="mockCat">练习分类</label><select class="select" id="mockCat">${CATEGORY.map(x=>`<option ${x===state.cat?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="pillrow">${[10,20,50,100,180,500].map(n=>`<button class="pill ${state.count===n?'active':''}" data-count="${n}">${n}题 / ${Math.floor(n*20/60)}:${String(n*20%60).padStart(2,'0')}</button>`).join('')}</div><div class="checknote">说明：抽题范围不够时自动使用该分类下的全部题目。</div><button class="btn" style="margin-top:23px" onclick="begin('mock')">开始限时模拟 →</button></div>`}
function begin(mode,fromWrong=false){stopClock();let catBox=$('#catSelect')||$('#mockCat');if(catBox)state.cat=catBox.value;let list=fromWrong?saved.wrong.map(getQ).filter(Boolean):QUESTIONS.filter(q=>state.cat==='全部分类'||q.cat===state.cat);if(!list.length){alert('当前没有可练习题目。');return;}let qs=shuffle(list).slice(0,fromWrong?list.length:state.count);state.run={mode,qs,index:0,answers:{},checked:{},deadline:mode==='mock'?Date.now()+qs.length*20000:null,fromWrong,done:false};state.report=null;state.view='session';render();if(mode==='mock'){state.tick=setInterval(()=>{if(!state.run||state.run.mode!=='mock'){stopClock();return}if(Date.now()>=state.run.deadline){finish(true)}else{let t=$('#timer');if(t){let left=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(left);t.classList.toggle('warn',left<60)}}},300)}window.scrollTo(0,0)}
function stopClock(){if(state.tick){clearInterval(state.tick);state.tick=null}}
const clock=sec=>`${String(Math.floor(Math.max(0,sec)/60)).padStart(2,'0')}:${String(Math.max(0,sec)%60).padStart(2,'0')}`;
function getSelected(q){return (state.run.answers[q.id]||[])}
function same(a,b){return [...a].sort().join(',')===[...b].sort().join(',')}
function choose(i){let r=state.run;if(!r||r.done)return;let q=r.qs[r.index];if(r.mode==='practice'&&r.checked[q.id])return;let a=getSelected(q);r.answers[q.id]=q.type==='multi'?(a.includes(i)?a.filter(x=>x!==i):[...a,i]):[i];renderSessionQuestion()}
function check(){let r=state.run;if(!r)return;let q=r.qs[r.index];if(!getSelected(q).length)return;r.checked[q.id]=true;renderSessionQuestion()}
function move(step){let r=state.run;if(!r)return;if(r.index+step>=r.qs.length){finish(false);return}r.index=Math.max(0,r.index+step);render();window.scrollTo({top:0,behavior:'smooth'})}
function finish(auto){stopClock();let r=state.run;if(!r||r.done)return;r.done=true;let judged=r.qs.map(q=>{let selected=r.answers[q.id]||[];return {id:q.id,selected,correct:same(selected,q.answer),attempted:selected.length>0,cat:q.cat}});let hit=judged.filter(x=>x.correct).length;let wrong=judged.filter(x=>!x.correct).map(x=>x.id);const bad=new Set([...saved.wrong,...wrong]);judged.filter(x=>x.correct).forEach(x=>bad.delete(x.id));saved.wrong=[...bad];const rep={date:new Date().toLocaleString('zh-CN'),mode:r.mode,fromWrong:r.fromWrong,total:r.qs.length,correct:hit,attempted:judged.filter(x=>x.attempted).length,percent:Math.round(hit/r.qs.length*100),timeout:!!auto,judged};saved.history.unshift({date:rep.date,total:rep.total,correct:rep.correct,percent:rep.percent,mode:rep.mode});saved.history=saved.history.slice(0,60);persist();state.report=rep;state.view='results';render();window.scrollTo(0,0)}
function session(){let r=state.run,q=r.qs[r.index],num=r.index+1,answered=r.qs.filter(q=>(r.answers[q.id]||[]).length>0).length,left=r.mode==='mock'?Math.ceil((r.deadline-Date.now())/1000):null;return `<div class="examtop"><div><div class="eyebrow">${r.mode==='mock'?'限时模拟':'专项练习'} / ${r.fromWrong?'错题重练':'原创模拟题库'}</div><h2>第 ${num} 题 <span style="color:var(--sub);font-size:15px;font-weight:500">/ ${r.qs.length}</span></h2></div><div class="examnums">已作答 ${answered}/${r.qs.length}${left!==null?`<div class="timer ${left<60?'warn':''}" id="timer">${clock(left)}</div>`:''}</div></div><div class="progress"><span style="width:${num/r.qs.length*100}%"></span></div><div id="qarea"></div><p class="note">${r.mode==='practice'?'答题后点击“核对答案”查看解析。':'模拟过程中不显示答案；未作答题目会计为错误。'} &nbsp; · &nbsp; <a href="${E}" target="_blank">官方考试说明</a></p>`}
function renderSessionQuestion(){let area=$('#qarea');let r=state.run;if(!r||!area)return;let q=r.qs[r.index],a=getSelected(q),shown=!!r.checked[q.id],good=same(a,q.answer);let opts=q.options.map((opt,i)=>{let sel=a.includes(i),correct=q.answer.includes(i),className=shown&&correct?'correct':shown&&sel&&!correct?'incorrect':sel?'selected':'';return `<button type="button" class="option ${className}" ${shown?'disabled':''} onclick="choose(${i})"><span class="k">${q.type==='multi'?(sel?'✓':'□'):'ABCDE'[i]}</span><span>${esc(opt)}</span></button>`}).join('');area.innerHTML=`<section class="questioncard"><div class="qhead"><span class="chip b">${esc(q.cat)}</span><span class="chip">${esc(KIND[q.type])}</span><span class="chip">${esc(q.tag)}</span></div><div class="qstem">${esc(q.stem)}</div><p class="qhint">${q.type==='multi'?'本题为多选：可选多个答案，必须全部选对才计分。':q.type==='tf'?'请选择“正确”或“错误”。':'单选题：请选择一个最佳答案。'}</p><div class="options">${opts}</div>${shown?`<div class="answerbox"><strong style="color:${good?'var(--green)':'var(--red)'}">${good?'✓ 回答正确':'× 回答错误'} · 标准答案：${names(q.answer)}</strong><p>${esc(q.explain)}</p><small>知识点：${esc(q.tag)}　 <a href="${q.source}" target="_blank" rel="noopener noreferrer">查阅BJCP官方依据 ↗</a></small></div>`:''}<div class="qactions"><button class="btn ghost" onclick="${r.index===0?"quit()":"move(-1)"}">${r.index===0?'退出练习':'← 上一题'}</button><div class="buttonset">${r.mode==='practice'&&!shown?`<button class="btn dark" ${a.length?'':'disabled'} onclick="check()">核对答案</button>`:''}${r.mode==='practice'&&!shown?`<button class="btn ghost" onclick="move(1)">跳过 →</button>`:`<button class="btn" onclick="move(1)">${r.index===r.qs.length-1?'交卷 / 查看成绩':'下一题 →'}</button>`}${r.mode==='mock'?`<button class="btn ghost" onclick="finish(false)">提前交卷</button>`:''}</div></div></section>`}
function quit(){if(!confirm('结束当前练习并返回首页？本次未交卷，不计入成绩。'))return;switchView('home')}
function results(){let r=state.report;let passed=r.total===180 ? r.correct>=116 : r.correct/r.total>=116/180;let breakdown=CATEGORY.slice(1).map(c=>{let z=r.judged.filter(x=>x.cat===c);return z.length?`<div class="metric"><strong>${z.filter(x=>x.correct).length}<span style="font-size:17px;color:var(--sub)">/${z.length}</span></strong><span>${c}</span></div>`:''}).join('');let mistakes=r.judged.filter(x=>!x.correct);return `<div class="toprow"><span class="eyebrow">路人甲的练习记录 / 本轮成绩</span><span class="topmeta">${esc(r.date)}</span></div><h1>本轮完成</h1><div class="resultBanner"><div><div class="eyebrow" style="color:var(--lime)">${passed?'达到参考通过线':'建议继续练习'}</div><h2>${r.correct} / ${r.total} 题正确</h2><p>${r.timeout?'本轮因倒计时结束而自动交卷。':'已完成本轮练习。'} 正式考试的参考通过线为116/180；这里仅对照正确率，不代表真实考试结论。</p></div><div class="score">${r.percent}%</div></div><div class="grid2">${breakdown}</div><div class="sectionhead"><h2>错题与漏答（${mistakes.length}）</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出练习记录</button><button class="btn tiny" onclick="repeatWrong()" ${!saved.wrong.length?'disabled':''}>重练全部错题 →</button></div></div>${mistakes.length?mistakes.map((x,i)=>{let q=getQ(x.id);return `<div class="reviewitem"><div class="label">${esc(q.cat)} · ${esc(q.id)} · ${x.attempted?'答错':'未答'}</div><h3>${i+1}. ${esc(q.stem)}</h3><div class="meta">你的选择：${x.selected.length?names(x.selected):'未作答'}　正确答案：${names(q.answer)}</div><p>${esc(q.explain)} <a href="${q.source}" target="_blank" rel="noopener">官方资料 ↗</a></p></div>`}).join(''):'<div class="empty"><strong>本轮全对</strong>这一轮没有错题。</div>'}<div class="buttonset" style="margin-top:22px"><button class="btn dark" onclick="switchView('home')">返回首页</button><button class="btn ghost" onclick="begin('${r.mode}')">再做一轮 →</button></div>`}
function repeatWrong(){state.cat='全部分类';begin('practice',true)}
function wrong(){let qs=saved.wrong.map(getQ).filter(Boolean);return `<div class="toprow"><span class="eyebrow">路人甲的错题便签 / 专项巩固</span><span class="topmeta">本机持久保存</span></div><h1>错题重练</h1><p class="lead">完成整轮练习后，答错或未答题目会加入错题本；重练答对的题会自动移出。</p><div class="sectionhead"><h2>${qs.length} 道待巩固</h2><div class="buttonset"><button class="btn tiny ghost" onclick="exportReport()">导出记录</button><button class="btn tiny" ${qs.length?'':'disabled'} onclick="repeatWrong()">开始错题重练 →</button></div></div>${qs.length?qs.map(x=>`<div class="reviewitem"><div class="label">${esc(x.cat)} · ${esc(KIND[x.type])} · ${esc(x.tag)}</div><h3>${esc(x.stem)}</h3><p>练习答对后可从错题本移除。 <a href="${x.source}" target="_blank" rel="noopener">查看相关官方知识点 ↗</a></p></div>`).join(''):'<div class="empty"><strong>还没有错题</strong>完成一轮模拟或专项练习后，这里会记录需要复习的内容。<div style="margin-top:18px"><button class="btn" onclick="switchView(&#39;home&#39;)">去做题 →</button></div></div>'}<div class="note">如果需要清空所有练习记录，可点击：<button class="btn tiny ghost" onclick="resetAll()">清空本机记录</button>。此操作无法撤销。</div>`}
function resetAll(){if(!confirm('确认清除错题及所有历史成绩？不可撤销。'))return;saved={wrong:[],history:[],saved:[]};persist();render()}
function index(){let groups=CATEGORY.slice(1).map(c=>({cat:c,tags:[...new Set(QUESTIONS.filter(q=>q.cat===c).map(q=>q.tag))],n:QUESTIONS.filter(q=>q.cat===c).length}));return `<div class="toprow"><span class="eyebrow">路人甲备考笔记 / 知识点索引</span><span class="topmeta">2021 年版《啤酒风格指南》</span></div><h1>知识点索引</h1><p class="lead">按主题检索常考概念，点击开始针对性练习。每一道题均附有 BJCP 官方参考资料链接；题干与解析采用简体中文，风格名称保留英文对照。</p><div class="indexgrid" style="margin-top:24px">${groups.map(g=>`<div class="panel"><h3>${esc(g.cat)} <span style="color:var(--sub);font-size:12px;font-weight:500">· ${g.n}题</span></h3><p>${g.tags.map(esc).join(' · ')}</p><button class="btn tiny ghost" style="margin-top:18px" onclick="focusCategory('${g.cat}')">练这一类 →</button></div>`).join('')}</div><div class="sectionhead"><h2>官方资料入口</h2></div><div class="panel"><p style="font-size:14px"><a href="${G}" target="_blank" rel="noopener">BJCP 2021 啤酒风格指南 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${E}" target="_blank" rel="noopener">BJCP 网考学习指南与题型范围 ↗</a></p><p style="font-size:14px;margin-top:12px"><a href="${F}" target="_blank" rel="noopener">BJCP Beer Faults 异味排查 ↗</a></p></div><div class="startrow"><div><strong>可导出本500题完整题库 JSON</strong><div><span>包含题干、选项、答案、解析、知识点与来源链接。</span></div></div><button class="btn dark" onclick="exportQuestions()">下载 JSON ↘</button></div>`}
function focusCategory(cat){state.cat=cat;switchView('home')}
function render(){let content=state.view==='home'?home():state.view==='exam'?modeHome():state.view==='session'?session():state.view==='results'?results():state.view==='wrong'?wrong():index();$('#app').innerHTML=content+'<footer class="footer"><strong>路人甲的 BJCP 备考手册</strong> · 个人整理与练习版本，非 BJCP 官方产品。500题均为原创模拟题，不代表真实考试题库。<br>资料链接用于备考核对；考试前请以 BJCP 官方指南与更正为准。<span style="float:right">路人甲版 V1.1 · 2026-10-12</span></footer>';if(state.view==='session')renderSessionQuestion();document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{state.count=Number(b.dataset.count);render()}));let e=$('#catSelect')||$('#mockCat');if(e)e.addEventListener('change',()=>{state.cat=e.value});}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));

// V1.0: 可恢复的答题进度。所有记录只写入本机 localStorage，不上传服务器。
const PROGRESS_KEY='bjcp-cn-web-progress-v10';
function stash(){
  let r=state.run;
  if(!r||r.done)return;
  try { localStorage.setItem(PROGRESS_KEY,JSON.stringify({mode:r.mode,qs:r.qs.map(q=>q.id),index:r.index,answers:r.answers,checked:r.checked,deadline:r.deadline,fromWrong:r.fromWrong,updatedAt:Date.now()})); } catch(e){}
}
function loadStash(){
  try {
    let o=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');
    if(!o||!Array.isArray(o.qs)||!o.qs.length)return null;
    let q=o.qs.map(getQ);
    if(q.some(x=>!x))return null;
    return {mode:o.mode,qs:q,index:Math.max(0,Math.min(o.index||0,q.length-1)),answers:o.answers||{},checked:o.checked||{},deadline:o.deadline||null,fromWrong:!!o.fromWrong,done:false};
  } catch(e){return null}
}
function forgetStash(){try{localStorage.removeItem(PROGRESS_KEY)}catch(e){}}
function relaunchTimer(){
  stopClock();
  if(!state.run||state.run.mode!=='mock')return;
  if(Date.now() >= state.run.deadline){ finish(true);return; }
  state.tick=setInterval(()=>{
    if(!state.run||state.run.mode!=='mock'){stopClock();return}
    if(Date.now()>=state.run.deadline){finish(true);return}
    let t=$('#timer'); if(t){let l=Math.ceil((state.run.deadline-Date.now())/1000);t.textContent=clock(l);t.classList.toggle('warn',l<60)}
  },300);
}
function resumeSession(){
  let r=loadStash();
  if(!r){alert('没有可以恢复的练习进度。');render();return}
  state.run=r; state.report=null;state.view='session';
  render();relaunchTimer();window.scrollTo(0,0);
}
const _home=home;
home=function(){
  let html=_home();
  let r=loadStash();
  const resume=r?`<div class="resume-bar"><div><b>上次练习尚未完成</b><p>第 ${r.index+1} / ${r.qs.length} 题 · ${r.mode==='mock'?'限时模拟':'专项练习'}${r.mode==='mock'&&Date.now()>=r.deadline?' · 已超时':''}</p></div><button class="btn dark" onclick="resumeSession()">继续答题 →</button></div>`:'';
  const hint=`<div class="mobile-hint"><strong>📱 把题库放到 iPhone 主屏幕</strong>Safari 打开本网页 → 点击「分享」→「添加到主屏幕」。以后点图标就能打开。<div class="minor">练习记录仅保存在当前浏览器，本机可恢复未交卷的进度。清除 Safari 网站数据后，记录也可能消失；不会自动跨设备同步。</div></div>`;
  return resume+html+hint;
}
const _begin=begin;
begin=function(...args){forgetStash();_begin(...args);stash()};
const _choose=choose;
choose=function(...args){_choose(...args);stash()};
const _check=check;
check=function(...args){_check(...args);stash()};
const _move=move;
move=function(...args){_move(...args);stash()};
const _finish=finish;
finish=function(...args){_finish(...args);forgetStash()};
const _quit=quit;
quit=function(){let had=state.run;_quit();if(had && state.view==='home')forgetStash()};
const _reset=resetAll;
resetAll=function(){let had=saved.history.length+saved.wrong.length;_reset();if(had && saved.history.length===0 && saved.wrong.length===0)forgetStash()};
window.addEventListener('pagehide',stash);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stash();else if(state.run?.mode==='mock'&&Date.now()>=state.run.deadline)finish(true)});
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

render();
</script></body></html>
