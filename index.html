<script>
const QUESTIONS=[{"id":"S001","cat":"啤酒风格与比较","type":"multi","stem":"以下哪些成分常见于强烈苦啤（Strong Bitter）和比利时淡色艾尔（Belgian Pale Ale）？","options":["艾尔酵母","水晶麦芽","玉米片","糖类辅料","英国啤酒花"],"answer":[0,1,3,4],"explain":"A（艾尔酵母）正确。 强烈苦啤（BJCP 11C）必须使用英国艾尔酵母；比利时淡色艾尔（BJCP 24B）\n必须使用比利时艾尔酵母。两者均为艾尔。\nB（水晶麦芽）正确。 强烈苦啤典型配方含水晶麦芽；比利时淡色艾尔也允许少量水晶麦芽增加色泽和\n甜味。\nC（玉米片）错误。 玉米片是美式拉格或英式淡味艾尔的辅料特征，不属于强烈苦啤或比利时淡色艾尔\n的典型成分。\nD（糖类辅料）正确。 比利时淡色艾尔常添加蔗糖以提高发酵度；强烈苦啤允许少量糖类辅料。\nE（英国啤酒花）正确。 两者均可使用英国啤酒花（金标、法格尔等）提供泥土/水果酯香。","tag":"原题 1","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":1},{"id":"S002","cat":"酿造原料与工艺","type":"tf","stem":"黑啤（Schwarzbier）和慕尼黑深色啤酒（Munich Dunkel）通常具有中等至饱满的酒体和适 中的碳酸化程度。","options":["正确","错误"],"answer":[1],"explain":"【旧编号勘误】慕尼黑深色应为8A，原解析写6A。\n黑啤（BJCP 8B）酒体为中低至中等，并非\"中等至饱满\"。\n慕尼黑深色啤酒（BJCP 6A）酒体为中低至中等，同样不是\"饱满\"。\n两者碳酸化程度为中等，此部分正确。\n错误点在于\"饱满\"一词——两者均具有较高发酵度和干爽收口，饱满酒体更适用于博克或双博克。","tag":"原题 2","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":2},{"id":"S003","cat":"感官与异味","type":"tf","stem":"二乙酰含量高时会在口感上产生油滑感。","options":["正确","错误"],"answer":[0],"explain":"二乙酰（Diacetyl）是酵母副产物，风味阈值为 0.05-0.1 ppm。\nBJCP 风味术语中，高含量二乙酰在香气上表现为\"人造黄油/奶油糖果\"，在口感（mouthfeel）上确实\n会产生油滑（slick, oily）的触感。","tag":"原题 3","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":3},{"id":"S004","cat":"啤酒风格与比较","type":"tf","stem":"美式波特（American Porter）和甜世涛（Sweet Stout）在 4.5%酒精度下均适宜。","options":["正确","错误"],"answer":[1],"explain":"美式波特（BJCP 20A）：ABV 范围为 4.8% – 6.5%。4.5%低于下限，不适宜。\n甜世涛（BJCP 16A）：ABV 范围为 4.0% – 6.0%。4.5%落在范围内，适宜。\n题目使用\"均适宜\"全称判断，因美式波特不达标，整体判断为错误。","tag":"原题 4","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":4},{"id":"S005","cat":"啤酒风格与比较","type":"tf","stem":"苏格兰淡色啤酒（Scottish Light）比普通苦啤（Ordinary Bitter）更可能带有轻微烘烤特征。","options":["正确","错误"],"answer":[0],"explain":"苏格兰淡色啤酒（BJCP 14A）：麦芽特征中明确包括轻微烘烤（toasty），可带有极淡的烟熏或烘焙\n谷物味。\n普通苦啤（BJCP 11A）：麦芽特征为饼干、坚果、轻微焦糖，但不包含烘烤风味。","tag":"原题 5","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":5},{"id":"S006","cat":"感官与异味","type":"single","stem":"以下哪种化合物可能赋予啤酒\"青苹果\"特征？","options":["醋酸","二甲基硫（DMS）","丁酸","铁","乙醛"],"answer":[4],"explain":"乙醛（Acetaldehyde） 的感官特征被 BJCP 明确描述为青苹果、绿南瓜。\n醋酸→酸/醋味；DMS→煮玉米/蔬菜汤；丁酸→呕吐物/腐臭黄油；铁→金属/铁锈味。","tag":"原题 6","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":6},{"id":"S007","cat":"啤酒风格与比较","type":"tf","stem":"美式烈性艾尔（American Strong Ale）和双倍印度淡色艾尔（Double IPA）可能带有轻微橡 木风味。","options":["正确","错误"],"answer":[1],"explain":"【按2021指南订正】2021版22A Double IPA的原料规定不包括橡木。\n【文档原答案：A】\n美式烈性艾尔（BJCP 22B）：明确允许在橡木桶中陈酿，可带有轻微橡木风味。\n双倍印度淡色艾尔（BJCP 22A）：也允许轻微橡木/桶陈特征。","tag":"原题 7","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"corrected","flag":"","sourceNo":7},{"id":"S008","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。深色博克（Dark Bock）和双倍博克（Doppelbock）都可能具有哪些香气 特征？","options":["美拉德产物","酒精","低果香酯","轻微二甲基硫","轻度烘焙味"],"answer":[0,1,2,4],"explain":"【答案尚待核验】烤面包型toasty与深度烘焙roasty混淆\nA（美拉德产物）正确。 两者均具有烤面包、太妃糖、焦糖等美拉德产物。\nB（酒精）正确。 深色博克 ABV 6.3%-7.2%，双倍博克 7.0%-10.0%，均带轻微酒精香气。\nC（低果香酯）正确。 两者均为拉格，酯香应为低至中低。\nD（轻微二甲基硫）错误。 DMS 在两者中属于缺陷，非特征香气。\nE（轻度烘焙味）正确。 允许轻度烘焙/烘烤谷物风味。","tag":"原题 8","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"烤面包型toasty与深度烘焙roasty混淆","sourceNo":8},{"id":"S009","cat":"BJCP评审与制度","type":"tf","stem":"比赛组织者不得担任评委，即使此人不了解参赛作品与参赛者之间的关联。","options":["正确","错误"],"answer":[1],"explain":"BJCP 裁判守则中并无\"组织者绝对禁止担任评委\"的条款。\n若组织者不了解参赛作品与参赛者之间的关联（保证完全盲评），则可以普通评委身份参与评审。\n真正禁规是：已知作品信息的组委人员不得参与该类别的评审。","tag":"原题 9","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":9},{"id":"S010","cat":"酿造原料与工艺","type":"tf","stem":"冷油（Chill Haze）不能通过过滤去除。","options":["正确","错误"],"answer":[1],"explain":"冷油是啤酒冷却时由多酚-蛋白质复合物凝聚形成的可逆性浑浊。\n冷油完全可以通过物理过滤（硅藻土过滤、膜过滤、PVPP/硅胶吸附）去除。\n真正不能通过常规过滤去除的是生物性浑浊或永久性浑浊。","tag":"原题 10","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":10},{"id":"S011","cat":"酿造原料与工艺","type":"tf","stem":"由于艾尔酵母，Altbier 可能含有低水平的二乙酰。","options":["正确","错误"],"answer":[1],"explain":"【按2021指南订正】7B Altbier强调干净的发酵特征，双乙酰不能仅因艾尔酵母而视为可接受。\n【文档原答案：A】\nAltbier（BJCP 7B） 使用艾尔酵母在凉爽温度下发酵。\nBJCP 指南明确允许 Altbier 中存在低水平的二乙酰，源于艾尔酵母的缬氨酸代谢副产物。","tag":"原题 11","source":"https://styles.bjcp.org/bjcp-2021-beer/7/7b-altbier","status":"corrected","flag":"","sourceNo":11},{"id":"S012","cat":"酿造原料与工艺","type":"tf","stem":"啤酒中的二乙酰不受艾尔酵母菌株选择的影响。","options":["正确","错误"],"answer":[1],"explain":"不同酵母菌株产生二乙酰的能力和还原速度存在显著差异。\n某些艾尔菌株（如英国酵母）天然产生较多 α-乙酰乳酸；另一些菌株产生量较少或还原速度更快。\n酵母选择是管理二乙酰水平的关键因素之一。","tag":"原题 12","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":12},{"id":"S013","cat":"啤酒风格与比较","type":"single","stem":"请选择哪种风格中即使是轻微的涩味也是不合适的：","options":["美式世涛","老棕啤酒","阿尔特啤酒","深色柔和型","美式波特啤酒"],"answer":[3],"explain":"深色柔和型（Dark Mild，BJCP 13A） 要求口感柔滑、圆润、无涩味。涩味会破坏其低酒精度、柔软、\n易饮的特征，属于严重缺陷。\n其他风格均允许一定程度的涩味（来自深色麦芽/烘烤谷物/桶陈）。","tag":"原题 13","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":13},{"id":"S014","cat":"酿造原料与工艺","type":"single","stem":"哪个糖化温度范围有利于 β-淀粉酶？","options":["150-160 华氏度（66-71 摄氏度）","160-170 华氏度（71-77 摄氏度）","120-135 华氏度（49-57 摄氏度）","140-150 华氏度（60-66 摄氏度）","86-126 华氏度（30-52 摄氏度）"],"answer":[3],"explain":"β-淀粉酶（β-amylase） 最适温度范围为 60-65°C（约 140-150°F）。\nA 为 α-淀粉酶最适温度；C 为蛋白酶/β-葡聚糖酶作用范围；E 为植酸酶作用范围。","tag":"原题 14","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":14},{"id":"S015","cat":"感官与异味","type":"tf","stem":"雪利酒样的风味或香气可通过瓶内陈酿纠正。","options":["正确","错误"],"answer":[1],"explain":"\"雪利酒样\"风味是啤酒氧化的典型表现，由醛类（糠醛/E-2-壬烯醛）引起。\n氧化是不可逆的化学反应。瓶内陈酿只会加剧而非减少该缺陷。","tag":"原题 15","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":15},{"id":"S016","cat":"啤酒风格与比较","type":"single","stem":"深色博克啤酒的显著特点是：","options":["通常比淡色博克啤酒更有啤酒花味","比淡色博克更干，口感明显更饱满","博克家族中唯一泡沫保持力差的风格","酿造的原始比重范围与浅色博克完全相同","由圣弗朗西斯·保拉修士在慕尼黑首次酿造"],"answer":[3],"explain":"深色博克（BJCP 5B）和浅色博克（BJCP 5A） 的 OG 范围均为 1.064–1.072，完全相同。\nA 错误：淡色博克啤酒花味更明显；B 错误：深色博克并非更干；C 错误：泡沫保持力差非深色博克专\n属；E 错误：博克由慕尼黑修士酿造，非圣弗朗西斯·保拉。","tag":"原题 16","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":16},{"id":"S017","cat":"啤酒风格与比较","type":"tf","stem":"辅料通常用于外来特浓世涛（Foreign Extra Stout）和美式波特啤酒（American Porter）中。","options":["正确","错误"],"answer":[1],"explain":"外来特浓世涛（BJCP 16D）：以淡色麦芽、烘烤大麦、水晶麦芽为基，不使用辅料。\n美式波特（BJCP 20A）：以麦芽为主，不倾向于使用辅料。\n\"通常\"一词错误——两者均不以使用辅料著称。","tag":"原题 17","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":17},{"id":"S018","cat":"酿造原料与工艺","type":"tf","stem":"英国棕色艾尔（English Brown Ale）和深色轻啤酒（Dark Mild）都可能使用艾尔酵母。","options":["正确","错误"],"answer":[0],"explain":"英国棕色艾尔（BJCP 13B）：归类为艾尔，必须使用英国艾尔酵母。\n深色轻啤酒（BJCP 13A）：同样归类为艾尔，必须使用英国艾尔酵母。","tag":"原题 18","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":18},{"id":"S019","cat":"BJCP评审与制度","type":"tf","stem":"\"首席\"评委有责任与同组其他评委协商，为每个参赛作品赋予共识评分。","options":["正确","错误"],"answer":[0],"explain":"BJCP 比赛中首席评委（Head Judge） 的职责包括：组织小组讨论、引导评委达成共识、确保评分一\n致性。\n最终评分应为共识评分（consensus score）。","tag":"原题 19","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":19},{"id":"S020","cat":"酿造原料与工艺","type":"tf","stem":"搅动酵母保持悬浮有助于清除发酵罐中的二乙酰。","options":["正确","错误"],"answer":[0],"explain":"二乙酰的清除（还原）依靠酵母细胞中的二乙酰还原酶。\n保持酵母悬浮可确保酵母与麦汁充分接触，加速二乙酰还原。","tag":"原题 20","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":20},{"id":"S021","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。哪些特征适用于深色博克（Dark Bock）和双倍博克（Doppelbock）？","options":["足够的啤酒花苦味以支撑麦芽风味","使用深度烘焙麦芽带来的轻微涩味","中等偏饱满的酒体","中等到中低碳水化","极轻微的二乙酰"],"answer":[0,2],"explain":"A（足够的啤酒花苦味）正确。 两者苦度（IBU 16-27）足以平衡浓郁的麦芽甜味。\nB（深度烘焙麦芽涩味）错误。 两者使用慕尼黑/维也纳/水晶麦芽，不涉及深度烘焙麦芽。\nC（中等偏饱满酒体）正确。 深色博克为中等到饱满，双倍博克为饱满。\nD（中低碳水化）错误。 两者碳酸化为中等。\nE（极轻微二乙酰）错误。 两者为拉格，二乙酰应为不存在或极低。","tag":"原题 21","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":21},{"id":"S022","cat":"啤酒风格与比较","type":"multi","stem":"酿酒师可以通过以下方式减少啤酒的苦味：","options":["减少啤酒花煮沸时间","使用高 α 酸含量的啤酒花","使用拉格酵母","在煮沸过程中使用爱尔兰苔藓","使用低 α 酸含量的啤酒花"],"answer":[0,4],"explain":"A（减少煮沸时间）正确。 缩短煮沸时间减少 α-酸异构化，降低苦味。\nB（高 α 酸酒花）错误。 高 α 酸品种产生更多苦味。\nC（拉格酵母）错误。 酵母类型不直接改变苦味。\nD（爱尔兰苔藓）错误。 爱尔兰苔藓是澄清剂，不影响苦味。\nE（低 α 酸酒花）正确。 α 酸含量越低，苦味越少。","tag":"原题 22","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":22},{"id":"S023","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。以下哪些区别了老式啤酒（Old Ale）和最佳苦啤（Best Bitter）？","options":["啤酒花品种","颜色","最高酒精度","麦芽选择","使用艾尔酵母"],"answer":[0,1,2,3],"explain":"【答案尚待核验】风格差异维度不明确\nA（啤酒花品种）正确。 老式啤酒使用英式/欧洲大陆品种；最佳苦啤同样使用英式酒花但品种选择不\n同。\nB（颜色）正确。 老式啤酒 SRM 8-22；最佳苦啤 SRM 8-16。\nC（最高酒精度）正确。 老式啤酒 ABV≥4.1%（通常 5.0%-7.0%）；最佳苦啤 ABV 4.0%-4.9%。\nD（麦芽选择）正确。 老式啤酒含深色水晶/巧克力麦芽；最佳苦啤以淡色+浅色水晶为主。\nE（使用艾尔酵母）错误。 两者均为艾尔酵母发酵，此点相同。","tag":"原题 23","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"风格差异维度不明确","sourceNo":23},{"id":"S024","cat":"酿造原料与工艺","type":"tf","stem":"单次浸泡糖化（Single Infusion Mash）应在糖化温度保持约一小时。","options":["正确","错误"],"answer":[0],"explain":"单次浸泡糖化在单一目标温度下进行 60 分钟（约一小时）的糖化休止，是实现淀粉充分转化的标准时\n间。","tag":"原题 24","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":24},{"id":"S025","cat":"啤酒风格与比较","type":"tf","stem":"艾尔啤酒通常比拉格啤酒发酵温度更低。","options":["正确","错误"],"answer":[1],"explain":"艾尔啤酒发酵温度通常在 18-24°C。\n拉格啤酒发酵温度通常在 7-13°C。\n艾尔发酵温度显著高于拉格，题目说反了。","tag":"原题 25","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":25},{"id":"S026","cat":"感官与异味","type":"tf","stem":"\"杰出\"评分范围保留给不仅无缺陷且具有难以定义的\"非凡\"特质的优秀啤酒。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评分表中，\"杰出（Outstanding）\" 对应 38-44 分。\n定义为：啤酒不仅没有缺陷，而且具有\"非凡（exceptional）\" 的复杂度和平衡感。","tag":"原题 26","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":26},{"id":"S027","cat":"感官与异味","type":"tf","stem":"波罗的海波特啤酒（Baltic Porter）可以有低水平的二乙酰。","options":["正确","错误"],"answer":[0],"explain":"波罗的海波特（BJCP 9C） 的香气描述中明确允许低水平的双乙酰（low diacetyl）。\n与大多数拉格风格（要求零二乙酰）不同，波罗的海波特因高比重和深色麦芽特性对二乙酰有更高容忍\n度。","tag":"原题 27","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":27},{"id":"S028","cat":"BJCP评审与制度","type":"tf","stem":"如果样品足够，评委可以邀请工作人员一起品尝一组啤酒。","options":["正确","错误"],"answer":[1],"explain":"BJCP 比赛规则明确规定：仅限认证评委及经批准的见习评委参与评审工作。\n工作人员不具备评审资格，不得参与品尝和评分。","tag":"原题 28","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":28},{"id":"S029","cat":"酿造原料与工艺","type":"multi","stem":"请选择所有适用项。谷物糖化（Cereal Mash）对辅料谷物有哪些好处？","options":["改善啤酒的清澈度","使啤酒颜色变浅","减少啤酒中的二甲基硫（DMS）","使辅料中的淀粉胶化（gelatinization）","水解辅料中的淀粉"],"answer":[3,4],"explain":"D（使淀粉胶化）正确。 未发芽谷物淀粉需加热胶化才能被酶解。\nE（水解淀粉）正确。 胶化后的淀粉在主糖化中被 α-和 β-淀粉酶水解。\nA/B/C 均为干扰项，非谷物糖化的主要功能。","tag":"原题 29","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":29},{"id":"S030","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 特级大师评委必须在书面和品鉴考试中综合得分至少达到 95%。","options":["正确","错误"],"answer":[1],"explain":"特级大师（Grand Master） 的晋级要求为：品鉴考试≥90%，且书面考试≥90%。\n并非 95%。95%是理论高分，但非官方规定的晋升基准线。","tag":"原题 30","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":30},{"id":"S031","cat":"酿造原料与工艺","type":"tf","stem":"全麦酿酒师可以通过提高糖化温度来降低啤酒的酒体感。","options":["正确","错误"],"answer":[1],"explain":"低温糖化（62-65°C）：有利于 β-淀粉酶，产生更多可发酵糖，酒体更轻、更干。\n高温糖化（67-70°C）：有利于 α-淀粉酶，产生更多不可发酵糊精，酒体更饱满。\n提高糖化温度会使酒体变饱满，而非降低。","tag":"原题 31","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":31},{"id":"S032","cat":"啤酒风格与比较","type":"multi","stem":"请勾选所有适用项。高浓度的高级醇（Higher Alcohols）可能与以下情况相关：","options":["投料前溶解氧含量低","酵母投加不足","低水平的游离可用氮（FAN）","醋杆菌引起的变质","冲洗水的 pH 值超过 8.0 且温度高于 170 华氏度（77 摄氏度）"],"answer":[1,2],"explain":"B（酵母投加不足）正确。 低接种率导致酵母需经历更多对数生长期，氨基酸降解加剧，产生高水平高\n级醇。\nC（低 FAN）正确。 FAN 不足时，酵母被迫更依赖 Ehrlich 途径分解氨基酸，生成大量高级醇。\nA 错误：低溶解氧主要导致乙醛和双乙酰升高；D 错误：醋杆菌产生乙酸；E 错误：高温高 pH 导致单\n宁/涩味萃取。","tag":"原题 32","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":32},{"id":"S033","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。佛兰德红艾尔（Flanders Red Ale）和老布鲁因啤酒（Oud Bruin）在哪 些方面可能相似？","options":["酒精含量可达 8%","可能表现出明显的醋酸味","可能没有啤酒花的香气或味道","可能具有中等酒体和适度碳酸化","可能具有深色水果醋香"],"answer":[0,2,3,4],"explain":"【答案尚待核验】醋酸和醋香的可接受范围存在歧义\nA（酒精含量可达 8%）正确。 佛兰德红艾尔 ABV 4.6%-6.5%（部分可达 8%）；老布鲁因 ABV 4.0%-\n8.0%。\nB（明显醋酸味）错误。 佛兰德红艾尔允许明显醋酸味，但老布鲁因以乳酸为主导，醋酸味为缺陷。\nC（无啤酒花香气）正确。 两者酒花香气均为无至极低。\nD（中等酒体+适度碳酸化）正确。\nE（深色水果醋香）正确。 两者均带深色水果酯香和酸香。","tag":"原题 33","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"醋酸和醋香的可接受范围存在歧义","sourceNo":33},{"id":"S034","cat":"酿造原料与工艺","type":"tf","stem":"只要有适当的陈酿时间和温度，酵母可以自然减少二乙酰。","options":["正确","错误"],"answer":[0],"explain":"二乙酰在发酵后期通过酵母细胞内的二乙酰还原酶，在合适温度（18-22°C） 和足够时间（2-5 天） 下\n被还原为乙偶姻和 2,3-丁二醇。","tag":"原题 34","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":34},{"id":"S035","cat":"酿造原料与工艺","type":"single","stem":"酵母在生命周期的哪个阶段吸收氧气以生成用于构建细胞壁的甾醇？","options":["稳定期","加速或低发泡阶段","滞后期","指数或高 kräusen 阶段","减速或晚期发酵泡沫阶段"],"answer":[2],"explain":"滞后期（Lag Phase） 是酵母接种后适应环境、准备繁殖的阶段。\n在此期间，酵母吸收麦汁中的氧气（O₂），用于合成甾醇（sterols） 和不饱和脂肪酸，构建细胞膜和\n细胞壁。","tag":"原题 35","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":35},{"id":"S036","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母绝不会产生高级醇。","options":["正确","错误"],"answer":[1],"explain":"野生酵母（包括 Brettanomyces） 同样通过 Ehrlich 途径代谢氨基酸，可以产生高级醇（如异戊醇、\n苯乙醇）。\n\"绝不会\"是绝对化表述，错误。","tag":"原题 36","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":36},{"id":"S037","cat":"啤酒风格与比较","type":"tf","stem":"爱尔兰红艾尔（Irish Red Ale）比玛岑啤酒（Märzen）更可能突出啤酒花香气。","options":["正确","错误"],"answer":[1],"explain":"【旧编号勘误】Märzen应为6A，原解析写6B。\n爱尔兰红艾尔（BJCP 15A）：啤酒花香气为低至极低。\n玛岑啤酒（BJCP 6B）：啤酒花香气为中等至中低，贵族型酒花特征明显。\n玛岑的酒花香气更突出。","tag":"原题 37","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":37},{"id":"S038","cat":"BJCP评审与制度","type":"tf","stem":"在写任何评论之前，啤酒评分表的每个部分都必须先用数字评分，以最好地捕捉您的第一印象。","options":["正确","错误"],"answer":[1],"explain":"BJCP 标准评分流程要求：评委先品尝并写下描述性评论，然后再给每个部分打分。\n先打分会造成\"先入为主\"的锚定效应，干扰客观描述。","tag":"原题 38","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":38},{"id":"S039","cat":"啤酒风格与比较","type":"single","stem":"制作老艾尔啤酒（Old Ale）的典型麦芽包括：","options":["浅色六排大麦和深色水晶麦芽","皮尔森和/或维也纳","浅色和深色焦糖麦芽","维也纳和/或慕尼黑","皮尔森麦芽和浅色水晶麦芽"],"answer":[3],"explain":"老艾尔（BJCP 19A） 使用英式淡色麦芽为基础，大量使用维也纳（Vienna）和/或慕尼黑\n（Munich）麦芽增加麦芽深度、烤面包和焦糖风味。","tag":"原题 39","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":39},{"id":"S040","cat":"啤酒风格与比较","type":"single","stem":"经典德国皮尔森啤酒（German Pils）的风味特征最不准确的描述是：","options":["适度谷物麦芽味，啤酒花苦味和风味浓郁，口感中等干爽","轻微麦芽甜味和适度啤酒花风味，带有持久的苦味","花香啤酒花，谷物甜麦芽，中高苦味和干爽的收尾","辛辣的啤酒花风味主导于谷物麦芽，口感清脆干爽","辛辣的贵族啤酒花与谷物麦芽均衡，伴有轻微的二甲基硫和极低的酯类"],"answer":[4],"explain":"【按2021指南订正】5D German Pils应干爽、以酒花为前导，含DMS的E选项才最不恰当。\n【文档原答案：D】\n德国皮尔森要求麦芽与酒花均衡，酒花不应\"主导（dominates）\"于谷物麦芽。\nA/B/C/E 均为准确描述；D 因\"主导\"一词偏离\"均衡\"原则。","tag":"原题 40","source":"https://styles.bjcp.org/bjcp-2021-beer/5/5d-german-pils","status":"corrected","flag":"","sourceNo":40},{"id":"S041","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。哪些啤酒风格通常浑浊？","options":["白啤（Witbier）","白啤（Weissbier）","最佳苦啤（Best Bitter）","慕尼黑淡色啤酒（Munich Helles）","三料啤酒（Tripel）"],"answer":[0,1,4],"explain":"A（Witbier）正确。 未过滤蛋白质和酵母悬浮，浑浊。\nB（Weissbier）正确。 未过滤小麦啤酒，酵母悬浮产生浑浊。\nC（最佳苦啤）错误。 英式苦啤通常澄清。\nD（慕尼黑淡色）错误。 德式淡色拉格要求清澈。\nE（三料）正确。 瓶内发酵，酵母悬浮，浑浊至轻微雾状。","tag":"原题 41","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":41},{"id":"S042","cat":"酿造原料与工艺","type":"tf","stem":"在最佳苦啤（Best Bitter）中允许使用辅料锅糖（Invert Sugar/Syrup）。","options":["正确","错误"],"answer":[0],"explain":"最佳苦啤（BJCP 11B） 是英式淡色艾尔，传统配方中允许使用转化糖/糖浆，用以提高发酵度、降低酒\n体。","tag":"原题 42","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":42},{"id":"S043","cat":"酿造原料与工艺","type":"tf","stem":"添加稻壳可以改善谷物麦芽浆的过滤性能。","options":["正确","错误"],"answer":[0],"explain":"稻壳（rice hulls） 是惰性过滤介质，可增加麦糟孔隙度，防止滤床堵塞/板结，尤其在使用小麦、黑\n麦、燕麦时。","tag":"原题 43","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":43},{"id":"S044","cat":"酿造原料与工艺","type":"multi","stem":"野生酵母引起的涩味可能由哪些化合物引起？","options":["酚类化合物","二乙胺","二甲基硫（DMS）","酸味","酮类"],"answer":[0,3],"explain":"A（酚类化合物）正确。 野生酵母（Brettanomyces）产生挥发性酚类（4-乙基苯酚等），可产生收敛\n感/涩味。\nD（酸味）正确。 野生酵母可产生有机酸，高浓度酸导致酸涩感。\nB/C/E 均与涩味无关。","tag":"原题 44","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":44},{"id":"S045","cat":"感官与异味","type":"single","stem":"具有明显青苹果香气的啤酒最可能有什么缺陷？","options":["单宁","二甲基硫（DMS）","酚类化合物","高级醇","乙醛"],"answer":[4],"explain":"青苹果（green apple） 香气是乙醛（acetaldehyde） 的典型特征描述。","tag":"原题 45","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":45},{"id":"S046","cat":"BJCP评审与制度","type":"tf","stem":"每个 BJCP 特级大师级别都有额外的服务和/或考试评分要求。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评委等级从认证评委到特级大师，每级均设有不同要求。\n特级大师不仅要求考试得分≥90%，还要求累计经验积分、服务积分以及持续参与评审活动。","tag":"原题 46","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":46},{"id":"S047","cat":"酿造原料与工艺","type":"tf","stem":"布雷塔酵母菌株（Brettanomyces）与雪利酒般的风味和香气相关。","options":["正确","错误"],"answer":[0],"explain":"Brettanomyces 代谢产生乙醛、挥发性酚类和酯类，赋予啤酒雪利酒般的风味（干果、皮革、马厩、\n辛香）。","tag":"原题 47","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":47},{"id":"S048","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。以下哪些陈述描述了美式拉格（American Lager）和捷克高级淡色拉格 （Czech Premium Pale Lager）的相似之处？","options":["两者的酒精度均可达到 5%。","两者的终比重都可以低于 1.010","两者都是底部发酵","两者的原始比重都可能超过 1.050","两者都清爽，有时带有脆感"],"answer":[0,1,2,4],"explain":"A 正确。 美式拉格 ABV 4.2%-5.3%，捷克拉格 4.2%-5.8%，均可达 5%。\nB 正确。 美式拉格 FG 1.004-1.010，捷克拉格 1.008-1.014，均可\u003c1.010。\nC 正确。 两者均为拉格（底部发酵）。\nD 错误。 美式拉格 OG 为 1.040-1.050，不超过 1.050；捷克拉格可超过 1.050。两者\"都\"超过不成立。\nE 正确。 两者均以清爽、脆感为特征。","tag":"原题 48","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":48},{"id":"S049","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母可产生以醛类形式表现的涩味。","options":["正确","错误"],"answer":[1],"explain":"醛类（aldehydes） 如乙醛，赋予青苹果、生青风味，而非涩味（astringency）。\n涩味是收敛感，由多酚/单宁或有机酸引起。","tag":"原题 49","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":49},{"id":"S050","cat":"啤酒风格与比较","type":"tf","stem":"三月啤酒（Märzen）比储藏啤酒（Standard American Lager）更可能具有烤面包香特征。","options":["正确","错误"],"answer":[0],"explain":"【旧编号勘误】Märzen应为6A，原解析写6B。\n三月啤酒（BJCP 6B）：麦芽特征为丰富、烤面包（toasty）、面包皮，来自维也纳/慕尼黑麦芽。\n美式储藏拉格（BJCP 1B）：麦芽特征为中性、轻微谷物甜，无烤面包香。","tag":"原题 50","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":50},{"id":"S051","cat":"酿造原料与工艺","type":"tf","stem":"经典美式烈性艾尔（Classic American Strong Ale）可以具有中等偏轻的酒体和中等碳酸化水 平。","options":["正确","错误"],"answer":[1],"explain":"美式烈性艾尔（BJCP 22B） 的酒体为中等到饱满（medium to full），并非\"中等偏轻\"。\n碳酸化为中等，此部分正确，但酒体描述错误。","tag":"原题 51","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":51},{"id":"S052","cat":"啤酒风格与比较","type":"tf","stem":"3%酒精度下，深色淡啤（Dark Mild）或美式棕色艾尔（American Brown Ale）都不合适。","options":["正确","错误"],"answer":[0],"explain":"深色淡啤（BJCP 13A）：ABV 2.8%-3.8%，3%合适。\n美式棕色艾尔（BJCP 19B）：ABV 4.3%-6.2%，3%不合适。\n题目说\"都不合适\"——因美式棕色艾尔不达标，整体判断为正确。","tag":"原题 52","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":52},{"id":"S053","cat":"啤酒风格与比较","type":"tf","stem":"最佳苦啤（Best Bitter）和强烈苦啤（Strong Bitter）可以是真正的艾尔啤酒。","options":["正确","错误"],"answer":[0],"explain":"两者均为英式艾尔风格，使用艾尔酵母发酵。\"真正的艾尔（Real Ale）\"指容器内二次发酵，英式苦啤\n传统上即属此范畴。","tag":"原题 53","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":53},{"id":"S054","cat":"BJCP评审与制度","type":"tf","stem":"\"首席\"评委经赛事组织者同意后，可委托赛事组织者填写其组别啤酒的封面表（Cover Sheet）。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】评委及组织者现行规章待核\nBJCP 比赛规程明确规定：封面表包含参赛作品编号、类别、参赛者信息等敏感数据。\n首席评委不得接触或填写封面表，即使经组织者同意也不可以，以保证盲评公正性。","tag":"原题 54","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"评委及组织者现行规章待核","sourceNo":54},{"id":"S055","cat":"啤酒风格与比较","type":"single","stem":"深色淡味啤酒（Dark Mild）的国际苦味单位（IBU）范围为：","options":["20 到 38","8 到 12","10 到 25","16 到 35","14 到 28"],"answer":[2],"explain":"深色淡啤（BJCP 13A）：IBU 范围为 10-25。","tag":"原题 55","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":55},{"id":"S056","cat":"酿造原料与工艺","type":"tf","stem":"水中硫酸盐带来的突出苦味在美式淡色艾尔中是可以接受的。","options":["正确","错误"],"answer":[0],"explain":"硫酸盐（SO₄²⁻） 增强啤酒花苦味的感知锐度。\n美式淡色艾尔（BJCP 18B） 以突出的啤酒花风味和苦度为特征，硫酸盐强化酒花特性属于风格允许范\n围。","tag":"原题 56","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":56},{"id":"S057","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母污染可能产生二甲基硫（DMS）。","options":["正确","错误"],"answer":[1],"explain":"DMS 的主要来源是麦芽中的 SMM 在糖化/煮沸过程中热降解产生，与酵母（包括野生酵母）代谢无直\n接关系。","tag":"原题 57","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":57},{"id":"S058","cat":"BJCP评审与制度","type":"tf","stem":"当你的品鉴组结束后，应避免进行可能分散尚未完成品鉴的其他评委注意力的对话。","options":["正确","错误"],"answer":[0],"explain":"BJCP 比赛场地要求维持安静、专注的评审环境。已结束评审的评委应避免大声交谈，以免干扰仍在评\n审中的组别。","tag":"原题 58","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":58},{"id":"S059","cat":"啤酒风格与比较","type":"tf","stem":"贵族啤酒花（Noble Hops）香气息适合慕尼黑淡色啤（Munich Helles）和德国皮尔森啤 （German Pils）。","options":["正确","错误"],"answer":[0],"explain":"慕尼黑淡色（BJCP 4A）：酒花香气为低至中低，贵族型酒花特征。\n德国皮尔森（BJCP 5D）：酒花香气为中等至中高，贵族型酒花是标志性特征。","tag":"原题 59","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":59},{"id":"S060","cat":"啤酒风格与比较","type":"single","stem":"小麦博克啤酒（Weizenbock）的风味特征最佳描述为：","options":["烤麦芽味、低酯类和适中苦味，带来清脆干净的收尾","丰富的面包香，带有深色水果、丁香和香蕉特征，收尾有明显酒精感","丰富的麦芽味，显著的香蕉酯和丁香酚，带来干爽收尾和持久苦味","焦糖和烘烤麦芽，低香蕉酯和丁香酚，带来甜美的收尾","烤麦芽与酒精和辛辣酸类协调，收尾带有轻微烘烤特征"],"answer":[1],"explain":"小麦博克（BJCP 10C） 结合了小麦酵母和深色博克特征。\nB 选项完全符合 BJCP 描述：丰富的面包香（小麦+深色麦芽）、深色水果（葡萄干/李子）、丁香（4-\n乙烯基愈创木酚）、香蕉（乙酸异戊酯）、收尾明显酒精感。\nC 错误：\"显著的香蕉酯和丁香酚\"更适用于德式小麦（Hefeweizen），而非小麦博克。","tag":"原题 60","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":60},{"id":"S061","cat":"酿造原料与工艺","type":"tf","stem":"英式棕色艾尔（English Brown Ale）中的二乙酰是由于酵母菌株而可接受的。","options":["正确","错误"],"answer":[1],"explain":"【按2021指南订正】13B British Brown Ale并不因为酵母菌株而允许双乙酰。\n【文档原答案：A】\n英式棕色艾尔（BJCP 13B） 使用英式艾尔酵母，这类酵母在发酵过程中常产生中低水平的二乙酰，赋\n予啤酒特征性的\"太妃糖/奶油糖果\"风味。\nBJCP 指南明确允许该风格中存在低至中等（low to moderate） 的二乙酰，且这是风格特征的一部分，\n非缺陷。","tag":"原题 61","source":"https://styles.bjcp.org/bjcp-2021-beer/13/13b-british-brown-ale","status":"corrected","flag":"","sourceNo":61},{"id":"S062","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。对于参赛者的啤酒出现不良的雪利酒样特征（sherry-like off-flavor）， 有哪些建议？","options":["减少高 α 酸啤酒花","添加蛋白质休止","提供更新鲜的啤酒","减少使用烘烤麦芽","减少高温下的氧气暴露"],"answer":[2,4],"explain":"雪利酒样风味是氧化（oxidation） 的典型表现，由醛类（糠醛、E-2-壬烯醛）引起。\nC（提供更新鲜的啤酒）正确。 雪利酒味是陈年/老化的标志，提供新鲜啤酒可避免氧化产物积累。\nE（减少高温下的氧气暴露）正确。 氧化反应速率随温度升高而加快，减少高温和氧气接触是根本预防\n措施。\nA（高 α 酸酒花与氧化无关）；B（蛋白质休止影响清澈度，与氧化无关）；D（烘烤麦芽非雪利酒味主\n因）。","tag":"原题 62","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":62},{"id":"S063","cat":"酿造原料与工艺","type":"tf","stem":"兰比克啤酒（Lambic）的酵母可带有丁香和香草的风味/香气。","options":["正确","错误"],"answer":[0],"explain":"兰比克（BJCP 23D） 使用自然发酵（野生酵母和细菌混合），包括 Brettanomyces、乳酸菌、醋酸菌\n等。\n微生物可产生丁香（4-乙烯基愈创木酚） 和香草（香兰素，来自木桶陈酿） 风味。\nBJCP 指南中兰比克的香气包含辛香、酚类、木质、香草等特征。","tag":"原题 63","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":63},{"id":"S064","cat":"酿造原料与工艺","type":"single","stem":"爱尔兰烈性黑啤（Irish Stout）的最佳水质特征是：","options":["非常软","伯顿化","中等碳酸","低碳酸盐","中等硫酸盐含量"],"answer":[3],"explain":"【答案尚待核验】水质唯一答案需核\n爱尔兰烈性黑啤（BJCP 15B） 传统上使用都柏林水质，特征为低碳酸盐（low carbonate） 和中等\n硬度。\n低碳酸盐/低碱度有助于突出烘烤大麦的苦味和干爽感，同时避免深色麦芽带来的涩味。\n高碳酸盐会缓冲麦芽酸度，增加涩感。","tag":"原题 64","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"水质唯一答案需核","sourceNo":64},{"id":"S065","cat":"啤酒风格与比较","type":"tf","stem":"皮尔森啤酒厂（Pilsner Urquell Brewery）被认为是德国皮尔森啤酒的始祖。","options":["正确","错误"],"answer":[1],"explain":"皮尔森啤酒起源于捷克共和国皮尔森市，由 Pilsner Urquell 于 1842 年首次酿造。\n它是所有皮尔森风格的始祖（包括德国皮尔森），但不是德国皮尔森特有的始祖。\n因地缘错误，判断为错误。","tag":"原题 65","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":65},{"id":"S066","cat":"啤酒风格与比较","type":"tf","stem":"比利时三料啤酒（Belgian Tripel）通常含有辅料，但比利时金色艾尔（Belgian Blonde Ale） 很少含有。","options":["正确","错误"],"answer":[1],"explain":"比利时三料（BJCP 26C）：通常使用辅料（蔗糖/转化糖），以提高发酵度、产生干爽收口。\n比利时金色艾尔（BJCP 25A）：也经常使用辅料（糖类），同样达到高发酵度和清爽口感。\n题目说金色艾尔\"很少含有\"与工艺不符。","tag":"原题 66","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":66},{"id":"S067","cat":"酿造原料与工艺","type":"single","stem":"酵母细胞代谢中镁（Mg²⁺）的功能会被过量的以下物质抑制：","options":["磷酸盐","氧气","钙","游离氨基氮（FAN）","锌"],"answer":[2],"explain":"镁（Mg²⁺） 是酵母代谢中的关键辅因子。\n钙（Ca²⁺） 与镁在酵母细胞吸收中具有拮抗作用（competitive antagonism）。高浓度钙离子会抑\n制酵母对镁的摄取。","tag":"原题 67","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":67},{"id":"S068","cat":"啤酒风格与比较","type":"tf","stem":"老艾尔啤酒（Old Ale）中不允许使用巧克力麦芽。","options":["正确","错误"],"answer":[1],"explain":"老艾尔（BJCP 19A） 的麦芽特征包括深色水果、焦糖、太妃糖、坚果和轻微巧克力风味。\n巧克力麦芽属于允许使用的深色麦芽，\"不允许\"是绝对化错误表述。","tag":"原题 68","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":68},{"id":"S069","cat":"啤酒风格与比较","type":"single","stem":"与美式琥珀艾尔（American Amber Ale）不同，加州普通啤酒（California Common）以其... 著称：","options":["使用香料而非啤酒花进行苦味调节","唯一泡沫保持力差的美式风格","用艾尔酵母在较低的拉格温度下发酵","使用野生酵母自然发酵","用拉格酵母在较低的艾尔发酵温度下发酵"],"answer":[2],"explain":"加州普通啤酒（BJCP 19A） 的核心特征为：使用艾尔酵母在较低的拉格温度（10-15°C） 下发酵，或\n使用拉格酵母在艾尔温度下发酵。\nC 描述最准确——用艾尔酵母在较低的拉格温度下发酵。","tag":"原题 69","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":69},{"id":"S070","cat":"啤酒风格与比较","type":"tf","stem":"苦味是舌头能感知的基本味觉之一。","options":["正确","错误"],"answer":[0],"explain":"人类味觉系统中公认的基本味觉（basic tastes） 包括：甜、酸、咸、苦、鲜（umami）。","tag":"原题 70","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":70},{"id":"S071","cat":"啤酒风格与比较","type":"tf","stem":"适度的啤酒花香气适合爱尔兰红艾尔（Irish Red Ale），但不适合玛尔森啤酒（Märzen）。","options":["正确","错误"],"answer":[1],"explain":"【旧编号勘误】Märzen应为6A，原解析写6B。\n爱尔兰红艾尔（BJCP 15A）：啤酒花香气为低至极低，并非\"适度\"。\n玛尔森啤酒（BJCP 6B）：啤酒花香气为中等至中低，常有贵族型酒花特征。\n题目前半句错误，后半句也错误，整体判断为错误。","tag":"原题 71","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":71},{"id":"S072","cat":"啤酒风格与比较","type":"tf","stem":"慕尼黑淡色拉格（Munich Helles）和德国皮尔森啤酒（German Pils）在 5%酒精度时都很合 适。","options":["正确","错误"],"answer":[0],"explain":"慕尼黑淡色（BJCP 4A）：ABV 4.7%-5.4%，5%合适。\n德国皮尔森（BJCP 5D）：ABV 4.4%-5.2%，5%合适。\n两者在 5% ABV 下均符合风格要求。","tag":"原题 72","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":72},{"id":"S073","cat":"酿造原料与工艺","type":"single","stem":"慕尼黑深色啤酒（Munich Dunkel）的酵母特征通常是：","options":["带有胡椒味和花香","清爽拉格","相当干净，带有轻微果香","辛辣，带有丁香和香蕉酯香","果味且略带酸味"],"answer":[2],"explain":"【旧编号勘误】慕尼黑深色应为8A，原解析写6A。\n慕尼黑深色啤酒（BJCP 6A） 是德式拉格，使用底部发酵酵母。\n酵母特征为相当干净（very clean），允许极轻微的果酯（very low fruity esters）。\nD 为德式小麦特征；E 为酸艾尔特征。","tag":"原题 73","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":73},{"id":"S074","cat":"感官与异味","type":"tf","stem":"白啤（Witbier）因香料可接受轻微涩味。","options":["正确","错误"],"answer":[1],"explain":"白啤（BJCP 24A） 口感应为顺滑、奶油感，涩味（astringency）在风格中属于缺陷。\n香料（橙皮）可能带来轻微苦味或柑橘油质感，但涩味非允许特征。","tag":"原题 74","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":74},{"id":"S075","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母污染可能产生药味特征。","options":["正确","错误"],"answer":[0],"explain":"野生酵母污染（尤其是 Brettanomyces）可代谢产生挥发性酚类化合物（4-乙基苯酚、4-乙烯基愈创木\n酚）。\n这些化合物表现为药味（medicinal）、辛辣、烟熏或马厩风味。","tag":"原题 75","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":75},{"id":"S076","cat":"酿造原料与工艺","type":"tf","stem":"野生酵母可能以多酚的形式产生涩味。","options":["正确","错误"],"answer":[1],"explain":"涩味（astringency） 由多酚/单宁与口腔唾液蛋白结合产生。但多酚是谷物、酒花和橡木中固有的化\n合物，并非由野生酵母\"产生\"。\n野生酵母可产生酚类化合物和有机酸，但多酚本身不是酵母代谢产物。","tag":"原题 76","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":76},{"id":"S077","cat":"感官与异味","type":"single","stem":"选择最可能导致成品啤酒酸味的工艺：","options":["使用未消毒的弯脱量杯进行回流麦汁","煮沸过程中使用木勺搅拌麦汁","通过虹吸管吸取啤酒转入二次发酵罐","在过滤前用自来水冲洗过滤槽","在煮沸室内研磨谷物"],"answer":[0],"explain":"酸味最常见原因是细菌污染（乳酸菌/醋酸菌）在发酵前或发酵中产酸。\nA（未消毒弯脱量杯）正确。 煮沸后冷却前的热麦汁若接触未消毒工具，极易引入产酸细菌。\nB（煮沸时木勺）——煮沸温度≥100°C 足以杀灭微生物；C（虹吸）污染风险相对较低；D（自来水）\n可能带来氯酚异味；E（研磨谷物）不直接导致酸味。","tag":"原题 77","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":77},{"id":"S078","cat":"感官与异味","type":"tf","stem":"过多的单宁会导致成品啤酒浑浊。","options":["正确","错误"],"answer":[0],"explain":"单宁（多酚） 与麦汁中的蛋白质结合形成多酚-蛋白质复合物，这是冷浑浊和永久浑浊的主要成因之一。","tag":"原题 78","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":78},{"id":"S079","cat":"酿造原料与工艺","type":"tf","stem":"氯化物增强啤酒花的苦味。","options":["正确","错误"],"answer":[1],"explain":"氯离子（Cl⁻） 主要增强麦芽的甜味和圆润感，使啤酒口感更顺滑、饱满。\n硫酸盐（SO₄²⁻） 才具有增强苦味锐度的作用。","tag":"原题 79","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":79},{"id":"S080","cat":"酿造原料与工艺","type":"tf","stem":"强烈苦啤（Strong Bitter）的传统糖化过程包括蛋白质休止。","options":["正确","错误"],"answer":[1],"explain":"强烈苦啤（BJCP 11C） 使用现代充分改性麦芽，传统上不进行蛋白质休止。\n蛋白质休止主要用于改性不足的麦芽，现代麦芽进行蛋白质休止会降低泡沫稳定性和酒体饱满度。","tag":"原题 80","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":80},{"id":"S081","cat":"啤酒风格与比较","type":"tf","stem":"只要酒香宜人，比利时双料（Dubbel）和三料（Tripel）啤酒中都适合有酒精香气。","options":["正确","错误"],"answer":[0],"explain":"比利时双料（BJCP 26B） 和三料（BJCP 26C） 均为高酒精度比利时艾尔。\nBJCP 指南明确允许温和至明显的酒精香气（warm, alcoholic），前提是宜人（pleasant） 且与麦芽\n/酯酚特征协调。","tag":"原题 81","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":81},{"id":"S082","cat":"啤酒风格与比较","type":"tf","stem":"最佳苦啤（Best Bitter）的颜色范围与玛尔森啤酒（Märzen）有显著重叠。","options":["正确","错误"],"answer":[0],"explain":"【旧编号勘误】Märzen应为6A，原解析写6B。\n最佳苦啤（BJCP 11B）：SRM 8-16。\n玛尔森啤酒（BJCP 6B）：SRM 8-17。\n两者色度范围高度重叠（均为 8-16/17），存在显著重叠。","tag":"原题 82","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":82},{"id":"S083","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。以下哪些可以帮助降低二乙酰浓度？","options":["蛋白质休止","高水平的自由可用氮（FAN）","克劳辛法（再发酵法，Krausening）","自由氮（FAN）含量低","较高的发酵温度"],"answer":[1,2,4],"explain":"【答案尚待核验】双乙酰还原与FAN关系复杂\nA（蛋白质休止）错误。 影响蛋白质分解，与二乙酰生成/清除无直接关系。\nB（高水平 FAN）正确。 充足 FAN 减少酵母对缬氨酸合成途径的依赖，减少二乙酰前体生成。\nC（克劳辛法）正确。 引入新鲜酵母加速二乙酰还原。\nD（低 FAN）错误。 低 FAN 增加二乙酰生成。\nE（较高发酵温度）正确。 升温增强酵母代谢活性和还原酶效率，加速二乙酰清除。","tag":"原题 83","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"双乙酰还原与FAN关系复杂","sourceNo":83},{"id":"S084","cat":"酿造原料与工艺","type":"tf","stem":"发酵副产物乙醛和二乙酰是所有酵母的典型产物。","options":["正确","错误"],"answer":[0],"explain":"乙醛是乙醇发酵途径中的关键中间代谢产物。\n二乙酰是酵母缬氨酸代谢的副产物。\n两者均为酵母发酵的典型产物，而非污染或异常导致。","tag":"原题 84","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":84},{"id":"S085","cat":"啤酒风格与比较","type":"tf","stem":"干投啤酒花（Dry Hopping）是为了帮助柔化最佳苦啤的风味。","options":["正确","错误"],"answer":[1],"explain":"干投啤酒花的主要目的是增加啤酒花香气（挥发性精油）。\n最佳苦啤是英式淡色艾尔，传统上极少干投，\"柔化\"不是干投的目的。","tag":"原题 85","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":85},{"id":"S086","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。以下哪些可能产生奶油味？","options":["布雷塔酵母（Brettanomyces）","乳酸杆菌（Lactobacillus）","异戊酸（Isovaleric acid）","乳酸球菌（Pediococcus）","酵母营养剂（Yeast nutrient）"],"answer":[1,3],"explain":"奶油味（buttery） 对应双乙酰（diacetyl）。\nB（乳酸杆菌）正确。 某些菌株可产生双乙酰。\nD（乳酸球菌）正确。 Pediococcus 是双乙酰的主要微生物来源之一。\nA（Brettanomyces）产生酚类/酯类，非奶油味；C（异戊酸）赋予汗臭/奶酪味；E（酵母营养剂）本\n身不产生风味。","tag":"原题 86","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":86},{"id":"S087","cat":"酿造原料与工艺","type":"single","stem":"通常在谷物糖化（Cereal Mash）中加入少量麦芽。以下哪种麦芽是最佳选择？","options":["六排芽麦大麦","两排芽麦大麦","水晶麦芽","慕尼黑麦芽","黑色专利麦芽"],"answer":[0],"explain":"谷物糖化需要加入的麦芽应具有高酶活力（高 diastatic power）。\n六排大麦芽（six-row malt） 的酶活力最高，是最佳选择。\n水晶麦芽/慕尼黑麦芽/黑色专利麦芽酶活力低或无。","tag":"原题 87","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":87},{"id":"S088","cat":"啤酒风格与比较","type":"tf","stem":"帝国烈性黑啤（Imperial Stout）除了烘烤味外，还能展现特色谷物风味。","options":["正确","错误"],"answer":[0],"explain":"帝国烈性黑啤（BJCP 20C） 的风味复杂，除了烘烤特征外，还要求展现特色谷物风味，如深色水晶麦\n芽的焦糖/太妃糖、巧克力麦芽的坚果/可可等。","tag":"原题 88","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":88},{"id":"S089","cat":"啤酒风格与比较","type":"tf","stem":"英式大麦酒（English Barleywine）的香气绝不应表现出啤酒花特征。","options":["正确","错误"],"answer":[1],"explain":"英式大麦酒（BJCP 19B） 的香气中允许并期望有中等至中低的啤酒花特征。\n\"绝不应\"是绝对化错误表述。","tag":"原题 89","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":89},{"id":"S090","cat":"BJCP评审与制度","type":"tf","stem":"评委评论不得包含\"如果你用了……\"（\"If you used...\"）之类的措辞。","options":["正确","错误"],"answer":[1],"explain":"使用\"如果你用了……\"句式是允许且常被鼓励的，因为给出可操作的改进建议符合建设性反馈原则。\n禁止的是武断、人身攻击、非建设性的评论。","tag":"原题 90","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":90},{"id":"S091","cat":"啤酒风格与比较","type":"tf","stem":"丁香味是一种与酯类相关的风味或香气。","options":["正确","错误"],"answer":[1],"explain":"丁香味（clove-like） 来源于 4-乙烯基愈创木酚，属于酚类（phenolic） 化合物。\n酯类对应的是香蕉味（乙酸异戊酯）。","tag":"原题 91","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":91},{"id":"S092","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。守护啤酒（Steam Beer，即加州普通啤酒）和加州普通啤酒（California Common）有哪些相似特征？","options":["中等水果风味","霉味","木质感、薄荷味啤酒花风味","中等烘烤麦芽香气","轻微浑浊"],"answer":[0,2],"explain":"加州普通啤酒（BJCP 19A） 特征：\nA（中等水果风味）正确。 允许中低至中等果酯。\nC（木质感/薄荷味酒花）正确。 使用美式酒花（北酿等），木质/薄荷特征。\nB（霉味）缺陷；D（烘烤麦芽）不属于该风格；E（浑浊）应为清澈。","tag":"原题 92","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":92},{"id":"S093","cat":"啤酒风格与比较","type":"tf","stem":"首煮啤酒花（First Wort Hopping）带来的苦味通常被描述为更顺滑、更愉悦。","options":["正确","错误"],"answer":[0],"explain":"首煮啤酒花（FWH） 是麦汁收集前将酒花加入煮沸锅，随麦汁缓慢升温。\n苦味更圆润、顺滑（smoother），已获感官研究证实。","tag":"原题 93","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":93},{"id":"S094","cat":"感官与异味","type":"tf","stem":"高级醇的感知令人愉悦，常为啤酒增添复杂性。","options":["正确","错误"],"answer":[1],"explain":"高级醇在低浓度下可贡献复杂香气，但高浓度被感知为溶剂味、辛辣味、刺喉感，通常被视为缺陷。\n\"令人愉悦\"过于绝对化。","tag":"原题 94","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":94},{"id":"S095","cat":"感官与异味","type":"tf","stem":"高温发酵可能导致产生高级醇。","options":["正确","错误"],"answer":[0],"explain":"高温发酵是导致高级醇升高的主要因素之一。\n此外还包括高比重麦汁、低 FAN、低酵母接种率等。","tag":"原题 95","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":95},{"id":"S096","cat":"啤酒风格与比较","type":"tf","stem":"黑啤（Schwarzbier）通常为中干型，展现持久的麦芽和果香酯。","options":["正确","错误"],"answer":[1],"explain":"黑啤（BJCP 8B）收口中干至干爽，此部分正确。\n但果香酯应为极低至极低，\"持久的果香酯\"不准确。","tag":"原题 96","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":96},{"id":"S097","cat":"酿造原料与工艺","type":"tf","stem":"煮沸糖化法（Decoction Mash）还有增加泡沫稳定性的额外好处。","options":["正确","错误"],"answer":[0],"explain":"煮出糖化法煮沸部分醪液，可提高中分子蛋白质（泡沫阳性蛋白）的比例，从而增强泡沫稳定性。","tag":"原题 97","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":97},{"id":"S098","cat":"啤酒风格与比较","type":"single","stem":"美式棕色艾尔（American Brown Ale）配方中可使用的适当麦芽包括：","options":["维也纳和/或慕尼黑","浅色、巧克力、饼干和水晶","浅色、卡拉法和维也纳麦芽","皮尔森麦芽和浅色水晶麦芽","浅色和黑色专利麦芽"],"answer":[1],"explain":"美式棕色艾尔（BJCP 19B） 典型麦芽组合：浅色麦芽（基础）+ 巧克力麦芽（烘烤/可可）+ 饼干麦芽\n（坚果/烤面包）+ 水晶麦芽（焦糖/太妃糖）。\nA（维也纳+慕尼黑）更适用于德式风格；C 更贴近比利时/德式；E 中黑色专利过重。","tag":"原题 98","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":98},{"id":"S099","cat":"啤酒风格与比较","type":"tf","stem":"传统上，最佳苦啤（Best Bitter）和强烈苦啤（Strong Bitter）使用英国啤酒花。","options":["正确","错误"],"answer":[0],"explain":"两者均为英式淡色艾尔，使用英式啤酒花（金标、法格尔等），特征为泥土、草药、松香。","tag":"原题 99","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":99},{"id":"S100","cat":"啤酒风格与比较","type":"tf","stem":"比利时艾尔中经典的果香酯与发酵温度无关。","options":["正确","错误"],"answer":[1],"explain":"酯类生成高度依赖发酵温度。温度升高（尤其在 18-25°C）会显著增加酯类产量。","tag":"原题 100","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":100},{"id":"S101","cat":"啤酒风格与比较","type":"single","stem":"美式印度淡色艾尔（American IPA）的颜色范围从：","options":["中等金色至深琥珀色","中等金色至浅红琥珀色","黄色至深金色","浅金色至深琥珀色","稻草色到深金色"],"answer":[0],"explain":"美式 IPA（BJCP 21A）颜色为 SRM 6-14，对应中等金色至深琥珀色。","tag":"原题 101","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":101},{"id":"S102","cat":"感官与异味","type":"tf","stem":"由于使用六排大麦芽，国际琥珀拉格（International Amber Lager）中轻微的涩味是可接受的。","options":["正确","错误"],"answer":[1],"explain":"国际琥珀拉格（BJCP 2C） 口感应顺滑、干净。\n六排麦芽可能带来涩味风险，但涩味在任何拉格风格中均被视为缺陷。","tag":"原题 102","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":102},{"id":"S103","cat":"BJCP评审与制度","type":"tf","stem":"在自酿比赛中，管理员（Steward）如果与评委一起品尝啤酒，可以获得 BJCP 评审积分。","options":["正确","错误"],"answer":[1],"explain":"BJCP 评审积分仅授予正式注册的认证评委在正式评审中完成的工作。\n管理员即使品尝，也不计入 BJCP 评审积分。","tag":"原题 103","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":103},{"id":"S104","cat":"啤酒风格与比较","type":"tf","stem":"适度的啤酒花香（Moderate hop aroma）适合美式波特（American Porter）和甜世涛 （Sweet Stout）。","options":["正确","错误"],"answer":[1],"explain":"美式波特（BJCP 20A）：酒花香气中低至中等，适合。\n甜世涛（BJCP 16A）：酒花香气无至低，不适度酒花香。\n因甜世涛不匹配，整体判断为错误。","tag":"原题 104","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":104},{"id":"S105","cat":"啤酒风格与比较","type":"tf","stem":"酿酒师可使用玉米片（Flaked Corn）来降低啤酒的酒体。","options":["正确","错误"],"answer":[0],"explain":"玉米片含有大量淀粉但几乎不含蛋白质和不可发酵糊精。\n使用玉米片可降低麦汁总氮和不可发酵物比例，达到降低酒体的效果。","tag":"原题 105","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":105},{"id":"S106","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。以下哪些是酯类生成的重要贡献者？","options":["使用爱尔兰苔藓","糖化停留温度","煮沸时的投料率","发酵前麦汁曝气程度低","发酵温度"],"answer":[3,4],"explain":"D（低曝气）正确。 低溶氧使酵母应激，酯类产量增加。\nE（发酵温度）正确。 发酵温度是酯类生成的最主要控制因素。\nA（爱尔兰苔藓）是澄清剂；B（糖化温度）影响糖分组成但不直接影响酯类合成；C（酒花投料）不影\n响酯类。","tag":"原题 106","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":106},{"id":"S107","cat":"啤酒风格与比较","type":"tf","stem":"德国淡色出口啤酒（German Helles Exportbier）和德国皮尔森啤酒（German Pils）的香气 中都可能带有轻微的硫磺味。","options":["正确","错误"],"answer":[0],"explain":"两者均为德式淡色拉格，BJCP 指南允许微量的硫磺味（sulfury），来自拉格酵母低温发酵产生的硫化\n物。","tag":"原题 107","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":107},{"id":"S108","cat":"感官与异味","type":"tf","stem":"黄油味可能由乳酸球菌引起。","options":["正确","错误"],"answer":[0],"explain":"黄油味对应双乙酰。\n乳酸球菌（Pediococcus） 是啤酒污染细菌之一，可产生大量 α-乙酰乳酸（双乙酰前体），氧化后形\n成双乙酰。","tag":"原题 108","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":108},{"id":"S109","cat":"酿造原料与工艺","type":"single","stem":"三次煮沸糖化（Triple Decoction）的糖化结束阶段，哪种酶最为活跃？","options":["全部正在被失活","α-淀粉酶","植酸酶","蛋白酶","β-淀粉酶"],"answer":[1],"explain":"三次煮沸糖化的最终糖化温度为 70-73°C，此温度区间 α-淀粉酶最为活跃。\nβ-淀粉酶在此温度已部分失活；蛋白酶和植酸酶早已失活。","tag":"原题 109","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":109},{"id":"S110","cat":"啤酒风格与比较","type":"tf","stem":"捷克高级淡色拉格（Czech Premium Pale Lager）的香气可能来自啤酒花的花香或辛香。","options":["正确","错误"],"answer":[0],"explain":"捷克高级淡色拉格（BJCP 3B） 使用捷克贵族酒花（Saaz），香气特征为花香、辛香、草药。","tag":"原题 110","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":110},{"id":"S111","cat":"酿造原料与工艺","type":"tf","stem":"为了避免雪利酒风味，酿酒师应尽量防止热破碎物（Hot Break）进入发酵罐。","options":["正确","错误"],"answer":[1],"explain":"雪利酒风味是氧化的产物，与热破碎物无直接因果关系。\n防止氧化的根本措施是减少氧气暴露、冷储等。","tag":"原题 111","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":111},{"id":"S112","cat":"啤酒风格与比较","type":"single","stem":"选择爱尔兰世涛（Irish Stout）和外国特浓世涛（Foreign Extra Stout）口感中的共同元素。","options":["显著的酒精感","使用烘烤麦芽带来的中到高涩味","中等饱满到饱满的酒体","低至中等的二乙酰含量","顺滑，奶油质感"],"answer":[4],"explain":"两者均以顺滑（smooth）、奶油般（creamy） 的口感和泡沫质感为共同标志性特征。\nA（酒精感）：爱尔兰世涛无，外国特浓有；B（涩味）两者均应低；C（酒体）前者中低，后者中等至\n饱满；D（二乙酰）两者均应极低。","tag":"原题 112","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":112},{"id":"S113","cat":"啤酒风格与比较","type":"single","stem":"深色博克（Dark Bock）和双倍博克（Doppelbock）的主要区别是什么？","options":["双倍博克的原始比重通常较高","双倍博克的香气中可能存在深色水果酯，而深色博克则没有","双倍博克可使用深度烘焙麦芽进行颜色调整","双倍博克的风味和香气中含有美拉德反应产物，但深色博克中没有","双倍博克传统上采用煮出糖化法和长时间煮沸，但深色博克则不然"],"answer":[0],"explain":"深色博克 OG 1.064-1.072；双倍博克 OG 1.072-1.112。\n核心区别是 OG/酒精度：双倍博克显著更高。\nB/C/D/E 均为错误或不成立的区别。","tag":"原题 113","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":113},{"id":"S114","cat":"感官与异味","type":"multi","stem":"以下哪些因素可能在调制啤酒（Spiced Beer）中产生酚类风味？","options":["杏仁提取物","白葡萄酒","漱口水","USP 乳酸","乙醇"],"answer":[0,2],"explain":"A（杏仁提取物）正确。 含苯甲醛及相关酚类衍生物，可产生杏仁/樱桃类酚味。\nC（漱口水）正确。 含氯酚类化合物（三氯生等），可产生药味/创可贴酚味。\nB（白葡萄酒）不产生酚类；D（USP 乳酸）产生酸味；E（乙醇）无酚类风味。","tag":"原题 114","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":114},{"id":"S115","cat":"啤酒风格与比较","type":"single","stem":"淡色博克（Helles Bock）和深色博克（Dark Bock）的相似之处是：","options":["两种风格均使用顶层发酵酵母","两者的香气中都可能有低水平的果香酯","两种风格的酒精度均不得超过 6%","这两种风格传统上在五月酿造","这两种风格均起源于库尔姆巴赫"],"answer":[1],"explain":"两者均为德式博克风格拉格，酯类应为低至中低。\nA 错误：两者均为拉格（底部发酵）；C 错误：两者均超过 6%；D 错误：仅五月博克有此关联；E 错误：\n博克起源于 Einbeck。","tag":"原题 115","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":115},{"id":"S116","cat":"啤酒风格与比较","type":"single","stem":"捷克高级淡色拉格（Czech Premium Pale Lager）的风味特征最不准确的描述是：","options":["花香啤酒花风味和圆润的苦味，伴有复杂的麦芽基底","辛辣的啤酒花风味，低二乙酰，口感清脆","柑橘啤酒花与谷物麦芽的均衡搭配，二乙酰含量低","轻微麦芽甜味，辛辣的啤酒花风味，顺滑但明显的苦味","中等浓郁的面包麦芽，平衡的啤酒花苦味"],"answer":[2],"explain":"\"柑橘（citrus）\" 啤酒花是美式酒花的特征，而非捷克贵族酒花。\n捷克高级淡色拉格不应有柑橘/热带水果酒花特征，此描述更适用于美式淡色拉格。","tag":"原题 116","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":116},{"id":"S117","cat":"啤酒风格与比较","type":"tf","stem":"英式波特（English Porter）可能带有干燥深色水果酯，如葡萄干和李子。","options":["正确","错误"],"answer":[0],"explain":"英式波特（BJCP 15A） 的香气中包括深色水果酯（葡萄干、李子），来自英式艾尔酵母代谢。","tag":"原题 117","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":117},{"id":"S118","cat":"啤酒风格与比较","type":"single","stem":"爱尔兰世涛（Irish Stout）和外国特浓世涛（Foreign Extra Stout）的共同特征是：","options":["低至中等的啤酒花苦味","轻微的二乙酰风味","轻微酒精暖感","风味和香气中带有咖啡和巧克力特征","使用辅料和糖来提高比重"],"answer":[3],"explain":"两者均具有明显的咖啡和巧克力风味，来自烘烤大麦和深色麦芽。\nA（苦度）不完全匹配；B（二乙酰）两者均应极低；C（酒精暖感）爱尔兰世涛无；E（辅料）两者均\n不以辅料为典型。","tag":"原题 118","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":118},{"id":"S119","cat":"BJCP评审与制度","type":"tf","stem":"对\"有问题\"啤酒评分的礼貌下限是 13 分。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】礼貌最低分规定待核\nBJCP 评分表中，13 分是官方认可的最低礼貌评分（minimum courtesy score）。","tag":"原题 119","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"礼貌最低分规定待核","sourceNo":119},{"id":"S120","cat":"啤酒风格与比较","type":"single","stem":"以下哪项特征适用于小麦啤酒（Weissbier）和美式小麦啤酒（American Wheat Beer）？","options":["低二乙酰","香蕉","丁香","泡泡糖","谷物味的小麦特征"],"answer":[4],"explain":"两者均以小麦为主要谷物，共同具有谷物味/小麦特征（grainy wheat character）。\nB（香蕉）和 C（丁香）仅适用于德式小麦；D（泡泡糖）非共同特征；A 虽是共同点但\"低二乙酰\"是大\n多数风格的基本要求，非独特共同特征。","tag":"原题 120","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":120},{"id":"S121","cat":"BJCP评审与制度","type":"tf","stem":"评审后可将有异味的样品从评审桌上移除。","options":["正确","错误"],"answer":[0],"explain":"在 BJCP 比赛评审过程中，如果某样品存在严重异味（如药味、醋酸、霉味等），且已对同组其他评委\n造成干扰，首席评委或评委有权将其从评审桌上移除。\n移除后应注明原因（如“样品污染”或“严重缺陷”），并在评分表上记录相应扣分。","tag":"原题 121","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":121},{"id":"S122","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。以下哪些术语可用于描述含有高水平乙醛的啤酒？","options":["青苹果","奶油味","丁香","纸质感","香蕉"],"answer":[0,3],"explain":"A（青苹果）正确。 乙醛的典型特征描述，BJCP 考试中的经典对应关系。\nD（纸质感）正确。 乙醛作为氧化老化链的中间产物，在长期陈酿后可与氧化醛类（如 E-2-壬烯醛）共\n同描述为纸板/老化风味，考试中常将乙醛与氧化风味家族关联。\nB（奶油味）对应双乙酰；C（丁香）对应酚类；E（香蕉）对应酯类。","tag":"原题 122","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":122},{"id":"S123","cat":"啤酒风格与比较","type":"single","stem":"雪利酒风味通常与以下相关：","options":["二乙酰","涩味","二甲基硫（DMS）","酸味","氧化"],"answer":[4],"explain":"雪利酒风味（sherry-like） 是啤酒氧化的典型表现，由醛类（糠醛、E-2-壬烯醛）在接触氧气后生成。\nA（二乙酰）→奶油/黄油；B（涩味）→多酚/单宁；C（DMS）→煮玉米；D（酸味）→有机酸/细菌污\n染。","tag":"原题 123","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":123},{"id":"S124","cat":"啤酒风格与比较","type":"single","stem":"辛辣或丁香香味通常与以下有关：","options":["二甲基硫（DMS）","氧化","酚类化合物","酸味","二乙酰"],"answer":[2],"explain":"丁香香味（clove-like） 由 4-乙烯基愈创木酚（4-vinylguaiacol） 产生，属于酚类化合物\n（phenolic compounds）。\nDMS→煮玉米；氧化→纸板/雪利酒；酸味→有机酸；二乙酰→奶油/黄油。","tag":"原题 124","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":124},{"id":"S125","cat":"啤酒风格与比较","type":"tf","stem":"英式棕色艾尔（English Brown Ale）应在香气、风味或口感中表现出一定的酒精特征。","options":["正确","错误"],"answer":[1],"explain":"英式棕色艾尔（BJCP 13B） 的 ABV 为 4.2%-5.4%，属于中等酒精度风格。\nBJCP 指南中不要求酒精特征（alcoholic character），酒精暖感在该酒精度下极不明显。","tag":"原题 125","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":125},{"id":"S126","cat":"感官与异味","type":"single","stem":"燕麦世涛（Oatmeal Stout）的啤酒花、酯类及次级香气最佳描述为：","options":["低啤酒花，中高酯类，酒精味明显","中等柑橘啤酒花，低到中等果香","低泥土味啤酒花，中低酯类，低到中等二乙酰","低花香啤酒花，中等酯类，低二乙酰","无啤酒花，适中偏高的深色水果酯，带有葡萄酒香气"],"answer":[2],"explain":"燕麦世涛（BJCP 16B） 特征：\n啤酒花香气：低（low），通常为泥土味（earthy）。\n酯类：中低至中等（low to moderate），柔和。\n二乙酰：低至中等（low to moderate），来自英式酵母。\nA 中酯类过高；B 柑橘酒花为美式特征；D 酯类中等偏高；E 无酒花且深色水果酯非该风格典型。","tag":"原题 126","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":126},{"id":"S127","cat":"啤酒风格与比较","type":"single","stem":"比利时双料啤酒（Belgian Dubbel）的国际苦味单位（IBU）范围为：","options":["25 到 35","20 到 30","10 到 20","15 到 25","20 到 40"],"answer":[3],"explain":"比利时双料（BJCP 26B） 的 IBU 范围为 15-25。\n苦度仅用于平衡麦芽甜味，不应突出。","tag":"原题 127","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":127},{"id":"S128","cat":"啤酒风格与比较","type":"single","stem":"外国特浓世涛（Foreign Extra Stout）的平衡最佳描述为：","options":["显著的烘烤麦芽特征，中到高的啤酒花苦味和低酒精暖感","持久的烘烤麦芽特征，低至中等的果味，余味带有持久的甜味","烘烤深度，果味从低到强烈，啤酒花风味和苦味中等至高","以麦芽为主导，果味低，啤酒花风味和苦味低，口感略带奶油感","低至中等的麦芽甜味，带有太妃糖和焦糖香气，平衡中高的苦味"],"answer":[2],"explain":"外国特浓世涛（BJCP 16D） 特征：\n烘烤麦芽深度明显。\n果酯：从低到强烈（low to high）。\n啤酒花风味和苦味：中等至高（moderate to high）。\nA（酒精暖感应明显而非低）；B（余味不应持久甜味）；D（苦味应为中高）；E（甜味应中等偏高，\n且太妃糖/焦糖非烘烤世涛典型）。","tag":"原题 128","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":128},{"id":"S129","cat":"BJCP评审与制度","type":"tf","stem":"如果啤酒未在适当温度下供应，评委应与比赛工作人员合作解决问题。","options":["正确","错误"],"answer":[0],"explain":"侍酒温度直接影响香气和风味的感知。\nBJCP 比赛规程要求评委发现样品温度异常时，应立即与比赛工作人员沟通请求调整。","tag":"原题 129","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":129},{"id":"S130","cat":"啤酒风格与比较","type":"tf","stem":"啤酒花的苦味不应主导金色艾尔（Blonde Ale）的风味。","options":["正确","错误"],"answer":[0],"explain":"金色艾尔（BJCP 18A） 是易饮、平衡的风格，以麦芽甜味为主导。\n苦度（IBU 15-28）仅用于平衡麦芽甜味，不应主导（should not dominate）。","tag":"原题 130","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":130},{"id":"S131","cat":"啤酒风格与比较","type":"tf","stem":"柔和的麦芽复杂度通常是维也纳拉格（Vienna Lager）的第一味觉印象。","options":["正确","错误"],"answer":[0],"explain":"维也纳拉格（BJCP 7A） 以柔和的麦芽复杂度（soft malt complexity） 为核心特征，表现为烤面包、\n轻微焦糖、坚果等。\n麦芽始终是第一味觉印象。","tag":"原题 131","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":131},{"id":"S132","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 大师级评委（Master Judge）必须在笔试和品鉴考试中综合得分至少达到 90%，并获得 至少 50 点经验值，其中至少一半来自评审工作。","options":["正确","错误"],"answer":[0],"explain":"【答案尚待核验】BJCP等级积分要求待更新\nBJCP 大师级（Master） 要求：\n品鉴考试 ≥ 90%\n书面考试 ≥ 90%\n经验积分 ≥ 50（其中至少一半来自评审活动）\n该陈述完全符合 BJCP 官方晋级标准。","tag":"原题 132","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"BJCP等级积分要求待更新","sourceNo":132},{"id":"S133","cat":"啤酒风格与比较","type":"single","stem":"小麦啤酒（Weissbier）的原始比重范围是：","options":["1.035 到 1.045","1.040 到 1.050","1.044 到 1.053","1.050 到 1.060","1.048 到 1.058"],"answer":[2],"explain":"德式小麦啤酒（BJCP 10A） 的 OG 范围为 1.044-1.053。\nA（过低）；B（下限偏低）；D（过高，更像小麦博克）；E（上下限均偏高）。","tag":"原题 133","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":133},{"id":"S134","cat":"啤酒风格与比较","type":"single","stem":"发酵度（Attenuation）是对以下的测量：","options":["酵母的耐酒精能力","酵母产生的二氧化碳水平","麦汁比重的降低","酵母产生的酯类数量","啤酒的清澈度"],"answer":[2],"explain":"发酵度（attenuation） 是衡量酵母将麦汁中可发酵糖转化为酒精和二氧化碳的程度，以 OG 与 FG 的\n差值占 OG 的比例表示。\n即：麦汁比重的降低。","tag":"原题 134","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":134},{"id":"S135","cat":"感官与异味","type":"tf","stem":"在深色淡啤（Dark Mild）中，极低水平的二乙酰是可接受的。","options":["正确","错误"],"answer":[0],"explain":"深色淡啤（BJCP 13A） 是低酒精度英式艾尔，允许极低水平的二乙酰（very low diacetyl），表现\n为轻微的奶油/太妃糖特征，且不视为缺陷。","tag":"原题 135","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":135},{"id":"S136","cat":"BJCP评审与制度","type":"tf","stem":"经验丰富的评委平均应能在 10 分钟内完成对啤酒的全面评估并达成共识。","options":["正确","错误"],"answer":[1],"explain":"BJCP 比赛评审中，每款啤酒的完整评审流程通常需要 10-15 分钟。\n达成共识的讨论时间因样品复杂度和小组分歧而异，平均 10 分钟内完成并达成共识不现实。","tag":"原题 136","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":136},{"id":"S137","cat":"酿造原料与工艺","type":"tf","stem":"高度改良的麦芽（Highly modified malt）适合用煮沸糖化法（Decoction Mash）。","options":["正确","错误"],"answer":[1],"explain":"煮出糖化法传统上用于改良不足（under-modified） 的麦芽。\n高度改良麦芽不需要煮出法，使用煮出法反而可能导致过度分解、泡沫稳定性下降、酒体过薄。\n高度改良麦芽更适合单步浸泡糖化。","tag":"原题 137","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":137},{"id":"S138","cat":"啤酒风格与比较","type":"single","stem":"以下哪项特征不适合慕尼黑淡色拉格（Munich Helles）？","options":["中等酒体","低苦味","高碳酸化","麦芽味收尾","中低程度的辛辣啤酒花香气"],"answer":[2],"explain":"慕尼黑淡色（BJCP 4A） 碳酸化为中等（medium），而非高（high）。\nA（酒体中等）正确；B（IBU 16-25 低苦味）正确；D（麦芽味收尾）正确；E（低至中低辛辣酒花\n香）正确。","tag":"原题 138","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":138},{"id":"S139","cat":"啤酒风格与比较","type":"tf","stem":"如果啤酒出现\"喷涌\"现象或有感染味，要求第二瓶样品以确保公平准确的评判是可以接受的。","options":["正确","错误"],"answer":[0],"explain":"若样品出现喷涌（gushing） 或明显感染味，评委有权要求提供第二瓶样品进行复核。\n旨在排除偶然性污染（运输不当、瓶口污染等），保证评判的公平性和准确性。","tag":"原题 139","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":139},{"id":"S140","cat":"酿造原料与工艺","type":"tf","stem":"煮沸糖化（Cereal Mash，即谷物糖化）在糖化辅料时能更完全地分解淀粉。","options":["正确","错误"],"answer":[0],"explain":"谷物糖化（Cereal Mash） 是将未发芽辅料谷物与少量麦芽混合加热至沸腾，使淀粉胶化\n（gelatinization）。\n未经胶化的辅料淀粉在常规糖化温度下无法充分糊化，谷物糖化可确保辅料淀粉的完全分解。","tag":"原题 140","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":140},{"id":"S141","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。捷克高级淡色拉格（Czech Premium Pale Lager）与美式拉格 （American Lager）的不同之处在于：","options":["它们具有明显的圆润苦味","它们传统上使用摩拉维亚麦芽大麦酿造","它们的酒体较轻","它们的酒精含量可能较高","它们具有复杂的麦芽风味"],"answer":[0,1,3,4],"explain":"A（明显圆润苦味）正确。 捷克 IBU 30-45，美式 8-18。\nB（摩拉维亚麦芽）正确。 捷克传统使用摩拉维亚麦芽。\nC（酒体较轻）错误。 捷克拉格酒体更饱满，美式更轻。\nD（酒精含量可能较高）正确。 捷克 ABV 4.2%-5.8%，美式 4.2%-5.3%。\nE（复杂麦芽风味）正确。 捷克麦芽特征复杂，美式简单。","tag":"原题 141","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":141},{"id":"S142","cat":"啤酒风格与比较","type":"tf","stem":"经典比利时深色烈性艾尔（Belgian Dark Strong Ale）可具有中等酒体和高碳酸度。","options":["正确","错误"],"answer":[0],"explain":"比利时深色烈性艾尔（BJCP 26D） 酒体为中等至饱满，碳酸化为中等至高。\n\"中等酒体+高碳酸化\"在风格允许范围内。","tag":"原题 142","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":142},{"id":"S143","cat":"感官与异味","type":"single","stem":"你品尝到一款具有明显青苹果香气的啤酒。最合适的反馈是什么，以帮助酿酒师纠正这个问题？","options":["在酿造水中添加一些石膏","让啤酒在酵母上陈酿更长时间","降低糖化温度","监控冲洗水温度","将山毛榉木屑加入二次发酵罐"],"answer":[1],"explain":"青苹果香气对应乙醛，是酵母发酵不充分或过早分离导致的中间代谢产物积累。\n纠正措施：让啤酒在酵母上陈酿更长时间，使酵母有足够时间将乙醛还原为乙醇。\nA（石膏）影响苦味；C（糖化温度）影响发酵度；D（冲洗水温度）影响涩味；E（山毛榉木屑）不解\n决乙醛。","tag":"原题 143","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":143},{"id":"S144","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。以下哪些陈述描述了美式拉格（American Lager）和捷克高级淡色拉格 （Czech Premium Pale Lager）的相似之处？","options":["两者都可能具有辛辣、花香的啤酒花香气","它们都具有复杂的麦芽风味","它们的 IBU 水平相似","两者颜色均不超过 6 SRM","它们通常都使用辅料"],"answer":[0,3],"explain":"A（都可能具有辛辣/花香酒花）正确。 两者均可使用贵族型酒花。\nD（颜色均≤6 SRM）正确。 美式 SRM 2-6，捷克 3.5-6。\nB 错误：美式麦芽简单；C 错误：IBU 差异大（8-18 vs 30-45）；E 错误：美式用辅料，捷克不用。","tag":"原题 144","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":144},{"id":"S145","cat":"酿造原料与工艺","type":"tf","stem":"乙醛是酵母代谢的副产物。","options":["正确","错误"],"answer":[0],"explain":"乙醛（acetaldehyde） 是酵母在乙醇发酵过程中丙酮酸脱羧生成的关键中间代谢产物。\n是酵母代谢的正常副产物（中间体）。","tag":"原题 145","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":145},{"id":"S146","cat":"啤酒风格与比较","type":"tf","stem":"美式波特啤酒（American Porter）在香气、风味或口感中可能表现出一定的酒精特征。","options":["正确","错误"],"answer":[0],"explain":"美式波特（BJCP 20A） 的 ABV 为 4.8%-6.5%。\n在高 ABV 版本（>6%）中，温和的酒精暖感可能被感知，且不视为缺陷。","tag":"原题 146","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":146},{"id":"S147","cat":"酿造原料与工艺","type":"tf","stem":"慕尼黑淡色啤酒（Munich Helles）和科隆啤酒（Kölsch）通常具有中等碳酸化程度。","options":["正确","错误"],"answer":[0],"explain":"慕尼黑淡色（BJCP 4A）：碳酸化为中等（medium）。\n科隆啤酒（BJCP 5B）：碳酸化为中高（medium-high）。\n两者均以中等为基础范围。","tag":"原题 147","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":147},{"id":"S148","cat":"啤酒风格与比较","type":"single","stem":"以下哪项是有时与苏格兰艾尔酵母相关的酚类特征？","options":["烟熏味","类似香草","奶油味","丁香样","煮熟的玉米"],"answer":[0],"explain":"苏格兰艾尔的酵母菌株可产生极轻微的烟熏特征（smoky/peaty），来自特殊麦芽或酵母代谢的酚类\n产物。\nB（香草）更常见于桶陈；C（奶油）对应二乙酰；D（丁香）对应德式小麦；E（煮玉米）对应 DMS。","tag":"原题 148","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":148},{"id":"S149","cat":"酿造原料与工艺","type":"single","stem":"哪种酵母菌株能在成品啤酒中产生酸味？","options":["布鲁塞尔酵母菌（Brettanomyces bruxellensis）","酿酒酵母（Saccharomyces cerevisiae）","魏斯斯特凡纳（Weihenstephan，德式小麦酵母）","卡尔斯伯格酵母（Carlsbergensis，拉格酵母）","葡萄糖酵母（Saccharomyces uvarum）"],"answer":[0],"explain":"【答案尚待核验】微生物学名与译名混乱\nBrettanomyces（酒香酵母） 是唯一能产生明显有机酸（乙酸、乳酸） 的选项。\nB/C/D/E 均为酿酒酵母属，正常条件下不产酸。","tag":"原题 149","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"微生物学名与译名混乱","sourceNo":149},{"id":"S150","cat":"感官与异味","type":"single","stem":"为减少啤酒中的奶油味（二乙酰），你可以建议酿酒师采取以下哪项措施：","options":["彻底消毒所有设备，尤其是在装瓶时","在较高温度下糖化","确保糖化液的 pH 值为 5.2","在较低温度糖化","煮沸麦汁超过 90 分钟"],"answer":[0],"explain":"奶油味对应二乙酰，可由细菌污染（Pediococcus） 引起。\nA（彻底消毒）正确。 防止产二乙酰细菌进入成品啤酒，是最直接普遍适用的纠正措施。\nB/D（糖化温度）影响发酵度；C（pH）影响单宁萃取；E（煮沸时间）影响苦度和 DMS，不影响二乙\n酰。","tag":"原题 150","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":150},{"id":"S151","cat":"啤酒风格与比较","type":"tf","stem":"热带世涛（Tropical Stout）和燕麦世涛（Oatmeal Stout）在 5.5%酒精度时均适宜。","options":["正确","错误"],"answer":[0],"explain":"热带世涛（BJCP 16C）：ABV 5.0%-7.0%，5.5%合适。\n燕麦世涛（BJCP 16B）：ABV 4.2%-5.9%，5.5%合适。","tag":"原题 151","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":151},{"id":"S152","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。美式淡色艾尔（American Pale Ale）中的果味酯受以下因素影响：","options":["水中的矿物质","瓶内二次发酵","酵母","发酵温度","啤酒花"],"answer":[2,3],"explain":"C（酵母）正确。 菌株选择是酯类生成的首要决定因素。\nD（发酵温度）正确。 温度是酯类生成的主要控制变量。\nA（矿物质）影响感知而非合成；B（瓶内二次发酵）主要产生 CO₂；E（啤酒花）不参与酯类合成。","tag":"原题 152","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":152},{"id":"S153","cat":"啤酒风格与比较","type":"single","stem":"经典美式大麦酒（American Barleywine）中啤酒花风味的最佳描述是：","options":["辛辣和/或花香","树脂味和辛辣味","花香和/或泥土香","柑橘味、树脂味、花香","泥土味、辛辣味和/或花香"],"answer":[3],"explain":"美式大麦酒（BJCP 22C） 使用美式啤酒花，特征为柑橘、树脂、花香。\nA/C/E 更接近英式酒花特征；B 不完全。","tag":"原题 153","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":153},{"id":"S154","cat":"BJCP评审与制度","type":"tf","stem":"评委的评论需要提供如何改进参赛作品的信息（如有必要）。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评分表的评论部分核心目的是建设性反馈（constructive feedback）。\n评委有义务指出缺陷并提出可操作的改进建议。","tag":"原题 154","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":154},{"id":"S155","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。比利时淡色艾尔（Belgian Pale Ale）在哪些方面与强烈苦啤（Strong Bitter）不同？","options":["比利时淡色艾尔可以使用维也纳和慕尼黑麦芽","比利时淡色艾尔可以使用萨兹啤酒花","比利时淡色艾尔可能带有轻微的胡椒味","比利时淡色艾尔可能碳酸化较低","比利时淡色艾尔可能含有低水平的二乙酰"],"answer":[0,1,2],"explain":"A（维也纳/慕尼黑麦芽）正确。 比利时淡色艾尔常用增加麦芽深度；强烈苦啤以英式淡色+水晶为主。\nB（萨兹酒花）正确。 比利时淡色艾尔使用欧洲大陆/英式酒花。\nC（轻微胡椒味）正确。 比利时酵母产生酚类（胡椒/辛香）；英式酵母以果酯/二乙酰为特征。\nD 错误：比利时淡色碳酸化中等至高，不低。\nE 错误：比利时淡色艾尔酵母不产生二乙酰（与强烈苦啤不同）。","tag":"原题 155","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":155},{"id":"S156","cat":"酿造原料与工艺","type":"multi","stem":"请选择所有适用项。以下哪些谷物可能需要谷物糖化（Cereal Mash）？","options":["米","片状大麦","玉米","麦芽小麦","麦芽大麦"],"answer":[0,2],"explain":"A（米）正确。 未发芽大米需谷物糖化预处理。\nC（玉米）正确。 未发芽玉米需谷物糖化预处理。\nB（片状大麦）已蒸汽压片胶化；D（麦芽小麦）和 E（麦芽大麦）均已发芽改性，不需要。","tag":"原题 156","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":156},{"id":"S157","cat":"酿造原料与工艺","type":"tf","stem":"黑啤（Schwarzbier）的香气通常带有酵母产生的低水平果香。","options":["正确","错误"],"answer":[1],"explain":"黑啤（BJCP 8B） 为德式深色拉格，果香酯应为无至极低（none to very low）。\n\"通常带有低水平果香\"与 BJCP 指南不符，果酯几乎不可感知。","tag":"原题 157","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":157},{"id":"S158","cat":"酿造原料与工艺","type":"multi","stem":"请选择所有适用项。煮沸糖化（Decoction Mash）产生哪种类型的麦芽风味？","options":["类黄酮","美拉德产物","苦味","酒精味","涩味"],"answer":[1,4],"explain":"B（美拉德产物）正确。 煮出法通过煮沸促进美拉德反应，产生烤面包、坚果、太妃糖等复杂麦芽风味。\nE（涩味）正确。 煮出法煮沸醪液会加剧麦壳中多酚/单宁的萃取，若操作不当（高温+高 pH）可产生\n涩味，是工艺客观可能产生的副产物。\nA（类黄酮）非煮出法特有；C（苦味）来自酒花；D（酒精味）来自发酵。","tag":"原题 158","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":158},{"id":"S159","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。以下哪些特征是美式淡色艾尔（American Pale Ale）和加州普通啤酒 （California Common）共有的？","options":["硫磺味特征","烤麦芽香","轻微果香","青草香气","强烈的啤酒花味"],"answer":[2,4],"explain":"C（轻微果香）正确。 两者均使用艾尔酵母，具有低至中等的果酯。\nE（强烈的啤酒花味）正确。 两者均以明显的啤酒花香气和风味为特征。\nA（硫磺味）更常见于拉格；B（烤麦芽）不属于两者；D（青草气）非风格必需。","tag":"原题 159","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":159},{"id":"S160","cat":"啤酒风格与比较","type":"tf","stem":"美国小麦啤酒（American Wheat Beer）通常比白啤酒（Witbier）具有更多的啤酒花特征。","options":["正确","错误"],"answer":[0],"explain":"美国小麦啤酒（BJCP 24B）：中等至中高美式酒花香气（柑橘/松香）。\n白啤酒（BJCP 24A）：酒花香气无至极低，以香料和麦芽为主导。\n美国小麦啤酒酒花特征明显多于白啤酒。","tag":"原题 160","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":160},{"id":"S161","cat":"酿造原料与工艺","type":"tf","stem":"通过适当选择酵母菌株可以控制理想的酚类物质。","options":["正确","错误"],"answer":[0],"explain":"酚类化合物产生取决于酵母菌株的阿魏酸脱羧酶活性。\n不同菌株（德式小麦 vs 英式/美式艾尔）酚类产量差异显著，可通过菌株选择控制。","tag":"原题 161","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":161},{"id":"S162","cat":"啤酒风格与比较","type":"single","stem":"对于被认为过甜的啤酒酿造者，哪些建议是合适的？","options":["正确消毒所有设备","使用 60 分钟开盖煮沸","提高淀粉转化温度","降低淀粉转化温度","发酵后尽量减少氧气暴露"],"answer":[3],"explain":"过甜（too sweet） 由不可发酵糖过多（高 FG）引起。\nD（降低糖化温度）正确。 低温（62-64°C）促进 β-淀粉酶，产生更多可发酵糖，提高发酵度，降低甜\n度。\nC（提高温度）产生更多不可发酵糊精，增加甜度。","tag":"原题 162","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":162},{"id":"S163","cat":"感官与异味","type":"tf","stem":"用于抑制细菌生长的氯胺（Chloramine）如果未被去除，可能产生异味。","options":["正确","错误"],"answer":[0],"explain":"氯胺与麦汁中的酚类化合物反应生成氯酚（chlorophenols），赋予药味、创可贴、消毒水异味。\n氯胺不易通过煮沸去除，需活性炭或亚硫酸盐处理。","tag":"原题 163","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":163},{"id":"S164","cat":"啤酒风格与比较","type":"single","stem":"美国淡色艾尔（American Pale Ale）和加州普通啤酒（California Common）的一个关键区 别特征是：","options":["酒精度","酯类水平","二乙酰水平","苦味水平","啤酒花特征"],"answer":[4],"explain":"关键区分点是啤酒花特征（hop character）：\n美式淡色艾尔：柑橘、松香、热带水果（中高至高等）。\n加州普通啤酒：木质、薄荷、辛香（中等）。\nA/B/C/D 均有重叠，非关键区分。","tag":"原题 164","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":164},{"id":"S165","cat":"感官与异味","type":"tf","stem":"兰比克啤酒（Lambic）的口感中适合有明显的涩味。","options":["正确","错误"],"answer":[1],"explain":"兰比克（BJCP 23D） 口感描述为顺滑（smooth），无涩味（no astringency）。\n涩味在兰比克中被视为缺陷。","tag":"原题 165","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":165},{"id":"S166","cat":"啤酒风格与比较","type":"single","stem":"以下哪项特征通常不出现在比利时深色烈性艾尔（Belgian Dark Strong Ale）中？","options":["苦味","啤酒花香气","美拉德产物","果香酯","辛辣酚类"],"answer":[1],"explain":"比利时深色烈性艾尔（BJCP 26D） 特征包括：复杂麦芽（美拉德产物）、果香酯、辛辣酚类。\n啤酒花香气为无至极低（none to very low），仅提供苦味。\nB（啤酒花香气）为不出现在该风格中的特征。","tag":"原题 166","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":166},{"id":"S167","cat":"酿造原料与工艺","type":"tf","stem":"拉格啤酒应具有拉格酵母产生的果香酯。","options":["正确","错误"],"answer":[1],"explain":"拉格酵母在低温发酵下酯类产量极低。\n大多数拉格风格酯类为无至极低，\"应具有\"是错误的表述。","tag":"原题 167","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":167},{"id":"S168","cat":"酿造原料与工艺","type":"tf","stem":"由于煮出糖化法（Decoction Mash），慕尼黑深色啤酒（Munich Dunkel）中适度的涩味是 可以接受的。","options":["正确","错误"],"answer":[1],"explain":"【旧编号勘误】慕尼黑深色应为8A，原解析写6A。\n慕尼黑深色啤酒（BJCP 6A） 口感应顺滑、柔和，涩味为缺陷。\n煮出法虽可能增加多酚萃取风险，但涩味在任何拉格风格中均不可接受。","tag":"原题 168","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":168},{"id":"S169","cat":"啤酒风格与比较","type":"tf","stem":"在深色小麦啤酒（Dunkelweizen）中使用锅糖（Kettle Sugar）以加深颜色是可接受的。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】锅糖和麦芽颜色机制存在歧义\n深色小麦啤酒（BJCP 10B） 颜色来自深色小麦麦芽、慕尼黑麦芽、水晶麦芽。\n锅糖颜色极浅，不能用于加深颜色。","tag":"原题 169","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"锅糖和麦芽颜色机制存在歧义","sourceNo":169},{"id":"S170","cat":"BJCP评审与制度","type":"tf","stem":"评委的评论应具有建设性，并反映对酿造、发酵、装瓶和处理过程的了解。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评分表评论要求建设性反馈（constructive feedback），且必须基于酿酒科学，指出缺陷并提\n出可操作改进建议。","tag":"原题 170","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":170},{"id":"S171","cat":"感官与异味","type":"tf","stem":"低酯类水平适合淡色博克（Helles Bock）和双倍博克（Doppelbock）的香气。","options":["正确","错误"],"answer":[0],"explain":"两者均为德式拉格，酯类为低至中低，拉格酵母在低温下产生的酯类极少。","tag":"原题 171","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":171},{"id":"S172","cat":"BJCP评审与制度","type":"tf","stem":"BJCP 大师级评委（Master Judge）必须在笔试和品鉴考试中总分至少达到 90%，并完成高级 大师服务要求。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】BJCP大师等级与服务要求待核\n大师级（Master） 要求考试≥90%+≥50 经验积分。\n\"高级大师服务要求（advanced master service requirements）\" 是特级大师（Grand\nMaster） 的额外要求，不属于大师级。","tag":"原题 172","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"BJCP大师等级与服务要求待核","sourceNo":172},{"id":"S173","cat":"酿造原料与工艺","type":"tf","stem":"苏格兰重色啤酒（Scotch Heavy）因低发酵温度可能有低水平二甲基硫（DMS）。","options":["正确","错误"],"answer":[1],"explain":"苏格兰重色啤酒（BJCP 14B） 使用艾尔酵母在较高发酵温度（18-22°C） 下发酵，非低温。\nDMS 来源是麦芽 SMM 煮沸不足，与发酵温度无直接因果关系。","tag":"原题 173","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":173},{"id":"S174","cat":"啤酒风格与比较","type":"single","stem":"酒精与有机酸结合形成什么化合物？","options":["二甲基硫","二乙胺","泡沫保持力","涩味","一种酯"],"answer":[4],"explain":"酯类（esters） 是醇（alcohol） 与有机酸（organic acid） 通过酯化反应（esterification） 生成\n的化合物。","tag":"原题 174","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":174},{"id":"S175","cat":"啤酒风格与比较","type":"tf","stem":"维也纳拉格（Vienna Lager）应具有柔和的麦芽复杂性和坚定的苦味特征。","options":["正确","错误"],"answer":[1],"explain":"维也纳拉格（BJCP 7A） 以柔和的麦芽复杂性为核心，但苦味为中等偏低至中等，仅用于支撑麦芽特\n征，并非\"坚定的（firm）\"苦味。","tag":"原题 175","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":175},{"id":"S176","cat":"感官与异味","type":"tf","stem":"二乙酰的风味和香气在最佳苦啤（Best Bitter）或烈性苦啤（Strong Bitter）中绝不会出现。","options":["正确","错误"],"answer":[1],"explain":"两者均为英式艾尔，BJCP 指南明确允许低水平（low） 的二乙酰。\n\"绝不会出现\"是绝对化错误表述。","tag":"原题 176","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":176},{"id":"S177","cat":"感官与异味","type":"tf","stem":"由于含有的 S-甲基蛋氨酸（SMM）是浅色麦芽的八倍，皮尔森麦芽最可能产生玉米味（DMS） 香气或风味。","options":["正确","错误"],"answer":[0],"explain":"皮尔森麦芽（Pilsner malt） 的 SMM 含量显著高于其他浅色麦芽（约 5-8 倍），煮沸不充分时最易产\n生 DMS（煮玉米/蔬菜汤味）。","tag":"原题 177","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":177},{"id":"S178","cat":"啤酒风格与比较","type":"tf","stem":"英式印度淡色艾尔（English IPA）的香气通常具有低到中等的果香。","options":["正确","错误"],"answer":[0],"explain":"英式 IPA（BJCP 21B） 使用英式艾尔酵母，典型特征为低至中等的果酯（low to moderate fruity\nesters）。","tag":"原题 178","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":178},{"id":"S179","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。因高酒精度导致泡沫保持力低的风格包括：","options":["英式大麦酒（English Barleywine）","威重型啤酒（Weizenbock）","比利时金色烈性艾尔（Belgian Golden Strong Ale）","强烈苦啤（Strong Bitter）","老艾尔（Old Ale）"],"answer":[0,2,4],"explain":"【答案尚待核验】Weizenbock中文译名不准确\nA（英式大麦酒）正确。 ABV 8.0%-12.0%，高酒精度抑制泡沫。\nC（比利时金色烈性艾尔）正确。 ABV 7.5%-10.5%，泡沫保持力低。\nE（老艾尔）正确。 长时间陈酿+高酒精导致泡沫下降。\nB（Weizenbock）小麦高蛋白提供泡沫稳定性；D（强烈苦啤）ABV 4.6%-6.2%，未达\"高酒精度导致\n泡沫低\"程度。","tag":"原题 179","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"Weizenbock中文译名不准确","sourceNo":179},{"id":"S180","cat":"感官与异味","type":"tf","stem":"双倍博克啤酒（Doppelbock）可能含有低水平的二甲基硫（DMS）。","options":["正确","错误"],"answer":[1],"explain":"双倍博克（BJCP 5C） 使用深色/慕尼黑麦芽为主，SMM 含量较低，且长时间煮沸使 DMS 充分挥发。\nBJCP 指南中该风格香气描述不包含 DMS，DMS 在此风格中应视为缺陷，而非\"可能含有低水平\"的允\n许特征。","tag":"原题 180","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":180},{"id":"S181","cat":"感官与异味","type":"single","stem":"以下哪种原因造成了啤酒中乙醛浓度过高？","options":["糖化时间过长","煮沸时间短","发酵时过早分离酵母","过滤洗槽","投放酵母量不足"],"answer":[2],"explain":"乙醛（acetaldehyde） 是乙醇发酵的中间产物，正常发酵中酵母会将其还原为乙醇。\nC（发酵时过早分离酵母）正确。 过早将啤酒从酵母中分离（冷降/过滤过早）会导致酵母无法完成乙\n醛的还原，使其在成品中积累，产生青苹果味。\nA（糖化时间过长）→影响发酵度/可发酵糖比例；B（煮沸时间短）→DMS 问题；D（过滤洗槽）→涩\n味/单宁萃取；E（投放酵母量不足）→可能产生高级醇/酯类，而非直接导致乙醛。","tag":"原题 181","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":181},{"id":"S182","cat":"啤酒风格与比较","type":"single","stem":"以下关于优质苦啤（Best Bitter）味道最不准确的描述为：","options":["中等偏低的轻烤麦芽味，中等的酒花味带有明显苦味","泥土味的酒花特色，收口偏干发苦","柑橘香味酒花与麦芽谷物味道非常平衡","中等轻烤麦芽味，中到高的酒花苦味","花香味啤酒花，中等酯香味，轻焦香和轻烤麦芽味道"],"answer":[2],"explain":"【答案尚待核验】英式苦啤酒花风味表述过于绝对\n最佳苦啤（BJCP 11B） 使用英式啤酒花（金标、法格尔等），其特征为泥土（earthy）、花香\n（floral）、草药（herbal）。\nC（柑橘香味酒花）错误。 柑橘味是美式酒花（卡斯卡特、奇努克等）的特征，不属于英式苦啤风格。\nA/B/D/E 均为对英式苦啤的准确描述。","tag":"原题 182","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"英式苦啤酒花风味表述过于绝对","sourceNo":182},{"id":"S183","cat":"啤酒风格与比较","type":"single","stem":"科隆啤酒（Kölsch）通常使用哪类酒花作为味道酒花和苦酒花？","options":["贵族酒花","Continental（大陆）","美式酒花","英式酒花","新世界酒花"],"answer":[0],"explain":"科隆啤酒（BJCP 5B） 使用贵族酒花（Noble hops）（如哈勒陶、泰特南、斯帕尔特）作为苦味和风\n味酒花，提供柔和的花香/辛香特征。\n贵族酒花属于大陆酒花的一个子类，但 A 更具体准确。","tag":"原题 183","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":183},{"id":"S184","cat":"BJCP评审与制度","type":"tf","stem":"不应该在评分表上写激进、粗鲁、不礼貌的评语。","options":["正确","错误"],"answer":[0],"explain":"BJCP 评分准则要求评委的评论应具有建设性（constructive）、专业（professional） 和尊重\n（respectful）。\n激进、粗鲁、不礼貌的评语违反裁判道德规范。","tag":"原题 184","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":184},{"id":"S185","cat":"感官与异味","type":"tf","stem":"酿制比利时金色烈性艾尔（Belgian Golden Strong Ale）时应当选用具有酯类和酚类风味特点 的酵母。","options":["正确","错误"],"answer":[0],"explain":"比利时金色烈性艾尔（BJCP 25C） 使用比利时艾尔酵母，其典型特征为果香酯（fruity esters） 和\n辛香酚类（spicy phenolics）。\n这是该风格的必要特征。","tag":"原题 185","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":185},{"id":"S186","cat":"酿造原料与工艺","type":"single","stem":"强烈苦啤（Strong Bitter）的最佳水质特征是：","options":["非常软","伯顿化","高碳酸盐","中等硫酸盐","中等碳酸盐"],"answer":[1],"explain":"【答案尚待核验】传统水质和最佳水质不等同\n强烈苦啤（BJCP 11C） 是英式淡色艾尔，传统使用伯顿化水质（Burtonized water）——高硫酸盐\n（SO₄²⁻）含量，增强啤酒花苦味的锐度和干脆感。\n这是英式苦啤/IPA 风格的水质特征。","tag":"原题 186","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"传统水质和最佳水质不等同","sourceNo":186},{"id":"S187","cat":"酿造原料与工艺","type":"multi","stem":"请选择所有适用项。以下哪些麦汁生产技术可能导致纸板味（纸板味/氧化）？","options":["酸化冲洗水","冲洗过程中使麦芽床暴露于空气中","避免使用蛋白质休止","将冷却的麦汁转移到发酵罐时溅洒","煮沸糖化"],"answer":[1,3],"explain":"纸板味（cardboard/papery） 是氧化的典型表现，由醛类（E-2-壬烯醛）引起，产生于麦汁/啤酒接\n触氧气后。\nB（冲洗过程麦芽床暴露空气）正确。 热麦汁接触氧气会加速氧化反应。\nD（冷却麦汁转移时溅洒）正确。 冷却后麦汁溅洒会引入大量溶解氧，导致后期氧化（纸板味）。\nA（酸化冲洗水）影响 pH 和单宁萃取；C（避免蛋白质休止）影响泡沫和清澈度；E（煮沸糖化）与氧\n化无关。","tag":"原题 187","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":187},{"id":"S188","cat":"BJCP评审与制度","type":"tf","stem":"可以在不获得评审经验积分的情况下获得 BJCP 认证等级。","options":["正确","错误"],"answer":[1],"explain":"BJCP 认证等级（从认证评委到特级大师）均要求经验积分（experience points）。\n即使最初级的认证评委（Certified） 也需通过品鉴考试并获得一定经验积分。","tag":"原题 188","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":188},{"id":"S189","cat":"啤酒风格与比较","type":"tf","stem":"德国淡色出口啤酒（German Helles Exportbier）的啤酒花苦味总是高于德国皮尔森啤酒 （German Pils）。","options":["正确","错误"],"answer":[1],"explain":"德国淡色出口啤酒（BJCP 5A）：IBU 范围为 20-30。\n德国皮尔森（BJCP 5D）：IBU 范围为 30-45。\n德国皮尔森的苦味高于淡色出口啤酒，题目说反了。","tag":"原题 189","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":189},{"id":"S190","cat":"啤酒风格与比较","type":"tf","stem":"加州普通啤酒（California Common）和最佳苦啤（Best Bitter）中酒精香气是合适的，前提 是不令人不快。","options":["正确","错误"],"answer":[1],"explain":"加州普通啤酒（BJCP 19A）：ABV 4.5%-5.5%，不要求酒精香气。\n最佳苦啤（BJCP 11B）：ABV 4.0%-4.9%，不要求酒精香气。\n两者酒精度均较低，酒精香气不应被感知。","tag":"原题 190","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":190},{"id":"S191","cat":"啤酒风格与比较","type":"single","stem":"以下哪些化合物可能赋予啤酒蔬菜味？","options":["乙醛","丁酸","铁","二乙酰","二甲基硫"],"answer":[4],"explain":"二甲基硫（DMS） 的典型风味描述为煮玉米/蔬菜汤/贝壳类。\n乙醛→青苹果；丁酸→呕吐物/腐臭黄油；铁→金属味；二乙酰→奶油/黄油。","tag":"原题 191","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":191},{"id":"S192","cat":"感官与异味","type":"single","stem":"Brettanomyces 是一种常见的酿酒厂污染物，通常被认为会导致啤酒中出现什么异味？","options":["腐败黄油味","青草味","马毯味","青苹果","雪莉酒"],"answer":[2],"explain":"Brettanomyces（酒香酵母） 在啤酒中产生的最典型风味为马毯（horse blanket）、辛香\n（spicy）、酚类（phenolic）、药味（medicinal）。\n在特定风格（兰比克/老艾尔）中这是期望特征，但在其他风格中为污染缺陷。","tag":"原题 192","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":192},{"id":"S193","cat":"感官与异味","type":"tf","stem":"比利时金色强烈艾尔（Belgian Golden Strong Ale）的酵母绝不应产生任何酚类化合物。","options":["正确","错误"],"answer":[1],"explain":"比利时金色烈性艾尔（BJCP 25C） 使用比利时艾尔酵母，其典型特征包括辛香酚类（spicy\nphenolics）（如胡椒/丁香特征）。\n\"绝不应\"是绝对化错误表述。","tag":"原题 193","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":193},{"id":"S194","cat":"BJCP评审与制度","type":"tf","stem":"临时评委（Provisional Judge）在评审比赛作品时，应与有等级的 BJCP 评委搭档。","options":["正确","错误"],"answer":[0],"explain":"BJCP 比赛规程要求：临时评委（Provisional Judge） 必须与认证评委（Certified Judge） 或更高\n级别评委搭档评审。\n这是为了保证评分一致性和质量。","tag":"原题 194","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":194},{"id":"S195","cat":"啤酒风格与比较","type":"single","stem":"以下哪项最能描述一种轻盈体啤酒（Light-bodied beer）？","options":["低粘度","腻味的","有嚼劲","浓稠","浓重的"],"answer":[0],"explain":"酒体（body） 由不可发酵糊精、蛋白质和酒精决定，轻盈体（light-bodied）的典型描述为低粘度\n（low viscosity）、水感、薄。\nB（腻味的）描述甜/厚重感；C（有嚼劲）描述饱满酒体；D（浓稠）描述厚重酒体；E（浓重）描述饱\n满酒体。","tag":"原题 195","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":195},{"id":"S196","cat":"感官与异味","type":"multi","stem":"小麦啤酒（Weissbier）的酯类特征可以包括：","options":["雪莉酒风味","丁香和香草","面包香气，丰富的风味","香蕉","烘烤味和略带烟熏味"],"answer":[2,3],"explain":"德式小麦啤酒（BJCP 10A） 的典型酯类特征为香蕉（banana，乙酸异戊酯），以及面包香气\n（bread aroma） 和丰富的小麦风味。\nA（雪莉酒）→氧化；B（丁香）→酚类，非酯类；E（烘烤/烟熏）→深色麦芽或酚类特征，不属于基\n本小麦啤酒酯类。","tag":"原题 196","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":196},{"id":"S197","cat":"啤酒风格与比较","type":"tf","stem":"英式波特啤酒（English Porter）有时被认为是瓶装版的深色淡啤（Dark Mild）。","options":["正确","错误"],"answer":[0],"explain":"从历史角度看，英式波特（BJCP 15A） 确实是深色淡啤（Dark Mild，BJCP 13A） 的瓶装/烈性版延\n伸。\n两者共享英式艾尔酵母、深色麦芽特征，但波特酒精度和风味强度更高。","tag":"原题 197","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":197},{"id":"S198","cat":"BJCP评审与制度","type":"tf","stem":"只要有宜人的香气，早晨的咖啡可以带到评审桌上。","options":["正确","错误"],"answer":[1],"explain":"BJCP 比赛评审桌严禁携带任何食物或饮品（除用于清洁味蕾的饮用水和面包/苏打饼干外）。\n咖啡的强烈香气会干扰感官评审，即使香气宜人也不允许。","tag":"原题 198","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":198},{"id":"S199","cat":"啤酒风格与比较","type":"multi","stem":"请选择所有适用项。与美式波特（American Porter）相比，英式波特（English Porter）：","options":["具有更多的啤酒花特征","通常更具烘烤味","通常更柔和且更甜","有时使用拉格酵母酿造","通常酒精含量较低"],"answer":[2,4],"explain":"英式波特（BJCP 15A） vs 美式波特（BJCP 20A）：\nA（更多啤酒花特征）错误。 美式波特使用美式酒花，啤酒花香气更突出。\nB（更具烘烤味）错误。 两者烘烤特征相近，英式波特更强调巧克力/焦糖。\nC（更柔和且更甜）正确。 英式波特更强调柔和、焦糖/太妃糖甜味。\nD（使用拉格酵母）错误。 两者均为艾尔酵母。\nE（酒精含量较低）正确。 英式波特 ABV 4.0%-5.4%，美式波特 4.8%-6.5%。","tag":"原题 199","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":199},{"id":"S200","cat":"啤酒风格与比较","type":"tf","stem":"烘烤大麦（Roasted Barley）是苏格兰重啤（Scotch Heavy）的可接受原料。","options":["正确","错误"],"answer":[1],"explain":"苏格兰重啤（BJCP 14B） 的深色来自烘烤麦芽（roasted malt） 或水晶麦芽，而非烘烤大麦\n（roasted barley）。\n烘烤大麦是世涛（Stout） 的典型原料，在苏格兰艾尔中不是传统成分。","tag":"原题 200","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":200},{"id":"S201","cat":"啤酒风格与比较","type":"single","stem":"普通苦啤（Ordinary Bitter）的口感特征最佳描述为：","options":["中等酒体和高碳酸化","酒体轻盈且碳酸度高","中轻酒体，低碳酸","中等酒体和中等碳酸化","中等偏饱满的酒体和中等碳酸化"],"answer":[3],"explain":"普通苦啤（BJCP 11A） 的酒体为中等（medium），碳酸化为中等（medium）。\n因英式木桶版（cask-conditioned）碳酸化通常较低，但瓶装版为中等。","tag":"原题 201","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":201},{"id":"S202","cat":"啤酒风格与比较","type":"single","stem":"经典深色博克（Dark Bock）中的深色水果特征源于：","options":["阿魏酸停留","慕尼黑麦芽和特色麦芽","瓶内二次发酵","发酵温度","酵母菌株"],"answer":[1],"explain":"深色博克（BJCP 5B） 中的深色水果特征（葡萄干、李子）主要来自慕尼黑麦芽（Munich malt） 和\n特色麦芽（specialty malts） 的美拉德反应产物和深色水果酯前体。\n酵母（拉格酵母）贡献极低酯类，发酵温度和瓶内发酵对深色水果特征影响有限。","tag":"原题 202","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":202},{"id":"S203","cat":"啤酒风格与比较","type":"tf","stem":"美式波特啤酒（American Porter）香气以焦糖、坚果和烤麦芽香为主。","options":["正确","错误"],"answer":[0],"explain":"美式波特（BJCP 20A） 的香气以焦糖（caramel）、坚果（nutty）、烤麦芽（roasted malt） 为\n主导，辅以中低至中等的美式酒花香气（柑橘/松香）。","tag":"原题 203","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":203},{"id":"S205","cat":"啤酒风格与比较","type":"single","stem":"美国琥珀艾尔（American Amber Ale）和加州普通啤酒（California Common）的相似之处 是：","options":["这两种风格的香气中都允许轻微的辛辣酚类","这两种风格传统上都使用美国原料","两种风格的酒精度均不得超过 6%","两种风格均使用顶层发酵酵母","这两种风格均起源于旧金山"],"answer":[1],"explain":"美国琥珀艾尔（BJCP 19B） 和 加州普通啤酒（BJCP 19A） 均为美式风格，传统上使用美国原料（美\n国麦芽、美国酒花）。\nA 错误：辛辣酚类非两者特征；C 错误：美国琥珀艾尔 ABV 4.5%-6.2%，可超过 6%；D 错误：加州普\n通啤酒使用拉格酵母或艾尔酵母在低温下发酵；E 错误：仅加州普通啤酒起源于旧金山。","tag":"原题 205","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":205},{"id":"S206","cat":"感官与异味","type":"multi","stem":"请选择所有适用项。哪些因素会提升啤酒中熟玉米（DMS）味的水平？","options":["麦芽粉中高比例的皮尔森麦芽","完全覆盖的剧烈沸腾","过早将啤酒从酵母中移出","作为辅料使用高比例玉米","布雷塔酵母"],"answer":[0,3],"explain":"DMS（二甲基硫） 的前体是 SMM（S-甲基蛋氨酸），在煮沸过程中热降解为 DMS。DMS 需通过剧烈、\n开放式煮沸挥发去除。\nA（高比例皮尔森麦芽）正确。 皮尔森麦芽 SMM 含量显著高于其他麦芽（约 5-8 倍），最易产生\nDMS。\nD（高比例玉米辅料）正确。 玉米本身含有 DMS 前体，高比例使用玉米辅料会提升 DMS 水平。\nB（完全覆盖剧烈沸腾）错误——剧烈沸腾且敞口才能挥发 DMS，完全覆盖会保留 DMS；C（过早分离\n酵母）→乙醛；E（Brettanomyces）不产生 DMS。","tag":"原题 206","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":206},{"id":"S207","cat":"酿造原料与工艺","type":"tf","stem":"苹果酒味、青苹果特征在全麦芽麦汁中比高辅料麦汁更常见。","options":["正确","错误"],"answer":[0],"explain":"乙醛（青苹果/苹果酒味） 在全麦芽麦汁中更常见，因为全麦芽麦汁的 FAN（游离氨基氮）水平更高，\n酵母代谢更旺盛，若过早分离酵母则乙醛积累。\n高辅料麦汁（含玉米/大米）的 FAN 和蛋白质水平较低，酵母活性相对温和。","tag":"原题 207","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":207},{"id":"S208","cat":"啤酒风格与比较","type":"single","stem":"科尔施啤酒（Kölsch）的余味最佳特征为：","options":["略微偏向啤酒花，酒精感低","柔和、干爽，略带清脆感，不尖锐或刺口","干型，几乎感觉不到麦芽味","清爽，带有啤酒花收尾","口感干净，经过贮藏过程带有轻微的涩味"],"answer":[1],"explain":"科隆啤酒（BJCP 5B） 的收尾为柔和（soft）、干爽（dry）、清脆（crisp），不尖锐或刺口。\nC 错误：科隆应有柔和麦芽味；D/E 错误：科隆酒花收尾不明显，涩味为缺陷。","tag":"原题 208","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"source","flag":"","sourceNo":208},{"id":"S209","cat":"BJCP评审与制度","type":"tf","stem":"除面包、饼干和水外，携带其他食物到评审桌是允许的。","options":["正确","错误"],"answer":[1],"explain":"【答案尚待核验】比赛桌食品规定待核\nBJCP 评审桌严禁携带任何食物或饮品（除用于清洁味蕾的饮用水和面包/苏打饼干外）。\n其他食物会干扰感官评审。","tag":"原题 209","source":"https://www.bjcp.org/bjcp-style-guidelines/","status":"review","flag":"比赛桌食品规定待核","sourceNo":209},{"id":"S212","cat":"啤酒风格与比较","type":"single","stem":"对表现出明显果香的慕尼黑淡色啤（Munich Helles）的适当反馈可能是：","options":["投放酵母温度比发酵温度高 5-10 华氏度（3-6 摄氏度），以确保发酵活
